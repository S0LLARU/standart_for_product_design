<title>Чек-лист «Меньше, но лучше»</title>
<meta name="description" content="Проверка продукта по стандарту дизайна на основе десяти принципов Дитера Рамса">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Раскладка: корпус прибора — тёплый светлый серый, тёмные надписи, шильдики с номерами требований.
   Цвет появляется только там, где он что-то значит: статус пункта и серьёзность находки. */
:root {

  --surface: #F8F7F4;
  --sunk: #E2DFD8;
  --ink: #1D1D1B;
  --muted: #5A5852;

  --unk: #45567A; --unk-bg: #DCE1EB;
  --p0: #A93527; --p1: #A84A16; --p2: #8A5A00; --p3: #67645D;
  --f-display: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Golos Text", "Helvetica Neue", Arial, sans-serif;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191917; --surface: #23231F; --sunk: #2C2B27; --ink: #ECEAE4; --muted: #A9A69D; --line: #3D3C37;
    --signal: #F07A42;
    --ok: #74C493; --ok-bg: #1E3225; --warn: #E2B45C; --warn-bg: #3A2F17; --bad: #F2887A; --bad-bg: #3F221E;
    --na: #A9A69D; --na-bg: #2F2E2A; --unk: #A3B4D8; --unk-bg: #242C3B;
    --p0: #F2887A; --p1: #EE9E68; --p2: #E2B45C; --p3: #A9A69D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191917; --surface: #23231F; --sunk: #2C2B27; --ink: #ECEAE4; --muted: #A9A69D; --line: #3D3C37;
  --signal: #F07A42;
  --ok: #74C493; --ok-bg: #1E3225; --warn: #E2B45C; --warn-bg: #3A2F17; --bad: #F2887A; --bad-bg: #3F221E;
  --na: #A9A69D; --na-bg: #2F2E2A; --unk: #A3B4D8; --unk-bg: #242C3B;

  color-scheme: dark;
}

* { box-sizing: border-box; }
body {

  color: var(--ink);
  font: 400 16px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }

/* ---------- Шапка */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.2) blur(8px);

}
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 56px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 15px/1 var(--f-display); text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
.brand .lamp { width: 9px; height: 9px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--signal) 22%, transparent); }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav button {
  border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--muted);
}
.nav button[aria-current="page"] { color: var(--ink); background: var(--sunk); }
.nav button:hover { color: var(--ink); }

/* ---------- Общие элементы */
.eyebrow { font: 500 12px/1.3 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.plate {
  display: inline-flex; align-items: center; font: 500 12px/1 var(--f-mono); letter-spacing: 0.04em;
  border: 1px solid var(--ink); border-radius: 3px; padding: 4px 6px 3px; white-space: nowrap;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { opacity: 0.88; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.small { min-height: 34px; padding: 0 14px; font-size: 14px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--muted); font-size: 14px; }
.linkbtn:hover { color: var(--ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.muted { color: var(--muted); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 16px; }
.hidden-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Главная */
.home { padding-block: 40px 64px; display: grid; gap: 44px; }
.hero { display: grid; gap: 14px; max-width: 760px; }
.hero h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.08; font-weight: 800; }
.hero p { font-size: 18px; color: var(--muted); max-width: 62ch; }
.motto { font: 600 15px/1.4 var(--f-display); color: var(--ink); }
.motto span { color: var(--muted); font-weight: 500; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.section-head h2 { font-size: 22px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.mode {
  text-align: left; padding: 20px; cursor: pointer; display: grid; gap: 10px; align-content: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
.mode:hover { border-color: var(--ink); }
.mode h3 { font-size: 19px; }
.mode .count { font: 500 13px/1 var(--f-mono); color: var(--muted); }
.mode p { color: var(--muted); font-size: 15px; }
.mode.main { border-color: var(--ink); }
.mode .badge-main { justify-self: start; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; background: var(--ink); color: var(--surface); padding: 3px 8px; border-radius: 4px; }
.draft { padding: 18px 20px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.draft .info { display: grid; gap: 4px; min-width: 0; }
.draft .info strong { font-size: 17px; overflow-wrap: anywhere; }

.history { display: grid; }
.history-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center;
  padding: 14px 4px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0;
  text-align: left; cursor: pointer; width: 100%;
}
.history-row:first-child { border-top: 1px solid var(--line); }
.history-row:hover .h-title { text-decoration: underline; text-underline-offset: 3px; }
.h-title { font-weight: 600; overflow-wrap: anywhere; }
.h-meta { font-size: 14px; color: var(--muted); grid-column: 1; }
.h-verdict { grid-column: 2; grid-row: 1 / span 2; }
.empty { padding: 28px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

/* ---------- Вердикт-пилюли */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.tone-ok { color: var(--ok); background: var(--ok-bg); }
.tone-warn { color: var(--warn); background: var(--warn-bg); }
.tone-bad { color: var(--bad); background: var(--bad-bg); }
.tone-neutral { color: var(--muted); background: var(--sunk); }

/* ---------- Настройка */
.setup { padding-block: 32px 64px; max-width: 680px; display: grid; gap: 24px; }
.setup h1 { font-size: 32px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; }
.field .hint { font-size: 14px; color: var(--muted); }
.field input, .field textarea, .note textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; min-height: 44px;
}
.field input:focus, .field textarea:focus, .note textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 1px var(--ink); }
.field textarea { min-height: 84px; resize: vertical; }
.error-text { color: var(--bad); font-size: 14px; }

/* ---------- Проверка */
.check { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 32px; padding-block: 24px 64px; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: grid; gap: 18px; }
.side .review-name { display: grid; gap: 4px; }
.side .review-name strong { font: 700 17px/1.25 var(--f-display); overflow-wrap: anywhere; }
.progress { height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--ink); width: 0; transition: width .25s ease; }
.progress-label { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.groups { display: grid; gap: 2px; list-style: none; padding: 0; margin: 0; }
.groups button {
  width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left;
  border: 0; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; color: var(--muted);
}
.groups button:hover { background: var(--sunk); color: var(--ink); }
.groups button[aria-current="step"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.groups .g-count { font: 500 12px/1 var(--f-mono); }
.groups .g-done .g-count { color: var(--ok); }
.groups .g-flag { color: var(--bad); }
.toggle { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--ink); }

.group-head { display: grid; gap: 8px; margin-bottom: 20px; }
.group-head h2 { font-size: clamp(24px, 3.4vw, 32px); }
.group-head p { color: var(--muted); max-width: 62ch; }
.items { display: grid; gap: 14px; }
.item { padding: 20px; display: grid; gap: 14px; scroll-margin-top: 80px; }
.item.answered { background: color-mix(in srgb, var(--surface) 70%, var(--bg)); }
.item-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.item-top .quick { font-size: 12px; font-weight: 600; color: var(--muted); }
.item h3 { font: 600 19px/1.35 var(--f-display); letter-spacing: -0.005em; }
.design-note { font-size: 13px; color: var(--muted); }
.hint-box { display: grid; gap: 8px; font-size: 15px; padding: 14px 16px; background: var(--bg); border-radius: 8px; }
.hint-box .h-label { font-weight: 600; }
.hint-box .red { color: var(--muted); }
.hint-box .req-line { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }

.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice {
  display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 15px;
}
.choice:hover { border-color: var(--ink); }
.choice .ic { font-weight: 700; width: 1em; text-align: center; }
.choice[aria-pressed="true"] { font-weight: 600; }
.choice.s-yes[aria-pressed="true"] { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); }
.choice.s-partial[aria-pressed="true"] { color: var(--warn); background: var(--warn-bg); border-color: var(--warn); }
.choice.s-no[aria-pressed="true"] { color: var(--bad); background: var(--bad-bg); border-color: var(--bad); }
.choice.s-na[aria-pressed="true"] { color: var(--na); background: var(--na-bg); border-color: var(--na); }
.choice.s-unknown[aria-pressed="true"] { color: var(--unk); background: var(--unk-bg); border-color: var(--unk); }
.sev-block { display: grid; gap: 8px; }
.sev-label { font-size: 14px; font-weight: 600; }
.sev-label span { font-weight: 400; color: var(--muted); }
.sev { min-height: 36px; padding: 0 12px; font-size: 14px; }
.sev .code { font-family: var(--f-mono); font-size: 12px; }
.sev[aria-pressed="true"] { color: var(--surface); }
.sev.P0[aria-pressed="true"] { background: var(--p0); border-color: var(--p0); }
.sev.P1[aria-pressed="true"] { background: var(--p1); border-color: var(--p1); }
.sev.P2[aria-pressed="true"] { background: var(--p2); border-color: var(--p2); }
.sev.P3[aria-pressed="true"] { background: var(--p3); border-color: var(--p3); }
.sev-desc { font-size: 13px; color: var(--muted); }
.note { display: grid; gap: 6px; }
.note label { font-size: 14px; font-weight: 600; }
.note textarea { min-height: 64px; resize: vertical; font-size: 15px; }
.exc { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.exc input { width: 18px; height: 18px; accent-color: var(--ink); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; flex-wrap: wrap; }

/* ---------- Итог */
.summary { padding-block: 32px 64px; display: grid; gap: 28px; max-width: 900px; }
.verdict { padding: 24px; border-radius: var(--radius); display: grid; gap: 10px; border: 1px solid currentColor; }
.verdict h1 { font-size: clamp(26px, 4vw, 36px); color: inherit; }
.verdict ul { margin: 0; padding-left: 20px; color: var(--ink); display: grid; gap: 4px; }
.verdict .v-eyebrow { color: inherit; opacity: 0.85; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { padding: 14px 16px; display: grid; gap: 2px; }
.stat b { font: 700 26px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.stat.P0 b { color: var(--p0); } .stat.P1 b { color: var(--p1); } .stat.P2 b { color: var(--p2); } .stat.P3 b { color: var(--p3); }
.findings { display: grid; gap: 10px; }
.finding { padding: 16px 18px; display: grid; gap: 8px; border-left: 4px solid var(--line); }
.finding.P0 { border-left-color: var(--p0); } .finding.P1 { border-left-color: var(--p1); } .finding.P2 { border-left-color: var(--p2); } .finding.P3 { border-left-color: var(--p3); }
.finding .f-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.finding .f-sev { font: 500 12px/1 var(--f-mono); font-weight: 700; }
.finding.P0 .f-sev { color: var(--p0); } .finding.P1 .f-sev { color: var(--p1); } .finding.P2 .f-sev { color: var(--p2); } .finding.P3 .f-sev { color: var(--p3); }
.finding .f-q { font-weight: 600; }
.finding .f-note { white-space: pre-wrap; overflow-wrap: anywhere; }
.finding .f-note.empty-note { color: var(--bad); font-size: 14px; }
.export { padding: 20px; display: grid; gap: 14px; }
.export textarea { width: 100%; min-height: 220px; font: 13px/1.5 var(--f-mono); border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--bg); }
.save-status { font-size: 14px; color: var(--muted); }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 8px; background: var(--bad-bg); color: var(--bad); }
.list-plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.more { padding: 0; }
.more summary { display: flex; justify-content: space-between; gap: 12px; padding: 14px 18px; cursor: pointer; font: 600 17px/1.3 var(--f-display); list-style: none; }
.more summary::-webkit-details-marker { display: none; }
.more summary::after { content: "+"; font-weight: 400; color: var(--muted); }
.more[open] summary::after { content: "−"; }
.more .list-plain { padding: 0 18px 16px 38px; font-size: 15px; }

/* ---------- Справочник */
.guide { padding-block: 32px 64px; display: grid; gap: 32px; }
.guide-intro { display: grid; gap: 10px; max-width: 760px; }
.guide-intro h1 { font-size: clamp(28px, 4.4vw, 40px); }
.guide-intro p { color: var(--muted); font-size: 17px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.principle { display: grid; gap: 12px; }
.principle-head { display: flex; gap: 14px; align-items: baseline; border-bottom: 1px solid var(--ink); padding-bottom: 10px; }
.principle-head .num { font: 800 34px/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: 1.4em; }
.principle-head h2 { font-size: 22px; }
.req { padding: 18px 20px; display: grid; gap: 10px; }
.req .r-text { font-weight: 600; }
.req .r-q { display: grid; gap: 2px; font-size: 15px; }
.req .r-q b { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.req .r-red { font-size: 14px; color: var(--muted); }

/* ---------- Уведомление */
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%);
  background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500;
  max-width: calc(100% - 32px); z-index: 20;
}


/* ---------- Критерии */
.sources-line { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.sources-line a { color: inherit; text-underline-offset: 2px; }
.crits { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.crit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.crit-text { font-size: 15.5px; }
.crit-side { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.yn { min-height: 34px; min-width: 52px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; }
.yn:hover { border-color: var(--ink); }
.yn.y[aria-pressed="true"] { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); font-weight: 600; }
.yn.n[aria-pressed="true"] { color: var(--bad); background: var(--bad-bg); border-color: var(--bad); font-weight: 600; }
.crits.off { opacity: 0.45; }
.ai-mark { font: 500 12px/1 var(--f-mono); padding: 4px 6px; border-radius: 4px; white-space: nowrap; }
.ai-mark.t { color: var(--ok); background: var(--ok-bg); }
.ai-mark.f { color: var(--bad); background: var(--bad-bg); }
.ai-mark.u { color: var(--unk); background: var(--unk-bg); }
.item-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.item-foot .choices { gap: 6px; }
.item-foot .choice { min-height: 34px; font-size: 14px; padding: 0 12px; }
.result { font-size: 14px; color: var(--muted); }
.result .pill { margin-left: 6px; }
.tone-partial { color: var(--warn); background: var(--warn-bg); }
.tone-yes { color: var(--ok); background: var(--ok-bg); }
.tone-no { color: var(--bad); background: var(--bad-bg); }
.tone-na, .tone-pending { color: var(--na); background: var(--na-bg); }
.tone-unknown { color: var(--unk); background: var(--unk-bg); }
.ai-box { display: grid; gap: 8px; padding: 12px 14px; border-radius: 8px; background: var(--unk-bg); font-size: 15px; }
.ai-box .ai-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; color: var(--unk); }
.ai-box.conflict { background: var(--warn-bg); }
.ai-box.conflict .ai-head { color: var(--warn); }
.ai-box textarea { width: 100%; min-height: 56px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); resize: vertical; }
.ai-box .ai-ev { overflow-wrap: anywhere; }

/* ---------- ИИ-проверка */

<script type="application/json" id="checklist-data">__CHECKLIST_DATA__</script>
<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------ Данные
  const DATA = JSON.parse(document.getElementById("checklist-data").textContent);
  const ITEMS = DATA.items;
  const BY_ID = Object.fromEntries(ITEMS.map((i) => [i.id, i]));
  const GROUPS = DATA.groups;
  const PRINCIPLES = Object.fromEntries(DATA.principles.map((p) => [p.n, p]));

  const MODES = {
    design: { title: "Дизайн-ревью", ctx: "design", main: true, ai: true,
      desc: "Макет или прототип перед передачей в разработку. Главная проверка.", filter: (i) => i.stage !== "Р" },
    quick: { title: "Быстрая проверка", ctx: "design", ai: false,
      desc: "Самые важные пункты, чтобы прогнать макет на ходу. Не заменяет дизайн-ревью.", filter: (i) => i.quick },
    release: { title: "Приёмка сборки", ctx: "build", ai: true,
      desc: "Работающая сборка против макета перед выпуском.", filter: (i) => i.stage !== "М" },
    audit: { title: "Аудит продукта", ctx: "build", ai: true,
      desc: "Существующий продукт: найти всё, что не дотягивает до стандарта, и составить план.", filter: () => true },
  };
  const MODE_ORDER = ["design", "quick", "release", "audit"];
  const STATUS_LABEL = { yes: "Да", partial: "Частично", no: "Нет", na: "Н/п", unknown: "Не проверить" };
  const STATUS_MD = { yes: "✅", partial: "⚠️", no: "❌", na: "н/п", unknown: "не проверено" };
  const SEV = [
    { k: "P0", label: "Блокер", desc: "не закончит задачу, потеряет данные или будет введён в заблуждение" },
    { k: "P1", label: "Серьёзно", desc: "трудно восстановиться после ошибки, непонятно, что происходит" },
    { k: "P2", label: "Нагрузка", desc: "лишние действия, поиск, запоминание" },
    { k: "P3", label: "Полировка", desc: "мелкие визуальные неточности" },
  ];
  const SEV_ORDER = { P0: 0, P1: 1, P2: 2, P3: 3 };
  const LEVEL = { "О": "Обязательно", "Р": "Рекомендуется" };
  const STAGE = { "М": "Макет", "М+Р": "Макет и сборка", "Р": "Сборка" };
  const FINDING = (s) => s === "partial" || s === "no";

  // ------------------------------------------------------------------ Утилиты
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const plural = (n, a, b, c) => {
    const m10 = n % 10, m100 = n % 100;
    return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c;
  };
  const fmtDate = (ts) => { try { return new Date(ts).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" }); } catch (e) { return ""; } };
  const fmtTime = (ts) => { try { return new Date(ts).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* хранилище недоступно */ } },
  };
  const DRAFT_KEY = "mnl-checklist-draft-v2";
  const PREF_KEY = "mnl-checklist-prefs-v1";

  let toastTimer = null;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
  }

  // ------------------------------------------------------------------ Состояние
  const prefs = Object.assign({ hints: true }, store.get(PREF_KEY) || {});
  const state = { view: "home", review: null, groupIdx: 0, setupMode: null, guideStage: "all", confirmDelete: false, exportOpen: false };
  const ai = { files: [], urls: [], running: false, done: 0, total: 0, ctl: null, error: "", pasteError: "" };

  const draft = store.get(DRAFT_KEY);
  if (draft && draft.review && MODES[draft.review.mode]) {
    state.review = draft.review;
    state.groupIdx = draft.groupIdx || 0;
    if (["check", "summary", "ai"].includes(draft.view)) state.view = draft.view;
  }
  if (location.hash === "#guide") state.view = "guide";

  let draftTimer = null;
  function flushDraft() {
    clearTimeout(draftTimer); draftTimer = null;
    if (state.review) store.set(DRAFT_KEY, { review: state.review, view: state.view, groupIdx: state.groupIdx });
  }
  function persistDraft() { clearTimeout(draftTimer); draftTimer = setTimeout(flushDraft, 250); }
  window.addEventListener("pagehide", flushDraft);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushDraft(); });

  // ------------------------------------------------------------------ Пункты и ответы
  function modeItems(mode) { return ITEMS.filter(MODES[mode].filter); }
  function modeGroups(mode) {
    const items = modeItems(mode);
    return GROUPS.map((g) => ({ ...g, items: items.filter((i) => i.group === g.key) })).filter((g) => g.items.length);
  }
  const isDesign = (mode) => MODES[mode].ctx === "design";
  const q = (item, mode) => (isDesign(mode) ? item.qDesign : item.q);
  const how = (item, mode) => (isDesign(mode) ? item.howDesign : item.how);
  const crit = (item, mode) => (isDesign(mode) ? item.criteriaDesign : item.criteria);

  function ans(id, review = state.review) { return (review && review.answers[id]) || {}; }

  // Итог пункта по критериям: все «да» — Да, все «нет» — Нет, вперемешку — Частично.
  function statusFrom(c, n) {
    if (!Array.isArray(c)) return undefined;
    const vals = Array.from({ length: n }, (_, k) => c[k]);
    if (vals.some((v) => v !== true && v !== false)) return undefined;
    const yes = vals.filter((v) => v === true).length;
    return yes === n ? "yes" : yes === 0 ? "no" : "partial";
  }
  function statusOf(id, review = state.review) {
    const a = ans(id, review);
    if (a.x) return a.x;
    const n = crit(BY_ID[id], review.mode).length;
    return statusFrom(a.c, n) || (Array.isArray(a.c) ? undefined : a.s);
  }
  function marked(id) {
    const a = ans(id); const n = crit(BY_ID[id], state.review.mode).length;
    return Array.isArray(a.c) ? a.c.slice(0, n).filter((v) => v === true || v === false).length : 0;
  }

  // Ответ ИИ по пункту.
  function aiOf(id, review = state.review) { return review && review.ai && review.ai.items ? review.ai.items[id] : null; }
  function aiStatus(id, review = state.review) {
    const r = aiOf(id, review);
    if (!r) return undefined;
    if (r.na) return "na";
    const c = r.c || [];
    if (c.some((v) => v === false)) return c.some((v) => v === true) ? "partial" : "no";
    if (c.length && c.every((v) => v === true)) return "yes";
    return "unknown";
  }
  // Сверка двух проверок по пункту.
  function reconcile(id, review = state.review) {
    const a = aiStatus(id, review);
    if (a === undefined) return "noai";
    const h = statusOf(id, review);
    if (!h) return "pending";
    if (FINDING(a) && FINDING(h)) return "agree";
    if (FINDING(a)) return ans(id, review).aiReject && ans(id, review).aiReject.trim() ? "rejected" : "conflict";
    if (FINDING(h)) return "human-only";
    if (a === "unknown") return "ai-unknown";
    return "agree";
  }

  // ------------------------------------------------------------------ Вердикт
  function analyze(review) {
    const items = modeItems(review.mode);
    const st = (i) => statusOf(i.id, review);
    const a = (i) => ans(i.id, review);
    const unanswered = items.filter((i) => !st(i));
    const findings = items.filter((i) => FINDING(st(i)));
    const noSev = findings.filter((i) => !a(i).sev);
    const sevCount = { P0: 0, P1: 0, P2: 0, P3: 0 };
    findings.forEach((i) => { if (a(i).sev) sevCount[a(i).sev]++; });
    const mandatoryOpen = findings.filter((i) => i.level === "О" && !a(i).exc);
    const unknown = items.filter((i) => st(i) === "unknown");
    const unknownMandatory = unknown.filter((i) => i.level === "О");
    const recommendedOpen = items.filter((i) => i.level === "Р" && !["yes", "na"].includes(st(i)));
    const rec = Object.fromEntries(items.map((i) => [i.id, reconcile(i.id, review)]));
    const by = (k) => items.filter((i) => rec[i.id] === k);
    const aiDone = !!(review.ai && review.ai.items);
    const aiFindings = items.filter((i) => FINDING(aiStatus(i.id, review)));
    return {
      items, unanswered, findings, noSev, sevCount, mandatoryOpen, unknown, unknownMandatory, recommendedOpen,
      answered: items.length - unanswered.length, aiDone, aiFindings,
      conflicts: by("conflict"), rejected: by("rejected"), agree: by("agree"), humanOnly: by("human-only"), aiUnknown: by("ai-unknown"),
    };
  }

  function verdict(review) {
    const x = analyze(review);
    const m = MODES[review.mode];
    const blockers = x.sevCount.P0 + x.sevCount.P1;
    const incomplete = [];
    if (x.unanswered.length) incomplete.push(`Без ответа: ${x.unanswered.length} ${plural(x.unanswered.length, "пункт", "пункта", "пунктов")}.`);
    if (x.noSev.length) incomplete.push(`У ${x.noSev.length} ${plural(x.noSev.length, "находки", "находок", "находок")} не указана серьёзность.`);
    const mand = x.mandatoryOpen.length ? `Обязательные пункты без исправления или исключения: ${x.mandatoryOpen.map((i) => i.id).join(", ")}.` : null;
    const unk = x.unknownMandatory.length ? `Человек не смог проверить обязательные пункты: ${x.unknownMandatory.map((i) => i.id).join(", ")}. Найдите способ проверить их.` : null;
    const conflicts = x.conflicts.length ? `Находки ИИ без решения человека: ${x.conflicts.map((i) => i.id).join(", ")}. Подтвердите их или отклоните с причиной.` : null;
    const noAi = m.ai && !x.aiDone ? "ИИ-проверка ещё не проведена. Без неё вердикт не выносится." : null;

    if (review.mode === "design" || review.mode === "quick") {
      const quick = review.mode === "quick";
      if (statusOf("R2.1", review) === "no") return { tone: "bad", title: "Вернуться к задаче", detail: ["Непонятны пользователь или момент ценности (R2.1). Сначала заполните описание решения, потом возвращайтесь к экранам."] };
      if (blockers) return { tone: "bad", title: quick ? "Есть блокеры" : "Доработать", detail: [`Блокеров: ${x.sevCount.P0}, серьёзных: ${x.sevCount.P1}. Исправьте их в макете и повторите ${quick ? "проверку" : "ревью"}.`, mand, conflicts].filter(Boolean) };
      if (incomplete.length) return { tone: "neutral", title: quick ? "Проверка не завершена" : "Ревью не завершено", detail: [...incomplete, conflicts].filter(Boolean) };
      if (conflicts) return { tone: "warn", title: "Сверить с ИИ-проверкой", detail: [conflicts] };
      if (x.mandatoryOpen.length) return { tone: "warn", title: "Доработать", detail: [mand, "Исправьте в макете или оформите исключение с датой пересмотра."] };
      if (unk) return { tone: "neutral", title: "Не хватает проверок", detail: [unk] };
      if (noAi) return { tone: "neutral", title: "Остаётся ИИ-проверка", detail: ["Проверка человеком пройдена.", noAi] };
      if (quick) return { tone: "ok", title: "Явных блокеров нет", detail: ["Можно идти на полное дизайн-ревью."] };
      const d = ["Обе проверки проведены. Нет открытых P0 и P1, обязательные пункты выполнены или оформлены исключением."];
      if (x.sevCount.P2 + x.sevCount.P3) d.push(`Находки P2 и P3 (${x.sevCount.P2 + x.sevCount.P3}) заведите задачами с номерами требований.`);
      return { tone: "ok", title: "Готово к передаче", detail: d };
    }

    if (review.mode === "release") {
      if (x.sevCount.P0) return { tone: "bad", title: "Нельзя выпускать", detail: [`Блокеров: ${x.sevCount.P0}. P0 исправляется до выпуска.`, conflicts].filter(Boolean) };
      if (incomplete.length) return { tone: "neutral", title: "Приёмка не завершена", detail: [...incomplete, conflicts].filter(Boolean) };
      if (conflicts) return { tone: "warn", title: "Сверить с ИИ-проверкой", detail: [conflicts] };
      if (unk) return { tone: "neutral", title: "Не хватает проверок", detail: [unk] };
      if (x.mandatoryOpen.length) return { tone: "warn", title: "Решить до выпуска", detail: [mand, "Исправьте или оформите исключение с датой пересмотра."] };
      if (noAi) return { tone: "neutral", title: "Остаётся ИИ-проверка", detail: ["Проверка человеком пройдена.", noAi] };
      const d = ["Обе проверки проведены. Блокеров нет, обязательные пункты выполнены или оформлены исключением."];
      if (x.sevCount.P1) d.push(`Серьёзные находки (${x.sevCount.P1}) исправить в ближайшем цикле.`);
      return { tone: "ok", title: "Можно выпускать", detail: d };
    }

    // Аудит
    const pending = [...incomplete, conflicts, noAi].filter(Boolean);
    const pre = pending.length ? "Предварительно · " : "";
    if (x.sevCount.P0) return { tone: "bad", title: pre + "Ниже уровня 1", detail: [`Блокеров: ${x.sevCount.P0}. Сначала исправьте их.`, ...pending] };
    if (x.sevCount.P1 || x.mandatoryOpen.length) return { tone: "warn", title: pre + "Уровень 1 · Работает", detail: [`Для уровня 2 закройте серьёзные находки (${x.sevCount.P1}) и обязательные пункты.`, mand, ...pending].filter(Boolean) };
    if (x.recommendedOpen.length || !review.peopleChecked) {
      const need = [];
      if (x.recommendedOpen.length) need.push(`рекомендованные пункты: ${x.recommendedOpen.map((i) => i.id).join(", ")}`);
      if (!review.peopleChecked) need.push("подтверждение наблюдением за людьми");
      return { tone: "ok", title: pre + "Уровень 2 · Понятно и честно", detail: [`Для уровня 3 не хватает: ${need.join("; ")}.`, unk, ...pending].filter(Boolean) };
    }
    return { tone: "ok", title: pre + "Уровень 3 · Меньше, но лучше", detail: ["Все требования выполнены, результат подтверждён наблюдением за людьми.", unk, ...pending].filter(Boolean) };
  }

  // ------------------------------------------------------------------ Возможности платформы
  const cap = { db: null, user: null, downloads: null, sample: null, limits: null, myId: null, history: [], historyState: "loading" };
  let saveChain = Promise.resolve();
  let teamTimer = null;
  let saveStatus = "";

  async function initCapabilities() {
    if (!window.claude || typeof window.claude.use !== "function") { cap.historyState = "off"; refreshHistory(); return; }
    const use = (n) => window.claude.use(n).catch(() => null);
    const [db, user, downloads, sample] = await Promise.all([use("db"), use("user"), use("downloads"), use("sample")]);
    Object.assign(cap, { db, user, downloads, sample });
    if (sample) { try { cap.limits = await sample.limits(); } catch (e) { cap.limits = null; } }
    if (user) { try { cap.myId = await user.id(); } catch (e) { cap.myId = null; } }
    if (db) {
      db.collection("reviews").orderBy("updatedAt", "desc").limit(100).onSnapshot(
        (snap) => { cap.history = snap.docs.map((d) => ({ id: d.id, ...d.data() })); cap.historyState = "ready"; refreshHistory(); },
        () => { cap.historyState = "error"; refreshHistory(); }
      );
    } else cap.historyState = "off";
    refreshHistory();
    if (state.view === "summary" || state.view === "ai") render();
  }

  function serialize(r) {
    const x = analyze(r), v = verdict(r);
    return {
      mode: r.mode, product: r.product, scenario: r.scenario || "", link: r.link || "", people: r.people || "", aiContext: r.aiContext || "",
      answers: Object.entries(r.answers).map(([id, a]) => ({ id, c: Array.isArray(a.c) ? a.c.map((v) => (v === true || v === false ? v : null)) : [], x: a.x || "", s: a.s || "", sev: a.sev || "", note: a.note || "", exc: !!a.exc, aiReject: a.aiReject || "" })),
      ai: r.ai ? { at: r.ai.at, source: r.ai.source, summary: r.ai.summary || "", items: Object.entries(r.ai.items || {}).map(([id, i]) => ({ id, c: i.c, na: !!i.na, sev: i.sev || "", ev: i.ev || "" })) } : null,
      peopleChecked: !!r.peopleChecked, createdAt: r.createdAt, updatedAt: Date.now(), authorId: r.authorId || cap.myId || "",
      std: DATA.version, verdict: v.title, tone: v.tone, counts: x.sevCount, answered: x.answered, total: x.items.length, aiDone: x.aiDone,
    };
  }
  function deserialize(id, d) {
    const answers = {};
    (d.answers || []).forEach((a) => {
      if (!BY_ID[a.id]) return;
      answers[a.id] = { c: Array.isArray(a.c) && a.c.length ? a.c.map((v) => (v === true || v === false ? v : undefined)) : undefined, x: a.x || undefined, s: a.s || undefined, sev: a.sev || undefined, note: a.note || "", exc: !!a.exc, aiReject: a.aiReject || "" };
    });
    let aiRes = null;
    if (d.ai && Array.isArray(d.ai.items)) {
      aiRes = { at: d.ai.at, source: d.ai.source, summary: d.ai.summary || "", items: {} };
      d.ai.items.forEach((i) => { if (BY_ID[i.id]) aiRes.items[i.id] = { c: i.c || [], na: !!i.na, sev: i.sev || null, ev: i.ev || "" }; });
    }
    return {
      id, mode: MODES[d.mode] ? d.mode : "design", product: d.product || "Без названия", scenario: d.scenario || "", link: d.link || "", people: d.people || "",
      aiContext: d.aiContext || "", answers, ai: aiRes, peopleChecked: !!d.peopleChecked, createdAt: d.createdAt || Date.now(), authorId: d.authorId || "", savedToTeam: true,
    };
  }

  function teamSaveNow() {
    const r = state.review;
    if (!cap.db || !r) return;
    const col = cap.db.collection("reviews");
    const ref = r.id ? col.doc(r.id) : col.doc();
    if (!r.id) { r.id = ref.id; r.authorId = r.authorId || cap.myId || ""; }
    const body = serialize(r);
    saveStatus = "saving"; updateSaveUi();
    saveChain = saveChain.then(() => ref.set(body)).then(
      () => { r.savedToTeam = true; saveStatus = "saved:" + Date.now(); updateSaveUi(); persistDraft(); },
      (e) => { const code = e && e.code; saveStatus = code === "invalid_argument" ? "denied" : code === "quota_exceeded" ? "quota" : "error"; updateSaveUi(); }
    );
  }
  function scheduleTeamSave() {
    if (!cap.db || !state.review || !state.review.savedToTeam) return;
    clearTimeout(teamTimer); teamTimer = setTimeout(teamSaveNow, 1500);
  }
  function changed() { persistDraft(); scheduleTeamSave(); }

  function saveText() {
    if (!saveStatus) return state.review && state.review.savedToTeam ? "Сохранено в истории команды." : "";
    if (saveStatus === "saving") return "Сохраняется…";
    if (saveStatus.startsWith("saved:")) return `Сохранено в истории команды в ${fmtTime(Number(saveStatus.slice(6)))}. Дальнейшие изменения сохраняются сами.`;
    if (saveStatus === "denied") return "Нет прав на запись в историю. Попросите владельца дать доступ «Участник» или выше.";
    if (saveStatus === "quota") return "История команды заполнена. Удалите старые проверки и попробуйте снова.";
    return "Не удалось сохранить. Проверьте соединение и нажмите «Сохранить» ещё раз.";
  }
  function updateSaveUi() {
    const el = $("#save-status"); if (el) el.textContent = saveText();
    const side = $("#side-save");
    if (side) side.textContent = state.review && state.review.savedToTeam ? (saveStatus === "saving" ? "Сохраняется…" : "В истории команды") : "Черновик на этом устройстве";
  }

  // ------------------------------------------------------------------ Отрисовка
  const app = $("#app");
  function setNav() {
    $("#nav-home").setAttribute("aria-current", state.view === "guide" ? "false" : "page");
    $("#nav-guide").setAttribute("aria-current", state.view === "guide" ? "page" : "false");
  }
  function render(focusSel) {
    setNav();
    const views = { home: renderHome, setup: renderSetup, check: renderCheck, summary: renderSummary, guide: renderGuide, ai: renderAi };
    app.innerHTML = (views[state.view] || renderHome)();
    if (state.view === "home") refreshHistory();
    updateSaveUi();
    if (focusSel) { const el = $(focusSel); if (el) el.focus({ preventScroll: true }); }
  }
  const pill = (tone, text) => `<span class="pill tone-${tone}">${esc(text)}</span>`;

  function renderHome() {
    const r = state.review;
    let draftHtml = "";
    if (r) {
      const x = analyze(r);
      draftHtml = `
      <section aria-labelledby="draft-h">
        <div class="section-head"><h2 id="draft-h">Продолжить</h2></div>
        <div class="card draft">
          <div class="info">
            <span class="eyebrow">${esc(MODES[r.mode].title)}</span>
            <strong>${esc(r.product)}${r.scenario ? " · " + esc(r.scenario) : ""}</strong>
            <span class="muted">Отвечено ${x.answered} из ${x.items.length} · находок ${x.findings.length}${MODES[r.mode].ai ? (x.aiDone ? " · ИИ-проверка проведена" : " · ИИ-проверки ещё нет") : ""}${r.savedToTeam ? " · в истории команды" : ""}</span>
          </div>
          <div class="row">
            <button class="btn" type="button" data-act="open-summary">Итог</button>
            <button class="btn primary" type="button" data-act="resume">Продолжить</button>
          </div>
        </div>
      </section>`;
    }
    const modes = MODE_ORDER.map((k) => {
      const m = MODES[k], n = modeItems(k).length;
      return `<button class="mode${m.main ? " main" : ""}" type="button" data-act="new" data-mode="${k}">
        ${m.main ? '<span class="badge-main">Главная проверка</span>' : ""}
        <h3>${esc(m.title)}</h3>
        <span class="count">${n} ${plural(n, "пункт", "пункта", "пунктов")} · ${m.ai ? "человек + ИИ" : "человек"}</span>
        <p>${esc(m.desc)}</p>
      </button>`;
    }).join("");
    return `
    <div class="home">
      <section class="hero">
        <span class="eyebrow">Стандарт дизайна · версия ${esc(DATA.version)}</span>
        <h1>Две проверки по одному списку</h1>
        <p>Принципы Дитера Рамса, подход Джони Айва и Apple HIG, разложенные на ${ITEMS.length} ${plural(ITEMS.length, "пункт", "пункта", "пунктов")}. У каждого пункта — короткие критерии с ответом «да» или «нет». Человек отмечает их по прототипу, ИИ — по скриншотам. В конце — сверка, вердикт и отчёт.</p>
        <p class="motto">«Меньше, но лучше» <span>— Дитер Рамс</span></p>
      </section>
      ${draftHtml}
      <section aria-labelledby="new-h">
        <div class="section-head"><h2 id="new-h">Новая проверка</h2>${r ? '<span class="muted">Текущий черновик будет заменён</span>' : ""}</div>
        <div class="modes">${modes}</div>
      </section>
      <section aria-labelledby="hist-h">
        <div class="section-head"><h2 id="hist-h">История команды</h2></div>
        <div id="history"></div>
      </section>
    </div>`;
  }

  function refreshHistory() {
    const el = $("#history");
    if (!el) return;
    if (cap.historyState === "loading") { el.innerHTML = '<p class="empty">Загружаем историю проверок…</p>'; return; }
    if (cap.historyState === "off") { el.innerHTML = '<p class="empty">История команды доступна в опубликованной версии чек-листа на claude.ai. Здесь проверка сохраняется только на этом устройстве.</p>'; return; }
    if (cap.historyState === "error") { el.innerHTML = '<p class="empty">Не удалось загрузить историю. Обновите страницу.</p>'; return; }
    if (!cap.history.length) { el.innerHTML = '<p class="empty">Пока ни одной сохранённой проверки. Пройдите проверку и нажмите «Сохранить в историю команды» на экране итога.</p>'; return; }
    el.innerHTML = '<div class="history">' + cap.history.map((h) => {
      const mode = MODES[h.mode] ? MODES[h.mode].title : "Проверка";
      const c = h.counts || {};
      const finds = ["P0", "P1", "P2", "P3"].map((k) => (c[k] ? `${k}: ${c[k]}` : "")).filter(Boolean).join(", ");
      return `<button type="button" class="history-row" data-act="open-history" data-id="${esc(h.id)}">
        <span class="h-title">${esc(h.product || "Без названия")}${h.scenario ? " · " + esc(h.scenario) : ""}</span>
        <span class="h-meta">${esc(mode)} · ${esc(fmtDate(h.updatedAt))}${h.authorId ? ` · <span data-author="${esc(h.authorId)}"></span>` : ""}${finds ? " · " + esc(finds) : ""}${MODES[h.mode] && MODES[h.mode].ai ? (h.aiDone ? " · ИИ ✓" : " · без ИИ") : ""}</span>
        <span class="h-verdict">${pill(esc(h.tone || "neutral"), h.verdict || "")}</span>
      </button>`;
    }).join("") + "</div>";
    resolveAuthors();
  }
  async function resolveAuthors() {
    if (!cap.user) return;
    const spans = Array.from(document.querySelectorAll("[data-author]"));
    if (!spans.length) return;
    const ids = Array.from(new Set(spans.map((s) => s.dataset.author)));
    let ps = {};
    try { ps = await cap.user.profiles(ids); } catch (e) { return; }
    spans.forEach((s) => { const p = ps[s.dataset.author]; s.textContent = (p && p.name) || "участник команды"; });
  }

    const n = modeItems(state.setupMode).length;
    const scenarioHint = state.setupMode === "audit"

      : "Например: «Запись на встречу с телефона».";

      </div>
      <div class="field">

        <input id="f-link" name="link" inputmode="url" autocomplete="off">

      </div>
      <div class="row"><button class="btn primary" type="submit">Начать проверку</button></div>

  function sideHtml() {
    const r = state.review, groups = modeGroups(r.mode), x = analyze(r);
    const pct = x.items.length ? Math.round((x.answered / x.items.length) * 100) : 0;
    const list = groups.map((g, idx) => {
      const done = g.items.filter((i) => statusOf(i.id)).length;
      const flags = g.items.filter((i) => FINDING(statusOf(i.id))).length;
      const conf = g.items.filter((i) => reconcile(i.id) === "conflict").length;
      return `<li><button type="button" data-act="group" data-idx="${idx}" ${idx === state.groupIdx && state.view === "check" ? 'aria-current="step"' : ""} class="${done === g.items.length ? "g-done" : ""}">
        <span>${esc(g.title)}${flags ? ` <span class="g-flag" aria-label="находок: ${flags}">●</span>` : ""}${conf ? ` <span class="g-flag" style="color:var(--warn)" aria-label="расхождений с ИИ: ${conf}">◆</span>` : ""}</span>
        <span class="g-count">${done}/${g.items.length}</span>
      </button></li>`;
    }).join("");
    const aiLabel = !MODES[r.mode].ai ? "по желанию" : ai.running ? "идёт…" : x.aiDone ? (x.conflicts.length ? `расхождений ${x.conflicts.length}` : "проведена") : "не проведена";
    return `

      <div class="review-name">

        <strong>${esc(r.product)}</strong>
        <span class="tag" id="side-save"></span>
      </div>
      <div class="stack" style="gap:6px">
        <div class="progress" role="progressbar" aria-label="Отвечено" aria-valuemin="0" aria-valuemax="${x.items.length}" aria-valuenow="${x.answered}"><span style="width:${pct}%"></span></div>
        <div class="progress-label"><span>Отвечено ${x.answered} из ${x.items.length}</span><span>Находок ${x.findings.length}</span></div>
      </div>
      <ul class="groups">${list}
        <li><button type="button" data-act="open-ai" ${state.view === "ai" ? 'aria-current="step"' : ""}><span>ИИ-проверка</span><span class="g-count">${esc(aiLabel)}</span></button></li>
        <li><button type="button" data-act="open-summary" ${state.view === "summary" ? 'aria-current="step"' : ""}><span>Итог и отчёт</span><span class="g-count">→</span></button></li>
      </ul>
      <label class="toggle"><input type="checkbox" id="hints-toggle" ${prefs.hints ? "checked" : ""}> Показывать подсказки</label>
    </aside>`;

  function sourcesHtml(i) {
    const parts = [`<span>Рамс ${i.principle} · ${esc(PRINCIPLES[i.principle].short)}</span>`];
    i.ive.forEach((s) => parts.push(`<span title="${esc(s.title)}">Айв ${s.n}</span>`));
    i.hig.forEach((s) => parts.push(`<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.title)}">HIG ${esc(s.key)}</a>`));
    i.w3c.forEach((s) => parts.push(`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`));
    return `<div class="sources-line" aria-label="Основания">${parts.join("")}</div>`;
  }

  function aiBoxHtml(i) {
    const r = aiOf(i.id);
    if (!r) return "";
    const rec = reconcile(i.id);
    if (rec === "pending") return '<p class="ai-hidden">Ответ ИИ по этому пункту откроется после вашего ответа — так проверки остаются независимыми.</p>';
    const st = aiStatus(i.id);
    const head = `ИИ: ${pill(st, STATUS_LABEL[st] || "Не проверить")}${r.sev ? ` <span class="plate">${esc(r.sev)}</span>` : ""}`;
    const ev = r.ev ? `<p class="ai-ev">${esc(r.ev)}</p>` : "";
    if (rec === "conflict" || rec === "rejected") {
      const a = ans(i.id);
      return `<div class="ai-box conflict">
        <div class="ai-head">${rec === "conflict" ? "Расхождение с ИИ" : "Находка ИИ отклонена"} · ${head}</div>
        ${ev}
        <p>${rec === "conflict" ? "ИИ считает, что здесь есть проблема. Перепроверьте критерии, где у ИИ стоит ✕. Если ИИ ошибается, объясните почему:" : "Причина, по которой находка ИИ отклонена:"}</p>
        <label class="hidden-text" for="rej-${i.id}">Почему ИИ ошибается</label>
        <textarea id="rej-${i.id}" data-act="ai-reject" data-id="${i.id}" placeholder="Например: на экране 3 состояние ошибки есть, ИИ его не увидел">${esc(a.aiReject || "")}</textarea>
      </div>`;
    }
    const note = rec === "agree" ? "Совпадает с вашим ответом." : rec === "human-only" ? "ИИ этого не увидел. Ваша находка остаётся." : rec === "ai-unknown" ? "ИИ не смог проверить пункт по материалам." : "";
    return `<div class="ai-box"><div class="ai-head">${head}</div>${ev}<p class="muted" style="font-size:14px">${note}</p></div>`;
  }

  function itemHtml(i) {
    const r = state.review, a = ans(i.id), mode = r.mode;
    const cs = crit(i, mode);
    const st = statusOf(i.id);
    const revealed = !!st;
    const aiR = aiOf(i.id);
    const critRows = cs.map((c, n) => {
      const v = Array.isArray(a.c) ? a.c[n] : undefined;
      let mark = "";
      if (aiR && revealed && !aiR.na) {
        const av = (aiR.c || [])[n];
        mark = av === true ? '<span class="ai-mark t" title="Оценка ИИ">ИИ ✓</span>' : av === false ? '<span class="ai-mark f" title="Оценка ИИ">ИИ ✕</span>' : '<span class="ai-mark u" title="ИИ не смог проверить">ИИ ?</span>';
      }
      const dis = a.x ? "disabled" : "";
      return `<li class="crit">
        <span class="crit-text" id="c-${i.id}-${n}">${esc(c)}</span>
        <span class="crit-side" role="group" aria-labelledby="c-${i.id}-${n}">
          ${mark}
          <button type="button" class="yn y" data-act="crit" data-id="${i.id}" data-n="${n}" data-v="1" aria-pressed="${v === true}" ${dis}>Да</button>
          <button type="button" class="yn n" data-act="crit" data-id="${i.id}" data-n="${n}" data-v="0" aria-pressed="${v === false}" ${dis}>Нет</button>
        </span>
      </li>`;
    }).join("");
    const sevSel = SEV.find((s) => s.k === a.sev);
    const sev = FINDING(st) ? `
      <div class="sev-block">
        <span class="sev-label" id="sev-${i.id}">Серьёзность <span>— что случится с человеком${isDesign(mode) ? ", если реализовать как есть" : ""}</span></span>
        <div class="choices" role="group" aria-labelledby="sev-${i.id}">
          ${SEV.map((s) => `<button type="button" class="choice sev ${s.k}" data-act="sev" data-id="${i.id}" data-v="${s.k}" aria-pressed="${a.sev === s.k}"><span class="code">${s.k}</span>${s.label}</button>`).join("")}
        </div>
        <span class="sev-desc">${sevSel ? esc(sevSel.label + ": " + sevSel.desc + ".") : "Выберите серьёзность — от неё зависит вердикт."}</span>
      </div>` : "";
    const exc = FINDING(st) && i.level === "О" ? `<label class="exc"><input type="checkbox" data-act="exc" data-id="${i.id}" ${a.exc ? "checked" : ""}> Оформлено исключение из стандарта</label>` : "";
    const hint = prefs.hints ? `
      <div class="hint-box">
        <p><span class="h-label">Как проверить. </span>${esc(how(i, mode))}</p>
        <p class="red"><span class="h-label">Тревожный признак. </span>${esc(i.red)}</p>
        <p class="req-line">Требование ${esc(i.id)}: ${esc(i.text)}</p>
      </div>` : "";
    const resultText = st ? pill(st, STATUS_LABEL[st]) : `<span>отмечено ${marked(i.id)} из ${cs.length}</span>`;
    return `
    <article class="card item${st ? " answered" : ""}" id="item-${i.id}" aria-labelledby="q-${i.id}">
      <div class="item-top">
        <span class="plate">${i.id}</span>
        <span class="tag">${LEVEL[i.level]}</span>
        <span class="tag">${STAGE[i.stage]}</span>
        ${i.quick ? '<span class="tag">⚡ быстрая проверка</span>' : ""}
      </div>
      <h3 id="q-${i.id}">${esc(q(i, mode))}</h3>
      ${sourcesHtml(i)}
      ${isDesign(mode) && i.stage === "М+Р" ? '<p class="design-note">Поведение видно только в сборке. Здесь проверяем, что оно спроектировано и описано в макете.</p>' : ""}
      ${hint}
      <ul class="crits${a.x ? " off" : ""}" aria-label="Критерии">${critRows}</ul>
      <div class="item-foot">
        <div class="choices" role="group" aria-label="Пункт целиком">
          <button type="button" class="choice s-na" data-act="x" data-id="${i.id}" data-v="na" aria-pressed="${a.x === "na"}">— Не применимо</button>
          <button type="button" class="choice s-unknown" data-act="x" data-id="${i.id}" data-v="unknown" aria-pressed="${a.x === "unknown"}">? Не проверить</button>
        </div>
        <span class="result">Итог пункта: ${resultText}</span>
      </div>
      ${sev}
      ${exc}
      ${aiBoxHtml(i)}
      <div class="note">
        <label for="note-${i.id}">${FINDING(st) ? "Что не так — где и как воспроизвести" : a.x === "na" ? "Почему не применимо" : "Заметка"}</label>
        <textarea id="note-${i.id}" data-act="note" data-id="${i.id}" rows="2">${esc(a.note || "")}</textarea>
      </div>
    </article>`;
  }

  function renderCheck() {
    const r = state.review, groups = modeGroups(r.mode);
    state.groupIdx = Math.max(0, Math.min(state.groupIdx, groups.length - 1));
    const g = groups[state.groupIdx];
    const last = state.groupIdx === groups.length - 1;
    const nextBtn = last
      ? (MODES[r.mode].ai ? '<button class="btn primary" type="button" data-act="open-ai">К ИИ-проверке</button>' : '<button class="btn primary" type="button" data-act="open-summary">К итогу</button>')
      : `<button class="btn primary" type="button" data-act="group" data-idx="${state.groupIdx + 1}">${esc(groups[state.groupIdx + 1].title)} →</button>`;
    return `
    <div class="check">
      ${sideHtml()}
      <section aria-labelledby="group-h">
        <div class="group-head">
          <span class="eyebrow">Блок ${state.groupIdx + 1} из ${groups.length}</span>
          <h2 id="group-h" tabindex="-1">${esc(g.title)}</h2>
          <p>${esc(g.intro)} Отметьте каждый критерий «Да» или «Нет» — итог пункта посчитается сам.</p>
        </div>
        <div class="items">${g.items.map(itemHtml).join("")}</div>
        <div class="pager">
          ${state.groupIdx > 0 ? `<button class="btn" type="button" data-act="group" data-idx="${state.groupIdx - 1}">← ${esc(groups[state.groupIdx - 1].title)}</button>` : "<span></span>"}
          ${nextBtn}
        </div>
      </section>
    </div>`;
  }

  // ------------------------------------------------------------------ ИИ-проверка
  function aiContextText(r) {
    return [
      `Продукт: ${r.product}`,
      r.scenario ? `Что проверяем: ${r.scenario}` : "",
      r.link ? `Ссылка: ${r.link}` : "",
      r.aiContext ? `Описание и аннотации от команды:\n${r.aiContext}` : "",
      `Приложено изображений: ${ai.files.length || "см. вложения"}`,
    ].filter(Boolean).join("\n");
  }
  function aiPrompt(mode, items, context) {
    const m = MODES[mode], p = DATA.protocol, key = m.ctx === "design" ? "aiDesign" : "aiBuild";
    const intro = p.intro.split("{mode}").join(m.title).split("{materials}").join(p["materials_" + m.ctx]).split("{version}").join(DATA.version);
    return [intro, p.rules, "Контекст от команды:\n" + context, "Пункты для проверки:", items.map((i) => i[key]).join("\n\n"), p.format].join("\n\n") + "\n";
  }
  function chunks(items, size) {
    const out = [];
    for (let k = 0; k < items.length; k += size) out.push(items.slice(k, k + size));
    return out;
  }
  function normalizeAi(obj, items) {
    if (!obj || !Array.isArray(obj.items)) throw new Error("В ответе нет списка items.");
    const got = {};
    obj.items.forEach((x) => { if (x && BY_ID[x.id]) got[x.id] = x; });
    const res = {};
    let known = 0;
    items.forEach((i) => {
      const n = crit(i, state.review.mode).length;
      const x = got[i.id];
      if (!x) { res[i.id] = { c: Array(n).fill(null), na: false, sev: null, ev: "ИИ не ответил по этому пункту." }; return; }
      known++;
      const c = Array.from({ length: n }, (_, k) => (Array.isArray(x.criteria) ? (x.criteria[k] === true ? true : x.criteria[k] === false ? false : null) : null));
      const sev = SEV_ORDER[x.severity] !== undefined ? x.severity : null;
      res[i.id] = { c, na: !!x.na, sev: c.includes(false) ? (sev || "P2") : null, ev: String(x.evidence || "").slice(0, 800) };
    });
    if (!known) throw new Error("Ни один пункт из ответа не совпал с пунктами этой проверки.");
    return { items: res, summary: typeof obj.summary === "string" ? obj.summary.slice(0, 1500) : "" };
  }
  function applyAi(result, source) {
    const r = state.review;
    r.ai = { at: Date.now(), source, summary: result.summary, items: result.items };
    changed();
  }

  async function runAi() {
    const r = state.review;
    if (!cap.sample || ai.running) return;
    const items = modeItems(r.mode);
    const parts = chunks(items, 18);
    ai.running = true; ai.done = 0; ai.total = parts.length; ai.error = ""; ai.ctl = new AbortController();
    render();
    const context = aiContextText(r);
    const opts = { modelTier: "complex", signal: ai.ctl.signal, cache: false };
    if (ai.files.length) opts.images = ai.files.slice();
    try {
      const answers = await Promise.all(parts.map((part) =>
        cap.sample.json(aiPrompt(r.mode, part, context), opts).then((res) => { ai.done++; updateAiProgress(); return normalizeAi(res, part); })
      ));
      const merged = { items: {}, summary: answers.map((a) => a.summary).filter(Boolean).join(" ") };
      answers.forEach((a) => Object.assign(merged.items, a.items));
      applyAi(merged, "Запущена на этой странице");
      toast("ИИ-проверка готова. Ответы ИИ открываются в пунктах после ваших.");
    } catch (e) {
      const code = e && e.code;
      const msg = {
        cancelled: "", not_granted: "Запуск ИИ отсюда не разрешён. Используйте способ «Claude Code или чат» ниже.",
        sampling_disabled: "Claude недоступен для этого аккаунта. Используйте способ ниже.", images_unavailable: "Здесь нельзя отправить изображения. Используйте способ ниже.",
        image_rejected: "Одно из изображений не подошло: слишком большое или неподходящего формата.", rate_limited: "Слишком много запросов. Подождите и запустите снова.",
        prompt_too_large: "Задание получилось слишком большим. Сократите описание.", invalid_json: "ИИ ответил не в том формате. Запустите ещё раз.",
        session_expired: "Нужно снова войти в claude.ai.", refused: "ИИ отказался проверять эти материалы. Проверьте, что на изображениях только интерфейс.",
      }[code];
      ai.error = msg === undefined ? (e && e.message && !code ? e.message : "Не удалось провести проверку. Попробуйте ещё раз.") : msg;
    } finally {
      ai.running = false; ai.ctl = null;
      if (state.view === "ai") render(); else { const side = $(".side"); if (side) side.outerHTML = sideHtml(); }
    }
  }
  function updateAiProgress() {
    const el = $("#ai-progress");
    if (el) el.textContent = `Готово частей: ${ai.done} из ${ai.total}. Обычно это занимает несколько минут.`;
  }
  function addFiles(list) {
    const lim = cap.limits && cap.limits.images;
    const types = lim ? lim.mediaTypes : ["image/png", "image/jpeg", "image/webp", "image/gif"];
    const max = lim ? lim.maxCount : 20;
    let skipped = 0;
    Array.from(list).forEach((f) => {
      if (!types.includes(f.type) || (lim && f.size > lim.maxInputBytes) || ai.files.length >= max) { skipped++; return; }
      ai.files.push(f); ai.urls.push(URL.createObjectURL(f));
    });
    if (skipped) toast(`Пропущено файлов: ${skipped}. Подходят изображения ${types.map((t) => t.split("/")[1]).join(", ")}, не больше ${max} штук.`);
    render();
  }
  function removeFile(k) {
    try { URL.revokeObjectURL(ai.urls[k]); } catch (e) { /* нечего освобождать */ }
    ai.files.splice(k, 1); ai.urls.splice(k, 1); render();
  }
  function parsePasted(text) {
    let t = String(text || "").trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
    const a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a < 0 || b <= a) throw new Error("Не нашли JSON. Вставьте ответ Claude целиком.");
    return JSON.parse(t.slice(a, b + 1));
  }

  // ------------------------------------------------------------------ Отчёты
  const cell = (s) => String(s || "").replace(/\|/g, "\\|").replace(/\s*\n\s*/g, " ");
  const REC_MD = { agree: "совпало", conflict: "расхождение", rejected: "ИИ отклонён", "human-only": "ИИ не увидел", "ai-unknown": "ИИ не проверил", pending: "—", noai: "—" };
  function reportMd() {
    const r = state.review; if (!r) return "";
    const x = analyze(r), v = verdict(r), m = MODES[r.mode];
    const L = [`# ${m.title}: ${r.product}`, ""];
    L.push(`Стандарт дизайна ${DATA.version} · ${fmtDate(Date.now())}${r.people ? " · Участники: " + r.people : ""}`);
    if (r.scenario) L.push("", `**Что проверяли:** ${r.scenario}`);
    if (r.link) L.push("", `**Ссылка:** ${r.link}`);
    L.push("", "## Итог", "", `**${v.title}**`, "", ...v.detail.map((d) => "- " + d), "");
    L.push("| Серьёзность | Количество |", "| --- | --- |", ...SEV.map((s) => `| ${s.k} — ${s.label.toLowerCase()} | ${x.sevCount[s.k]} |`));
    L.push("", `Отвечено ${x.answered} из ${x.items.length}.`, "", "## Две проверки", "");
    if (x.aiDone) {
      L.push(`ИИ-проверка: ${fmtDate(r.ai.at)}, ${r.ai.source || ""}.`, "");
      L.push(`Совпали: ${x.agree.length} · расхождений без решения: ${x.conflicts.length} · находок ИИ отклонено: ${x.rejected.length} · нашёл только человек: ${x.humanOnly.length} · ИИ не смог проверить: ${x.aiUnknown.length}.`);
      if (r.ai.summary) L.push("", `Вывод ИИ: ${r.ai.summary}`);
      if (x.rejected.length) { L.push("", "Отклонённые находки ИИ:", ""); x.rejected.forEach((i) => L.push(`- **${i.id}** — ${ans(i.id).aiReject}`)); }
      if (x.conflicts.length) { L.push("", "Расхождения без решения:", ""); x.conflicts.forEach((i) => L.push(`- **${i.id}** — ИИ: ${aiOf(i.id).ev || STATUS_LABEL[aiStatus(i.id)]}`)); }
    } else L.push(m.ai ? "ИИ-проверка не проведена." : "ИИ-проверка не проводилась (по желанию).");
    L.push("", "## Находки", "");
    const finds = x.findings.slice().sort((a, b) => (SEV_ORDER[ans(a.id).sev] ?? 4) - (SEV_ORDER[ans(b.id).sev] ?? 4));
    if (finds.length) {
      L.push("| # | Требование | Серьёзность | Итог | ИИ | Что не выполнено | Заметка |", "| --- | --- | --- | --- | --- | --- | --- |");
      finds.forEach((i, n) => {
        const a = ans(i.id);
        const failed = crit(i, r.mode).filter((c, k) => a.c && a.c[k] === false).join("; ");
        L.push(`| ${n + 1} | ${i.id} | ${a.sev || "не указана"} | ${STATUS_MD[statusOf(i.id)]}${a.exc ? ", исключение" : ""} | ${REC_MD[reconcile(i.id)]} | ${cell(failed) || "—"} | ${cell(a.note) || "—"} |`);
      });
    } else L.push("Находок нет.");
    L.push("", "## Все пункты", "");
    modeGroups(r.mode).forEach((g) => {
      L.push(`### ${g.title}`, "");
      g.items.forEach((i) => {
        const a = ans(i.id), st = statusOf(i.id), as = aiStatus(i.id);
        L.push(`- ${st ? STATUS_MD[st] : "без ответа"}${a.sev ? " " + a.sev : ""} **${i.id}** — ${q(i, r.mode)}${as ? ` · ИИ: ${STATUS_MD[as]}` : ""}${a.note ? `\n  ${a.note.replace(/\n/g, "\n  ")}` : ""}`);
      });
      L.push("");
    });
    return L.join("\n").trim() + "\n";
  }
  function issueMd(id) {
    const r = state.review, i = BY_ID[id], a = ans(id), sev = SEV.find((s) => s.k === a.sev);
    const failed = crit(i, r.mode).filter((c, k) => a.c && a.c[k] === false);
    return [
      `**[${id}] ${q(i, r.mode)}**`, "",
      `**Требование:** ${id} — ${i.text}`, "",
      `**Серьёзность:** ${sev ? sev.k + " " + sev.label.toLowerCase() : "не указана"}`, "",
      `**Сценарий:** ${r.scenario || r.product}`, "",
      "## Что происходит", "", a.note || "<опишите шаги и наблюдаемое поведение>", "",
      "## Что ожидается по стандарту", "", ...(failed.length ? failed.map((c) => "- " + c) : [q(i, r.mode)]), "",
      "## Доказательство", "", r.link ? r.link : "<скриншот, запись экрана, вывод автопроверки>", "",
    ].join("\n");
  }
  async function copyText(text, okMsg, fallbackId) {
    try { await navigator.clipboard.writeText(text); toast(okMsg); }
    catch (e) {
      if (fallbackId === "ai-paste") { const ta = $("#ai-paste"); if (ta) { ta.value = text; ta.focus(); ta.select(); } }
      else { state.exportOpen = true; render(); const ta = $("#export-text"); if (ta) { ta.value = text; ta.focus(); ta.select(); } }
      toast("Не получилось скопировать автоматически — текст выделен, скопируйте его вручную.");
    }
  }

  // ------------------------------------------------------------------ Действия
  function startReview(form) {
    const product = form.product.value.trim();
    if (!product) { $("#f-product-err").hidden = false; form.product.focus(); return; }
    state.review = {
      id: null, mode: state.setupMode, product, scenario: form.scenario.value.trim(), link: form.link.value.trim(), people: form.people.value.trim(),
      aiContext: "", answers: {}, ai: null, peopleChecked: false, createdAt: Date.now(), authorId: cap.myId || "", savedToTeam: false,
    };
    ai.files.forEach((f, k) => { try { URL.revokeObjectURL(ai.urls[k]); } catch (e) { /* нечего освобождать */ } });
    ai.files = []; ai.urls = []; ai.error = ""; ai.pasteError = "";
    saveStatus = "";
    state.view = "check"; state.groupIdx = 0; state.confirmDelete = false; state.exportOpen = false;
    persistDraft(); render("#group-h"); window.scrollTo(0, 0);
  }

  function patchAnswer(id, fn) {
    const r = state.review;
    const a = Object.assign({}, r.answers[id] || {});
    fn(a);
    delete a.s; // старый формат без критериев больше не используется после правки
    if (!FINDING(statusFrom(a.c, crit(BY_ID[id], r.mode).length)) || a.x) { delete a.sev; delete a.exc; }
    r.answers[id] = a;
    changed();
  }

  function rerenderItem(id, focusSel) {
    const el = $("#item-" + CSS.escape(id));
    if (el) el.outerHTML = itemHtml(BY_ID[id]);
    const side = $(".side"); if (side) side.outerHTML = sideHtml();
    updateSaveUi();
    if (focusSel) { const f = $(focusSel); if (f) f.focus({ preventScroll: true }); }
  }

  function gotoItem(id) {
    const groups = modeGroups(state.review.mode);
    const idx = groups.findIndex((g) => g.items.some((i) => i.id === id));
    if (idx < 0) return;
    state.view = "check"; state.groupIdx = idx; persistDraft(); render();
    const el = $("#item-" + CSS.escape(id));
    if (el) { el.scrollIntoView({ block: "start" }); const b = el.querySelector(".yn"); if (b) b.focus({ preventScroll: true }); }
  }

  async function openHistory(id) {
    const h = cap.history.find((x) => x.id === id);
    if (!h) return;
    let data = h;
    try { const snap = await cap.db.collection("reviews").doc(id).get(); if (snap.exists) data = snap.data(); } catch (e) { /* берём то, что пришло в подписке */ }
    state.review = deserialize(id, data);
    saveStatus = ""; state.view = "summary"; state.groupIdx = 0; state.confirmDelete = false; state.exportOpen = false;
    persistDraft(); render("#verdict-h"); window.scrollTo(0, 0);
  }

  async function deleteReview() {
    const r = state.review;
    if (!cap.db || !r || !r.id) return;
    try {
      await saveChain;
      await cap.db.collection("reviews").doc(r.id).delete();
      r.id = null; r.savedToTeam = false; saveStatus = ""; state.confirmDelete = false;
      persistDraft(); render(); toast("Проверка удалена из истории.");
    } catch (e) {
      state.confirmDelete = false; render();
      toast(e && e.code === "invalid_argument" ? "Нет прав удалить эту проверку." : "Не удалось удалить. Попробуйте ещё раз.");
    }
  }

  async function download() {
    const r = state.review;
    const name = `${MODES[r.mode].title} — ${r.product}`.replace(/[\\/:*?"<>|]+/g, " ").slice(0, 120) + ".md";
    try { await cap.downloads.save({ filename: name, data: reportMd() }); }
    catch (e) {
      if (e && e.code === "declined") return;
      toast(e && e.code === "rate_limited" ? "Окно сохранения уже открыто." : "Скачать не получилось. Скопируйте отчёт.");
    }
  }

  function go(view, focusSel) { state.view = view; state.confirmDelete = false; persistDraft(); render(focusSel); window.scrollTo(0, 0); }

  document.addEventListener("click", (e) => {
    const g = e.target.closest("[data-go]");
    if (g) {
      try { history.replaceState(null, "", g.dataset.go === "guide" ? "#guide" : location.pathname + location.search); } catch (err) { /* без истории */ }
      go(g.dataset.go);
      return;
    }
    const t = e.target.closest("[data-act]");
    if (!t || t.tagName === "TEXTAREA" || t.tagName === "INPUT") return;
    const act = t.dataset.act, id = t.dataset.id;
    switch (act) {
      case "new": state.setupMode = t.dataset.mode; go("setup", "#f-product"); break;
      case "resume": go("check", "#group-h"); break;
      case "open-summary": go("summary", "#verdict-h"); break;
      case "open-ai": go("ai", "#ai-h"); break;
      case "group": state.groupIdx = Number(t.dataset.idx); go("check", "#group-h"); break;
      case "crit": {
        const n = Number(t.dataset.n), val = t.dataset.v === "1";
        patchAnswer(id, (a) => {
          const len = crit(BY_ID[id], state.review.mode).length;
          const c = Array.from({ length: len }, (_, k) => (Array.isArray(a.c) ? a.c[k] : undefined));
          c[n] = c[n] === val ? undefined : val;
          a.c = c;
        });
        rerenderItem(id, `#item-${CSS.escape(id)} .yn[data-n="${n}"][data-v="${t.dataset.v}"]`);
        break;
      }
      case "x": patchAnswer(id, (a) => { a.x = a.x === t.dataset.v ? undefined : t.dataset.v; }); rerenderItem(id, `#item-${CSS.escape(id)} [data-act="x"][data-v="${t.dataset.v}"]`); break;
      case "sev": patchAnswer(id, (a) => { a.sev = t.dataset.v; }); rerenderItem(id, `#item-${CSS.escape(id)} .sev[data-v="${t.dataset.v}"]`); break;
      case "goto": gotoItem(id); break;
      case "copy-issue": copyText(issueMd(id), "Задача скопирована."); break;
      case "copy-report": copyText(reportMd(), "Отчёт скопирован."); break;
      case "toggle-export": state.exportOpen = !state.exportOpen; render(); break;
      case "download": download(); break;
      case "team-save": teamSaveNow(); break;
      case "delete-ask": state.confirmDelete = true; render(); break;
      case "delete-no": state.confirmDelete = false; render(); break;
      case "delete-yes": deleteReview(); break;
      case "open-history": openHistory(id); break;
      case "guide-filter": state.guideStage = t.dataset.v; render(); break;
      case "ai-run": runAi(); break;
      case "ai-stop": if (ai.ctl) ai.ctl.abort(); break;
      case "ai-remove": removeFile(Number(t.dataset.k)); break;
      case "ai-copy": copyText(aiPrompt(state.review.mode, modeItems(state.review.mode), aiContextText(state.review)), "Задание скопировано. Вставьте его в Claude вместе со скриншотами.", "ai-paste"); break;
      case "ai-import": {
        const text = ($("#ai-paste") || {}).value;
        try {
          applyAi(normalizeAi(parsePasted(text), modeItems(state.review.mode)), "Загружена из ответа Claude");
          ai.pasteError = ""; render("#ai-h"); toast("Результат ИИ загружен. Ответы ИИ открываются в пунктах после ваших.");
        } catch (err) { ai.pasteError = (err && err.message) || "Не удалось прочитать ответ."; render(); const ta = $("#ai-paste"); if (ta) ta.value = text; }
        break;
      }
    }
  });

  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "hints-toggle") { prefs.hints = t.checked; store.set(PREF_KEY, prefs); render("#hints-toggle"); return; }
    if (t.id === "people-checked") { state.review.peopleChecked = t.checked; changed(); render("#people-checked"); return; }
    if (t.id === "ai-files") { addFiles(t.files); return; }
    if (t.dataset && t.dataset.act === "exc") { patchAnswer(t.dataset.id, (a) => { a.exc = t.checked; }); rerenderItem(t.dataset.id, `#item-${CSS.escape(t.dataset.id)} input[data-act="exc"]`); }
  });

  document.addEventListener("input", (e) => {
    const t = e.target, r = state.review;
    if (!t.dataset) return;
    if (t.dataset.act === "note") { r.answers[t.dataset.id] = Object.assign({}, r.answers[t.dataset.id] || {}, { note: t.value }); changed(); }
    if (t.dataset.act === "ai-reject") {
      const id = t.dataset.id, before = reconcile(id);
      r.answers[id] = Object.assign({}, r.answers[id] || {}, { aiReject: t.value });
      changed();
      if (before !== reconcile(id)) { const side = $(".side"); if (side) side.outerHTML = sideHtml(); }
    }
    if (t.dataset.act === "ai-context") { r.aiContext = t.value; changed(); }
    if (t.id === "f-product" && t.value.trim()) { const err = $("#f-product-err"); if (err) err.hidden = true; }
  });

  document.addEventListener("dragover", (e) => { const d = e.target.closest && e.target.closest("#ai-drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
  document.addEventListener("dragleave", (e) => { const d = e.target.closest && e.target.closest("#ai-drop"); if (d) d.classList.remove("over"); });
  document.addEventListener("drop", (e) => {
    const d = e.target.closest && e.target.closest("#ai-drop");
    if (!d) return;
    e.preventDefault(); d.classList.remove("over");
    if (e.dataTransfer && e.dataTransfer.files.length && cap.limits && cap.limits.images) addFiles(e.dataTransfer.files);
  });

  document.addEventListener("submit", (e) => { if (e.target.id === "setup-form") { e.preventDefault(); startReview(e.target); } });

  render();
  initCapabilities();
})();
</script>
