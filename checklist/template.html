    release: {

    audit: {

      filter: () => true,

  const MODE_ORDER = ["design", "quick", "release", "audit"];
  const STATUS = [
    { k: "yes", label: "Да", ic: "✓" },
    { k: "partial", label: "Частично", ic: "~" },
    { k: "no", label: "Нет", ic: "✕" },
    { k: "na", label: "Н/п", ic: "—" },
    { k: "unknown", label: "Не проверить", ic: "?" },
  ];
  const STATUS_MD = { yes: "✅", partial: "⚠️", no: "❌", na: "н/п", unknown: "не проверено" };
  const SEV = [
    { k: "P0", label: "Блокер", desc: "не закончит задачу, потеряет данные или будет введён в заблуждение" },
    { k: "P1", label: "Серьёзно", desc: "трудно восстановиться после ошибки, непонятно, что происходит" },
    { k: "P2", label: "Нагрузка", desc: "лишние действия, поиск, запоминание" },
    { k: "P3", label: "Полировка", desc: "мелкие визуальные неточности" },
  ];
  const LEVEL = { "О": "Обязательно", "Р": "Рекомендуется" };
  const STAGE = { "М": "Макет", "М+Р": "Макет и сборка", "Р": "Сборка" };
  const FINDING = (s) => s === "partial" || s === "no";

  // ------------------------------------------------------------------ Утилиты
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const plural = (n, a, b, c) => {
    const m10 = n % 10, m100 = n % 100;
    return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c;
  };
  const fmtDate = (ts) => {
    try { return new Date(ts).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" }); } catch (e) { return ""; }
  };
  const fmtTime = (ts) => {
    try { return new Date(ts).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; }
  };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* хранилище недоступно */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* хранилище недоступно */ } },
  };
  const DRAFT_KEY = "mnl-checklist-draft-v1";
  const PREF_KEY = "mnl-checklist-prefs-v1";

  let toastTimer = null;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  // ------------------------------------------------------------------ Состояние
  const prefs = Object.assign({ hints: true }, store.get(PREF_KEY) || {});
  const state = { view: "home", review: null, groupIdx: 0, setupMode: null, guideStage: "all", confirmDelete: false, exportOpen: false };

  const draft = store.get(DRAFT_KEY);
  if (draft && draft.review && MODES[draft.review.mode]) {
    state.review = draft.review;
    state.groupIdx = draft.groupIdx || 0;
    if (draft.view === "check" || draft.view === "summary") state.view = draft.view;
  }
  if (location.hash === "#guide") state.view = "guide";

  let draftTimer = null;
  function flushDraft() {
    clearTimeout(draftTimer);
    draftTimer = null;
    if (state.review) store.set(DRAFT_KEY, { review: state.review, view: state.view, groupIdx: state.groupIdx });
  }
  function persistDraft() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(flushDraft, 250);
  }
  window.addEventListener("pagehide", flushDraft);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushDraft(); });

  function modeItems(mode) { return ITEMS.filter(MODES[mode].filter); }
  function modeGroups(mode) {
    const items = modeItems(mode);
    return GROUPS.map((g) => ({ ...g, items: items.filter((i) => i.group === g.key) })).filter((g) => g.items.length);
  }
  function ans(id) { return (state.review && state.review.answers[id]) || {}; }
  function q(item, mode) { return MODES[mode].ctx === "design" ? item.qDesign : item.q; }
  function how(item, mode) { return MODES[mode].ctx === "design" ? item.howDesign : item.how; }

  // ------------------------------------------------------------------ Вердикт
  function analyze(review) {
    const items = modeItems(review.mode);
    const a = (id) => review.answers[id] || {};
    const unanswered = items.filter((i) => !a(i.id).s);
    const findings = items.filter((i) => FINDING(a(i.id).s));
    const noSev = findings.filter((i) => !a(i.id).sev);
    const sevCount = { P0: 0, P1: 0, P2: 0, P3: 0 };
    findings.forEach((i) => { if (a(i.id).sev) sevCount[a(i.id).sev]++; });
    const mandatoryOpen = findings.filter((i) => i.level === "О" && !a(i.id).exc);
    const unknown = items.filter((i) => a(i.id).s === "unknown");
    const unknownMandatory = unknown.filter((i) => i.level === "О");
    const recommendedOpen = items.filter((i) => i.level === "Р" && !["yes", "na"].includes(a(i.id).s));
    const exceptions = findings.filter((i) => a(i.id).exc);
    return { items, unanswered, findings, noSev, sevCount, mandatoryOpen, unknown, unknownMandatory, recommendedOpen, exceptions, answered: items.length - unanswered.length };
  }

  function verdict(review) {
    const x = analyze(review);
    const blockers = x.sevCount.P0 + x.sevCount.P1;
    const incomplete = [];
    if (x.unanswered.length) incomplete.push(`Без ответа: ${x.unanswered.length} ${plural(x.unanswered.length, "пункт", "пункта", "пунктов")}.`);
    if (x.noSev.length) incomplete.push(`У ${x.noSev.length} ${plural(x.noSev.length, "находки", "находок", "находок")} не указана серьёзность.`);
    const mand = x.mandatoryOpen.length ? `Обязательные пункты без исправления или исключения: ${x.mandatoryOpen.map((i) => i.id).join(", ")}.` : null;
    const unk = x.unknownMandatory.length ? `Не проверены обязательные пункты: ${x.unknownMandatory.map((i) => i.id).join(", ")}. Найдите способ проверить их.` : null;

    if (review.mode === "design" || review.mode === "quick") {
      const quick = review.mode === "quick";
      if (review.answers["R2.1"] && review.answers["R2.1"].s === "no") {
        return { tone: "bad", title: "Вернуться к задаче", detail: ["Непонятны пользователь или момент ценности (R2.1). Сначала заполните описание решения, потом возвращайтесь к экранам."] };
      }
      if (blockers) {
        return {
          tone: "bad", title: quick ? "Есть блокеры" : "Доработать",
          detail: [`Блокеров: ${x.sevCount.P0}, серьёзных: ${x.sevCount.P1}. Исправьте их в макете и повторите ${quick ? "проверку" : "ревью"}.`, mand].filter(Boolean),
        };
      }
      if (incomplete.length) return { tone: "neutral", title: quick ? "Проверка не завершена" : "Ревью не завершено", detail: incomplete };
      if (x.mandatoryOpen.length) return { tone: "warn", title: "Доработать", detail: [mand, "Исправьте в макете или оформите исключение с датой пересмотра."] };
      if (unk) return { tone: "neutral", title: "Не хватает проверок", detail: [unk] };
      if (quick) return { tone: "ok", title: "Явных блокеров нет", detail: ["Можно идти на полное дизайн-ревью."] };
      const d = ["Нет открытых P0 и P1, обязательные пункты выполнены или оформлены исключением."];
      if (x.sevCount.P2 + x.sevCount.P3) d.push(`Находки P2 и P3 (${x.sevCount.P2 + x.sevCount.P3}) заведите задачами с номерами требований.`);
      return { tone: "ok", title: "Готово к передаче", detail: d };
    }

    if (review.mode === "release") {
      if (x.sevCount.P0) return { tone: "bad", title: "Нельзя выпускать", detail: [`Блокеров: ${x.sevCount.P0}. P0 исправляется до выпуска.`] };
      if (incomplete.length) return { tone: "neutral", title: "Приёмка не завершена", detail: incomplete };
      if (unk) return { tone: "neutral", title: "Не хватает проверок", detail: [unk] };
      if (x.mandatoryOpen.length) return { tone: "warn", title: "Решить до выпуска", detail: [mand, "Исправьте или оформите исключение с датой пересмотра."] };
      const d = ["Блокеров нет, обязательные пункты выполнены или оформлены исключением."];
      if (x.sevCount.P1) d.push(`Серьёзные находки (${x.sevCount.P1}) исправить в ближайшем цикле.`);
      return { tone: "ok", title: "Можно выпускать", detail: d };
    }

    // Аудит
    const pre = incomplete.length ? "Предварительно · " : "";
    const tail = incomplete.length ? incomplete : [];
    if (x.sevCount.P0) return { tone: "bad", title: pre + "Ниже уровня 1", detail: [`Блокеров: ${x.sevCount.P0}. Сначала исправьте их.`, ...tail] };
    if (x.sevCount.P1 || x.mandatoryOpen.length) {
      return { tone: "warn", title: pre + "Уровень 1 · Работает", detail: [`Для уровня 2 закройте серьёзные находки (${x.sevCount.P1}) и обязательные пункты.`, mand, ...tail].filter(Boolean) };
    }
    if (x.recommendedOpen.length || !review.peopleChecked) {
      const need = [];
      if (x.recommendedOpen.length) need.push(`рекомендованные пункты: ${x.recommendedOpen.map((i) => i.id).join(", ")}`);
      if (!review.peopleChecked) need.push("подтверждение наблюдением за людьми");
      return { tone: "ok", title: pre + "Уровень 2 · Понятно и честно", detail: [`Для уровня 3 не хватает: ${need.join("; ")}.`, unk, ...tail].filter(Boolean) };
    }
    return { tone: "ok", title: pre + "Уровень 3 · Меньше, но лучше", detail: ["Все требования выполнены, результат подтверждён наблюдением за людьми.", unk, ...tail].filter(Boolean) };
  }

  // ------------------------------------------------------------------ Возможности платформы
  const cap = { db: null, user: null, downloads: null, myId: null, history: [], historyState: "loading", names: {} };
  let saveChain = Promise.resolve();
  let teamTimer = null;
  let saveStatus = "";

  async function initCapabilities() {
    if (!window.claude || typeof window.claude.use !== "function") {
      cap.historyState = "off";
      refreshHistory();
      return;
    }
    const [db, user, downloads] = await Promise.all([
      window.claude.use("db").catch(() => null),
      window.claude.use("user").catch(() => null),
      window.claude.use("downloads").catch(() => null),
    ]);
    cap.db = db; cap.user = user; cap.downloads = downloads;
    if (user) { try { cap.myId = await user.id(); } catch (e) { cap.myId = null; } }
    if (db) {
      db.collection("reviews").orderBy("updatedAt", "desc").limit(100).onSnapshot(
        (snap) => {
          cap.history = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          cap.historyState = "ready";
          refreshHistory();
        },
        () => { cap.historyState = "error"; refreshHistory(); }
      );
    } else {
      cap.historyState = "off";
    }
    refreshHistory();
    if (state.view === "summary") render();
  }

  function serialize(r) {
    const x = analyze(r);
    const v = verdict(r);
    return {
      mode: r.mode, product: r.product, scenario: r.scenario || "", link: r.link || "", people: r.people || "",
      answers: Object.entries(r.answers).map(([id, a]) => ({ id, s: a.s || "", sev: a.sev || "", note: a.note || "", exc: !!a.exc })),
      peopleChecked: !!r.peopleChecked,
      createdAt: r.createdAt, updatedAt: Date.now(), authorId: r.authorId || cap.myId || "",
      std: DATA.version, verdict: v.title, tone: v.tone, counts: x.sevCount, answered: x.answered, total: x.items.length,
    };
  }
  function deserialize(id, d) {
    const answers = {};
    (d.answers || []).forEach((a) => { if (BY_ID[a.id]) answers[a.id] = { s: a.s || undefined, sev: a.sev || undefined, note: a.note || "", exc: !!a.exc }; });
    return {
      id, mode: MODES[d.mode] ? d.mode : "design", product: d.product || "Без названия", scenario: d.scenario || "", link: d.link || "",
      people: d.people || "", answers, peopleChecked: !!d.peopleChecked, createdAt: d.createdAt || Date.now(), authorId: d.authorId || "", savedToTeam: true,
    };
  }

  function teamSaveNow() {
    const r = state.review;
    if (!cap.db || !r) return;
    const col = cap.db.collection("reviews");
    const ref = r.id ? col.doc(r.id) : col.doc();
    if (!r.id) { r.id = ref.id; r.authorId = r.authorId || cap.myId || ""; }
    const body = serialize(r);
    saveStatus = "saving"; updateSaveUi();
    saveChain = saveChain.then(() => ref.set(body)).then(
      () => { r.savedToTeam = true; saveStatus = "saved:" + Date.now(); updateSaveUi(); persistDraft(); },
      (e) => {
        const code = e && e.code;
        saveStatus = code === "invalid_argument" ? "denied" : code === "quota_exceeded" ? "quota" : "error";
        updateSaveUi();
      }
    );
  }
  function scheduleTeamSave() {
    if (!cap.db || !state.review || !state.review.savedToTeam) return;
    clearTimeout(teamTimer);
    teamTimer = setTimeout(teamSaveNow, 1500);
  }
  function changed() { persistDraft(); scheduleTeamSave(); }

  function saveText() {
    if (!saveStatus) return state.review && state.review.savedToTeam ? "Сохранено в истории команды." : "";
    if (saveStatus === "saving") return "Сохраняется…";
    if (saveStatus.startsWith("saved:")) return `Сохранено в истории команды в ${fmtTime(Number(saveStatus.slice(6)))}. Дальнейшие изменения сохраняются сами.`;
    if (saveStatus === "denied") return "Нет прав на запись в историю. Попросите владельца дать доступ «Участник» или выше.";
    if (saveStatus === "quota") return "История команды заполнена. Удалите старые проверки и попробуйте снова.";
    return "Не удалось сохранить. Проверьте соединение и нажмите «Сохранить» ещё раз.";
  }
  function updateSaveUi() {
    const el = $("#save-status");
    if (el) el.textContent = saveText();
    const side = $("#side-save");
    if (side) side.textContent = state.review && state.review.savedToTeam ? (saveStatus === "saving" ? "Сохраняется…" : "В истории команды") : "Черновик на этом устройстве";
  }

  // ------------------------------------------------------------------ Отрисовка
  const app = $("#app");

  function setNav() {
    $("#nav-home").setAttribute("aria-current", state.view === "guide" ? "false" : "page");
    $("#nav-guide").setAttribute("aria-current", state.view === "guide" ? "page" : "false");
  }

  function render(focusSel) {
    setNav();
    if (state.view === "home") app.innerHTML = renderHome();
    else if (state.view === "setup") app.innerHTML = renderSetup();
    else if (state.view === "check") app.innerHTML = renderCheck();
    else if (state.view === "summary") app.innerHTML = renderSummary();
    else if (state.view === "guide") app.innerHTML = renderGuide();
    if (state.view === "home") refreshHistory();
    updateSaveUi();
    if (focusSel) { const el = $(focusSel); if (el) el.focus({ preventScroll: true }); }
  }

  function renderHome() {
    const r = state.review;
    let draftHtml = "";
    if (r) {
      const x = analyze(r);
      draftHtml = `
      <section aria-labelledby="draft-h">
        <div class="section-head"><h2 id="draft-h">Продолжить</h2></div>
        <div class="card draft">
          <div class="info">
            <span class="eyebrow">${esc(MODES[r.mode].title)}</span>
            <strong>${esc(r.product)}${r.scenario ? " · " + esc(r.scenario) : ""}</strong>
            <span class="muted">Отвечено ${x.answered} из ${x.items.length} · находок ${x.findings.length}${r.savedToTeam ? " · в истории команды" : " · черновик на этом устройстве"}</span>
          </div>
          <div class="row">
            <button class="btn" type="button" data-act="open-summary">Итог</button>
            <button class="btn primary" type="button" data-act="resume">Продолжить</button>
          </div>
        </div>
      </section>`;
    }
    const modes = MODE_ORDER.map((k) => {
      const m = MODES[k], n = modeItems(k).length;
      return `<button class="mode${m.main ? " main" : ""}" type="button" data-act="new" data-mode="${k}">
        ${m.main ? '<span class="badge-main">Главная проверка</span>' : ""}
        <h3>${esc(m.title)}</h3>
        <span class="count">${n} ${plural(n, "пункт", "пункта", "пунктов")}</span>
        <p>${esc(m.desc)}</p>
      </button>`;
    }).join("");
    return `
    <div class="home">
      <section class="hero">
        <span class="eyebrow">Стандарт дизайна · версия ${esc(DATA.version)}</span>
        <h1>Пройдите продукт по стандарту</h1>
        <p>Десять принципов Дитера Рамса, разложенные на ${ITEMS.length} ${plural(ITEMS.length, "проверку", "проверки", "проверок")}. Отмечайте пункт за пунктом — в конце будет вердикт, список находок и отчёт, который можно отдать команде.</p>
        <p class="motto">«Меньше, но лучше» <span>— Дитер Рамс</span></p>
      </section>
      ${draftHtml}
      <section aria-labelledby="new-h">
        <div class="section-head"><h2 id="new-h">Новая проверка</h2>${r ? '<span class="muted">Текущий черновик будет заменён</span>' : ""}</div>
        <div class="modes">${modes}</div>
      </section>
      <section aria-labelledby="hist-h">
        <div class="section-head"><h2 id="hist-h">История команды</h2></div>
        <div id="history"></div>
      </section>
    </div>`;
  }

  function refreshHistory() {
    const el = $("#history");
    if (!el) return;
    if (cap.historyState === "loading") { el.innerHTML = '<p class="empty">Загружаем историю проверок…</p>'; return; }
    if (cap.historyState === "off") { el.innerHTML = '<p class="empty">История команды доступна в опубликованной версии чек-листа на claude.ai. Здесь проверка сохраняется только на этом устройстве.</p>'; return; }
    if (cap.historyState === "error") { el.innerHTML = '<p class="empty">Не удалось загрузить историю. Обновите страницу.</p>'; return; }
    if (!cap.history.length) { el.innerHTML = '<p class="empty">Пока ни одной сохранённой проверки. Пройдите проверку и нажмите «Сохранить в историю команды» на экране итога.</p>'; return; }
    el.innerHTML = '<div class="history">' + cap.history.map((h) => {
      const mode = MODES[h.mode] ? MODES[h.mode].title : "Проверка";
      const c = h.counts || {};
      const finds = ["P0", "P1", "P2", "P3"].map((k) => (c[k] ? `${k}: ${c[k]}` : "")).filter(Boolean).join(", ");
      return `<button type="button" class="history-row" data-act="open-history" data-id="${esc(h.id)}">
        <span class="h-title">${esc(h.product || "Без названия")}${h.scenario ? " · " + esc(h.scenario) : ""}</span>
        <span class="h-meta">${esc(mode)} · ${esc(fmtDate(h.updatedAt))}${h.authorId ? ` · <span data-author="${esc(h.authorId)}"></span>` : ""}${finds ? " · " + esc(finds) : ""}</span>
        <span class="h-verdict"><span class="pill tone-${esc(h.tone || "neutral")}">${esc(h.verdict || "")}</span></span>
      </button>`;
    }).join("") + "</div>";
    resolveAuthors();
  }
  async function resolveAuthors() {
    if (!cap.user) return;
    const spans = Array.from(document.querySelectorAll("[data-author]"));
    if (!spans.length) return;
    const ids = Array.from(new Set(spans.map((s) => s.dataset.author)));
    let ps = {};
    try { ps = await cap.user.profiles(ids); } catch (e) { return; }
    spans.forEach((s) => { const p = ps[s.dataset.author]; s.textContent = (p && p.name) || "участник команды"; });
  }

  function renderSetup() {
    const m = MODES[state.setupMode];
    const n = modeItems(state.setupMode).length;
    const scenarioHint = state.setupMode === "audit"
      ? "Аудит идёт по сценариям, а не по экранам. Перечислите 3–5 ключевых: самые частые и самые дорогие при ошибке."
      : "Например: «Запись на встречу с телефона».";
    const linkLabel = m.ctx === "design" ? "Ссылка на макет или прототип" : "Ссылка на сборку или продукт";
    return `
    <form class="setup" id="setup-form" novalidate>
      <button type="button" class="linkbtn" data-go="home">← Все проверки</button>
      <div class="stack" style="gap:8px">
        <span class="eyebrow">${n} ${plural(n, "пункт", "пункта", "пунктов")}</span>
        <h1>${esc(m.title)}</h1>
        <p class="muted">${esc(m.desc)}</p>
      </div>
      <div class="field">
        <label for="f-product">Продукт</label>
        <input id="f-product" name="product" autocomplete="off" required>
        <span class="error-text" id="f-product-err" hidden>Назовите продукт — по названию проверку найдут в истории.</span>
      </div>
      <div class="field">
        <label for="f-scenario">Что проверяем</label>
        <textarea id="f-scenario" name="scenario" aria-describedby="f-scenario-hint"></textarea>
        <span class="hint" id="f-scenario-hint">${esc(scenarioHint)}</span>
      </div>
      <div class="field">
        <label for="f-link">${linkLabel}</label>
        <input id="f-link" name="link" inputmode="url" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-people">Участники</label>
        <input id="f-people" name="people" autocomplete="off" aria-describedby="f-people-hint">
        <span class="hint" id="f-people-hint">${m.ctx === "design" ? "Автор макета, ревьюер, разработчик, владелец продукта." : "Кто проводит проверку."}</span>
      </div>
      <div class="row"><button class="btn primary" type="submit">Начать проверку</button></div>
    </form>`;
  }

  function sideHtml() {
    const r = state.review, groups = modeGroups(r.mode), x = analyze(r);
    const pct = x.items.length ? Math.round((x.answered / x.items.length) * 100) : 0;
    const list = groups.map((g, idx) => {
      const done = g.items.filter((i) => ans(i.id).s).length;
      const flags = g.items.filter((i) => FINDING(ans(i.id).s)).length;
      const full = done === g.items.length;
      return `<li><button type="button" data-act="group" data-idx="${idx}" ${idx === state.groupIdx && state.view === "check" ? 'aria-current="step"' : ""} class="${full ? "g-done" : ""}">
        <span>${esc(g.title)}${flags ? ` <span class="g-flag" aria-label="находок: ${flags}">●</span>` : ""}</span>
        <span class="g-count">${done}/${g.items.length}</span>
      </button></li>`;
    }).join("");
    return `
    <aside class="side" aria-label="Ход проверки">
      <div class="review-name">
        <span class="eyebrow">${esc(MODES[r.mode].title)}</span>
        <strong>${esc(r.product)}</strong>
        <span class="tag" id="side-save"></span>
      </div>
      <div class="stack" style="gap:6px">
        <div class="progress" role="progressbar" aria-label="Отвечено" aria-valuemin="0" aria-valuemax="${x.items.length}" aria-valuenow="${x.answered}"><span style="width:${pct}%"></span></div>
        <div class="progress-label"><span>Отвечено ${x.answered} из ${x.items.length}</span><span>Находок ${x.findings.length}</span></div>
      </div>
      <ul class="groups">${list}
        <li><button type="button" data-act="open-summary" ${state.view === "summary" ? 'aria-current="step"' : ""}><span>Итог и отчёт</span><span class="g-count">→</span></button></li>
      </ul>
      <label class="toggle"><input type="checkbox" id="hints-toggle" ${prefs.hints ? "checked" : ""}> Показывать подсказки</label>
    </aside>`;
  }

  function itemHtml(i) {
    const r = state.review, a = ans(i.id), m = MODES[r.mode];
    const design = m.ctx === "design";
    const st = STATUS.map((s) => `<button type="button" class="choice s-${s.k}" data-act="status" data-id="${i.id}" data-v="${s.k}" aria-pressed="${a.s === s.k}"><span class="ic" aria-hidden="true">${s.ic}</span>${s.label}</button>`).join("");
    const sevSel = SEV.find((s) => s.k === a.sev);
    const sev = FINDING(a.s) ? `
      <div class="sev-block">
        <span class="sev-label" id="sev-${i.id}">Серьёзность <span>— что случится с человеком${design ? ", если реализовать как есть" : ""}</span></span>
        <div class="choices" role="group" aria-labelledby="sev-${i.id}">
          ${SEV.map((s) => `<button type="button" class="choice sev ${s.k}" data-act="sev" data-id="${i.id}" data-v="${s.k}" aria-pressed="${a.sev === s.k}"><span class="code">${s.k}</span>${s.label}</button>`).join("")}
        </div>
        <span class="sev-desc">${sevSel ? esc(sevSel.label + ": " + sevSel.desc + ".") : "Выберите серьёзность — от неё зависит вердикт."}</span>
      </div>` : "";
    const exc = FINDING(a.s) && i.level === "О"
      ? `<label class="exc"><input type="checkbox" data-act="exc" data-id="${i.id}" ${a.exc ? "checked" : ""}> Оформлено исключение из стандарта</label>` : "";
    const hint = prefs.hints ? `
      <div class="hint-box">
        <p><span class="h-label">Как проверить. </span>${esc(how(i, r.mode))}</p>
        <p class="red"><span class="h-label">Тревожный признак. </span>${esc(i.red)}</p>
        <p class="req-line">Требование ${esc(i.id)}: ${esc(i.text)}</p>
      </div>` : "";
    return `
    <article class="card item${a.s ? " answered" : ""}" id="item-${i.id}" aria-labelledby="q-${i.id}">
      <div class="item-top">
        <span class="plate">${i.id}</span>
        <span class="tag">${esc(PRINCIPLES[i.principle].short)}</span>
        <span class="tag">${LEVEL[i.level]}</span>
        <span class="tag">${STAGE[i.stage]}</span>
      </div>
      <h3 id="q-${i.id}">${esc(q(i, r.mode))}</h3>
      ${design && i.stage === "М+Р" ? '<p class="design-note">Поведение видно только в сборке. Здесь проверяем, что оно спроектировано и описано в макете.</p>' : ""}
      ${hint}
      <div class="choices" role="group" aria-label="Результат проверки ${i.id}">${st}</div>
      ${sev}
      ${exc}
      <div class="note">
        <label for="note-${i.id}">${FINDING(a.s) ? "Что не так — где и как воспроизвести" : "Заметка"}</label>
        <textarea id="note-${i.id}" data-act="note" data-id="${i.id}" rows="2">${esc(a.note || "")}</textarea>
      </div>
    </article>`;
  }

  function renderCheck() {
    const r = state.review, groups = modeGroups(r.mode);
    if (state.groupIdx >= groups.length) state.groupIdx = groups.length - 1;
    if (state.groupIdx < 0) state.groupIdx = 0;
    const g = groups[state.groupIdx];
    const last = state.groupIdx === groups.length - 1;
    return `
    <div class="check">
      ${sideHtml()}
      <section aria-labelledby="group-h">
        <div class="group-head">
          <span class="eyebrow">Блок ${state.groupIdx + 1} из ${groups.length}</span>
          <h2 id="group-h" tabindex="-1">${esc(g.title)}</h2>
          <p>${esc(g.intro)}</p>
        </div>
        <div class="items">${g.items.map(itemHtml).join("")}</div>
        <div class="pager">
          ${state.groupIdx > 0 ? `<button class="btn" type="button" data-act="group" data-idx="${state.groupIdx - 1}">← ${esc(groups[state.groupIdx - 1].title)}</button>` : "<span></span>"}
          ${last ? '<button class="btn primary" type="button" data-act="open-summary">К итогу</button>'
                 : `<button class="btn primary" type="button" data-act="group" data-idx="${state.groupIdx + 1}">${esc(groups[state.groupIdx + 1].title)} →</button>`}
        </div>
      </section>
    </div>`;
  }

  function renderSummary() {
    const r = state.review, x = analyze(r), v = verdict(r), m = MODES[r.mode];
    const sevOrder = { P0: 0, P1: 1, P2: 2, P3: 3 };
    const finds = x.findings.slice().sort((a, b) => (sevOrder[ans(a.id).sev] ?? 4) - (sevOrder[ans(b.id).sev] ?? 4));
    const findHtml = finds.length ? finds.map((i) => {
      const a = ans(i.id);
      return `<div class="card finding ${a.sev || ""}">
        <div class="f-top">
          <span class="f-sev">${a.sev ? a.sev + " · " + SEV.find((s) => s.k === a.sev).label : "Серьёзность не указана"}</span>
          <span class="plate">${i.id}</span>
          <span class="tag">${a.s === "partial" ? "Частично" : "Нет"}</span>
          ${a.exc ? '<span class="tag">Оформлено исключение</span>' : ""}
        </div>
        <p class="f-q">${esc(q(i, r.mode))}</p>
        ${a.note ? `<p class="f-note">${esc(a.note)}</p>` : '<p class="f-note empty-note">Нет описания. Добавьте, что именно не так, — иначе задачу не воспроизвести.</p>'}
        <div class="row">
          <button class="btn small" type="button" data-act="goto" data-id="${i.id}">Открыть пункт</button>
          <button class="btn small" type="button" data-act="copy-issue" data-id="${i.id}">Скопировать как задачу</button>
        </div>
      </div>`;
    }).join("") : '<p class="empty">Находок нет.</p>';
    const listBlock = (title, list) => list.length ? `
      <details class="card more" ${list.length <= 5 ? "open" : ""}>
        <summary><span>${title}</span><span class="g-count">${list.length}</span></summary>
        <ul class="list-plain">${list.map((i) => `<li><button class="linkbtn" type="button" data-act="goto" data-id="${i.id}">${i.id}</button> — ${esc(q(i, r.mode))}</li>`).join("")}</ul>
      </details>` : "";
    const pendingList = listBlock("Без ответа", x.unanswered);
    const unknownList = listBlock("Не удалось проверить", x.unknown);
    const people = r.mode === "audit" ? `
      <label class="toggle" style="color:var(--ink)"><input type="checkbox" id="people-checked" ${r.peopleChecked ? "checked" : ""}> Результат подтверждён наблюдением за 3–5 людьми, выполнявшими задачи без подсказок</label>` : "";
    const teamBtn = cap.db
      ? `<button class="btn primary" type="button" data-act="team-save">${r.savedToTeam ? "Сохранить сейчас" : "Сохранить в историю команды"}</button>` : "";
    const dlBtn = cap.downloads ? '<button class="btn" type="button" data-act="download">Скачать .md</button>' : "";
    const del = r.savedToTeam && cap.db ? (state.confirmDelete
      ? `<div class="confirm" role="alert"><span>Удалить проверку из истории команды без возможности восстановить?</span><button class="btn small danger" type="button" data-act="delete-yes">Удалить</button><button class="btn small" type="button" data-act="delete-no">Отмена</button></div>`
      : '<div><button class="btn small danger" type="button" data-act="delete-ask">Удалить из истории</button></div>') : "";
    return `
    <div class="check">
      ${sideHtml()}
      <div class="summary" style="padding-block:0">
        <section class="verdict tone-${v.tone}" aria-labelledby="verdict-h">
          <span class="eyebrow v-eyebrow">${esc(m.title)} · ${esc(r.product)}</span>
          <h1 id="verdict-h" tabindex="-1">${esc(v.title)}</h1>
          <ul>${v.detail.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>
        </section>
        ${people}
        <div class="stats">
          <div class="card stat"><b>${x.answered}/${x.items.length}</b><span>отвечено</span></div>
          ${SEV.map((s) => `<div class="card stat ${s.k}"><b>${x.sevCount[s.k]}</b><span>${s.k} · ${s.label.toLowerCase()}</span></div>`).join("")}
        </div>
        <section class="stack" style="gap:12px" aria-labelledby="finds-h">
          <h2 id="finds-h" style="font-size:22px">Находки</h2>
          <div class="findings">${findHtml}</div>
        </section>
        ${pendingList}
        ${unknownList}
        <section class="card export" aria-labelledby="export-h">
          <h2 id="export-h" style="font-size:20px">Отчёт</h2>
          <p class="muted">Отчёт в Markdown по шаблону отчёта аудита: вставьте в задачу, в документ или отдайте Claude, чтобы он завёл задачи по находкам.</p>
          <div class="row">
            ${teamBtn}
            <button class="btn" type="button" data-act="copy-report">Скопировать отчёт</button>
            ${dlBtn}
            <button class="btn" type="button" data-act="toggle-export">${state.exportOpen ? "Скрыть текст" : "Показать текст"}</button>
          </div>
          <p class="save-status" id="save-status" aria-live="polite"></p>
          <label class="hidden-text" for="export-text">Текст отчёта</label>
          <textarea id="export-text" readonly ${state.exportOpen ? "" : "hidden"}>${esc(reportMd())}</textarea>
          ${del}
        </section>
        <div class="row">
          <button class="btn" type="button" data-act="group" data-idx="0">← К пунктам</button>
          <button class="btn" type="button" data-go="home">Новая проверка</button>
        </div>
      </div>
    </div>`;
  }

  function renderGuide() {
    const f = state.guideStage;
    const chips = [["all", "Все"], ["М", "Макет"], ["М+Р", "Макет и сборка"], ["Р", "Сборка"]]
      .map(([k, l]) => `<button type="button" class="choice" data-act="guide-filter" data-v="${k}" aria-pressed="${f === k}">${l}</button>`).join("");
    const body = DATA.principles.map((p) => {
      const reqs = ITEMS.filter((i) => i.principle === p.n && (f === "all" || i.stage === f))
        .sort((a, b) => Number(a.id.split(".")[1]) - Number(b.id.split(".")[1]));
      if (!reqs.length) return "";
      return `<section class="principle" aria-labelledby="p-${p.n}">
        <div class="principle-head"><span class="num" aria-hidden="true">${p.n}</span><h2 id="p-${p.n}">${esc(p.title)}</h2></div>
        ${reqs.map((i) => `<article class="card req">
          <div class="item-top"><span class="plate">${i.id}</span><span class="tag">${LEVEL[i.level]}</span><span class="tag">${STAGE[i.stage]}</span>${i.quick ? '<span class="tag">В быстрой проверке</span>' : ""}</div>
          <p class="r-text">${esc(i.text)}</p>
          ${i.stage === "Р" ? `<div class="r-q"><b>Вопрос</b>${esc(i.q)}</div>`
            : i.stage === "М" ? `<div class="r-q"><b>Вопрос</b>${esc(i.q)}</div><div class="r-q"><b>Как проверить</b>${esc(i.how)}</div>`
            : `<div class="r-q"><b>В макете</b>${esc(i.qDesign)}</div><div class="r-q"><b>В продукте</b>${esc(i.q)}</div>`}
          <p class="r-red">Тревожный признак: ${esc(i.red)}</p>
        </article>`).join("")}
      </section>`;
    }).join("");
    return `
    <div class="guide">
      <div class="guide-intro">
        <span class="eyebrow">Стандарт · версия ${esc(DATA.version)}</span>
        <h1>Справочник требований</h1>
        <p>Все ${ITEMS.length} ${plural(ITEMS.length, "требование", "требования", "требований")} по десяти принципам Дитера Рамса — с вопросом, по которому их проверяют, и признаком нарушения. Принципы принадлежат Рамсу, требования и вопросы — наша интерпретация для цифровых продуктов.</p>
      </div>
      <div class="filters" role="group" aria-label="Этап проверки">${chips}</div>
      ${body}
    </div>`;
  }

  // ------------------------------------------------------------------ Отчёты
  const cell = (s) => String(s || "").replace(/\|/g, "\\|").replace(/\s*\n\s*/g, " ");
  function reportMd() {
    const r = state.review; if (!r) return "";
    const x = analyze(r), v = verdict(r), m = MODES[r.mode];
    const L = [`# ${m.title}: ${r.product}`, ""];
    L.push(`Стандарт дизайна ${DATA.version} · ${fmtDate(Date.now())}${r.people ? " · Участники: " + r.people : ""}`);
    if (r.scenario) L.push("", `**Что проверяли:** ${r.scenario}`);
    if (r.link) L.push("", `**Ссылка:** ${r.link}`);
    L.push("", "## Итог", "", `**${v.title}**`, "", ...v.detail.map((d) => "- " + d), "");
    L.push("| Серьёзность | Количество |", "| --- | --- |", ...SEV.map((s) => `| ${s.k} — ${s.label.toLowerCase()} | ${x.sevCount[s.k]} |`));
    L.push("", `Отвечено ${x.answered} из ${x.items.length}.`, "", "## Находки", "");
    const order = { P0: 0, P1: 1, P2: 2, P3: 3 };
    const finds = x.findings.slice().sort((a, b) => (order[ans(a.id).sev] ?? 4) - (order[ans(b.id).sev] ?? 4));
    if (finds.length) {
      L.push("| # | Требование | Серьёзность | Статус | Что проверяли | Что не так |", "| --- | --- | --- | --- | --- | --- |");
      finds.forEach((i, n) => {
        const a = ans(i.id);
        L.push(`| ${n + 1} | ${i.id} | ${a.sev || "не указана"} | ${STATUS_MD[a.s]}${a.exc ? ", исключение" : ""} | ${cell(q(i, r.mode))} | ${cell(a.note) || "—"} |`);
      });
    } else L.push("Находок нет.");
    L.push("", "## Все пункты", "");
    modeGroups(r.mode).forEach((g) => {
      L.push(`### ${g.title}`, "");
      g.items.forEach((i) => {
        const a = ans(i.id);
        L.push(`- ${a.s ? STATUS_MD[a.s] : "без ответа"}${a.sev ? " " + a.sev : ""} **${i.id}** — ${q(i, r.mode)}${a.note ? `\n  ${a.note.replace(/\n/g, "\n  ")}` : ""}`);
      });
      L.push("");
    });
    return L.join("\n").trim() + "\n";
  }
  function issueMd(id) {
    const r = state.review, i = BY_ID[id], a = ans(id), sev = SEV.find((s) => s.k === a.sev);
    const title = `[${id}] ${q(i, r.mode)}`;
    return [
      `**${title}**`, "",
      `**Требование:** ${id} — ${i.text}`, "",
      `**Серьёзность:** ${sev ? sev.k + " " + sev.label.toLowerCase() : "не указана"}`, "",
      `**Сценарий:** ${r.scenario || r.product}`, "",
      "## Что происходит", "", a.note || "<опишите шаги и наблюдаемое поведение>", "",
      "## Что ожидается по стандарту", "", q(i, r.mode), "",
      "## Доказательство", "", r.link ? r.link : "<скриншот, запись экрана, вывод автопроверки>", "",
    ].join("\n");
  }
  async function copyText(text, okMsg) {
    try {
      await navigator.clipboard.writeText(text);
      toast(okMsg);
    } catch (e) {
      state.exportOpen = true;
      render();
      const ta = $("#export-text");
      if (ta) { ta.value = text; ta.focus(); ta.select(); }
      toast("Не получилось скопировать автоматически — текст выделен, скопируйте его вручную.");
    }
  }

  // ------------------------------------------------------------------ Действия
  function startReview(form) {
    const product = form.product.value.trim();
    if (!product) { $("#f-product-err").hidden = false; form.product.focus(); return; }
    state.review = {
      id: null, mode: state.setupMode, product, scenario: form.scenario.value.trim(), link: form.link.value.trim(), people: form.people.value.trim(),
      answers: {}, peopleChecked: false, createdAt: Date.now(), authorId: cap.myId || "", savedToTeam: false,
    };
    saveStatus = "";
    state.view = "check"; state.groupIdx = 0; state.confirmDelete = false; state.exportOpen = false;
    persistDraft();
    render("#group-h");
    window.scrollTo(0, 0);
  }

  function setAnswer(id, patch) {
    const r = state.review;
    const a = Object.assign({}, r.answers[id] || {}, patch);
    if (!FINDING(a.s)) { delete a.sev; delete a.exc; }
    r.answers[id] = a;
    changed();
  }

  function rerenderItem(id, focusSel) {
    const el = $("#item-" + CSS.escape(id));
    if (el) el.outerHTML = itemHtml(BY_ID[id]);
    const side = $(".side");
    if (side) side.outerHTML = sideHtml();
    updateSaveUi();
    if (focusSel) { const f = $(focusSel); if (f) f.focus({ preventScroll: true }); }
  }

  function gotoItem(id) {
    const groups = modeGroups(state.review.mode);
    const idx = groups.findIndex((g) => g.items.some((i) => i.id === id));
    if (idx < 0) return;
    state.view = "check"; state.groupIdx = idx; persistDraft();
    render();
    const el = $("#item-" + CSS.escape(id));
    if (el) { el.scrollIntoView({ block: "start" }); const b = el.querySelector(".choice"); if (b) b.focus({ preventScroll: true }); }
  }

  async function openHistory(id) {
    const h = cap.history.find((x) => x.id === id);
    if (!h) return;
    let data = h;
    try { const snap = await cap.db.collection("reviews").doc(id).get(); if (snap.exists) data = snap.data(); } catch (e) { /* берём то, что уже пришло в подписке */ }
    state.review = deserialize(id, data);
    saveStatus = ""; state.view = "summary"; state.groupIdx = 0; state.confirmDelete = false; state.exportOpen = false;
    persistDraft();
    render("#verdict-h");
    window.scrollTo(0, 0);
  }

  async function deleteReview() {
    const r = state.review;
    if (!cap.db || !r || !r.id) return;
    try {
      await saveChain;
      await cap.db.collection("reviews").doc(r.id).delete();
      r.id = null; r.savedToTeam = false; saveStatus = ""; state.confirmDelete = false;
      persistDraft(); render(); toast("Проверка удалена из истории.");
    } catch (e) {
      state.confirmDelete = false; render();
      toast(e && e.code === "invalid_argument" ? "Нет прав удалить эту проверку." : "Не удалось удалить. Попробуйте ещё раз.");
    }
  }

  async function download() {
    const r = state.review;
    const name = `${MODES[r.mode].title} — ${r.product}`.replace(/[\\/:*?"<>|]+/g, " ").slice(0, 120) + ".md";
    try {
      await cap.downloads.save({ filename: name, data: reportMd() });
    } catch (e) {
      if (e && e.code === "declined") return;
      toast(e && e.code === "rate_limited" ? "Окно сохранения уже открыто." : "Скачать не получилось. Скопируйте отчёт.");
    }
  }

  document.addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]");
    if (go) {
      state.view = go.dataset.go; state.confirmDelete = false;
      if (state.view === "guide") { try { history.replaceState(null, "", "#guide"); } catch (err) { /* без истории */ } }
      else { try { history.replaceState(null, "", location.pathname + location.search); } catch (err) { /* без истории */ } }
      persistDraft(); render(); window.scrollTo(0, 0);
      return;
    }
    const t = e.target.closest("[data-act]");
    if (!t || t.tagName === "TEXTAREA") return;
    const act = t.dataset.act, id = t.dataset.id;
    switch (act) {
      case "new": state.setupMode = t.dataset.mode; state.view = "setup"; render("#f-product"); window.scrollTo(0, 0); break;
      case "resume": state.view = "check"; persistDraft(); render("#group-h"); window.scrollTo(0, 0); break;
      case "open-summary": state.view = "summary"; state.confirmDelete = false; persistDraft(); render("#verdict-h"); window.scrollTo(0, 0); break;
      case "group": state.view = "check"; state.groupIdx = Number(t.dataset.idx); persistDraft(); render("#group-h"); window.scrollTo(0, 0); break;
      case "status": {
        const cur = ans(id).s;
        setAnswer(id, { s: cur === t.dataset.v ? undefined : t.dataset.v });
        rerenderItem(id, `#item-${CSS.escape(id)} .choice[data-act="status"][data-v="${t.dataset.v}"]`);
        break;
      }
      case "sev": setAnswer(id, { sev: t.dataset.v }); rerenderItem(id, `#item-${CSS.escape(id)} .sev[data-v="${t.dataset.v}"]`); break;
      case "goto": gotoItem(id); break;
      case "copy-issue": copyText(issueMd(id), "Задача скопирована."); break;
      case "copy-report": copyText(reportMd(), "Отчёт скопирован."); break;
      case "toggle-export": state.exportOpen = !state.exportOpen; render(); break;
      case "download": download(); break;
      case "team-save": teamSaveNow(); break;
      case "delete-ask": state.confirmDelete = true; render(); break;
      case "delete-no": state.confirmDelete = false; render(); break;
      case "delete-yes": deleteReview(); break;
      case "open-history": openHistory(id); break;
      case "guide-filter": state.guideStage = t.dataset.v; render(); break;
    }
  });

  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "hints-toggle") { prefs.hints = t.checked; store.set(PREF_KEY, prefs); render("#hints-toggle"); return; }
    if (t.id === "people-checked") { state.review.peopleChecked = t.checked; changed(); render("#people-checked"); return; }
    if (t.dataset && t.dataset.act === "exc") { setAnswer(t.dataset.id, { exc: t.checked }); rerenderItem(t.dataset.id, `#item-${CSS.escape(t.dataset.id)} input[data-act="exc"]`); }
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.act === "note") {
      const r = state.review, id = t.dataset.id;
      r.answers[id] = Object.assign({}, r.answers[id] || {}, { note: t.value });
      changed();
    }
    if (t.id === "f-product" && t.value.trim()) { const err = $("#f-product-err"); if (err) err.hidden = true; }
  });

  document.addEventListener("submit", (e) => {
    if (e.target.id === "setup-form") { e.preventDefault(); startReview(e.target); }
  });

  render();
  initCapabilities();
})();
</script>
