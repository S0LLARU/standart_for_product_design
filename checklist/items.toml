[items."R4.6"]
group = "path"
q = "Если команда недоступна, понятно почему?"
how = "Найдите все неактивные кнопки и пункты меню. Сможет ли человек понять, что сделать, чтобы команда стала доступной?"
red = "Серая кнопка «Отправить» без намёка, какое поле не заполнено."

[items."R10.2"]
group = "path"
quick = true
q = "После упрощения человеку не нужно помнить, где что спрятано?"
how = "Если что-то убрали или спрятали, пройдите сценарий заново как новичок. Находится ли скрытое без подсказки? Не стало ли больше поиска?"
red = "Все действия собраны в одно меню: кнопок стало меньше, а поиска — больше."

[items."R7.2"]
group = "path"
q = "Если меняется привычная навигация или названия, есть план перехода, и старые ссылки работают?"
how = "Сравните с текущей версией продукта. Для каждого переезда: как человек найдёт старое действие, откроются ли сохранённые ссылки? Ничего не меняется — «Н/п»."
red = "Раздел переименован и перенесён без подсказки, закладки ведут на ошибку."

