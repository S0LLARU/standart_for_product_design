# Человеческий слой чек-листа.
#
# Нормативный текст, уровень и этап каждого требования берутся из STANDARD.md.
# Здесь — то, что нужно человеку, который сам проходит чек-лист:
#   group      — блок в порядке прохождения (см. [groups])
#   q          — вопрос для работающего продукта (аудит, приёмка)
#   q_design   — вопрос для макета, если отличается (обычно у этапа М+Р)
#   how        — как проверить в продукте
#   how_design — как проверить в макете, если отличается
#   red        — тревожный признак: как выглядит нарушение
#   quick      — входит в быструю проверку
#
# После правки запустите: python3 scripts/build_checklist.py

[groups.task]
order = 1
title = "Задача"
intro = "Перед тем как смотреть экраны. Если задача неясна, дальше проверять рано."

[groups.glance]
order = 2
title = "Первый взгляд на экран"
intro = "Откройте ключевой экран и посмотрите на него как человек, который видит его впервые."

[groups.path]
order = 3
title = "Проходим сценарий"
intro = "Пройдите сценарий от входа до результата, включая возврат назад."

[groups.words]
order = 4
title = "Тексты и обещания"
intro = "Прочитайте все тексты сценария подряд: кнопки, подтверждения, подписи."

[groups.trouble]
order = 5
title = "Когда что-то идёт не так"
intro = "Что видит человек при ожидании, ошибке и прерывании."

[groups.data]
order = 6
title = "Реальные данные"
intro = "Подставьте настоящее содержимое вместо идеального."

[groups.system]
order = 7
title = "Дизайн-система"
intro = "Сверка с токенами и библиотекой компонентов."

[groups.access]
order = 8
title = "Клавиатура, цвет, движение"
intro = "Без мыши, без различения цвета, без анимаций."

[groups.result]
order = 9
title = "Результат и данные человека"
intro = "Что человек уносит из продукта и что остаётся в нём."

[groups.build]
order = 10
title = "Только в сборке"
intro = "Эти пункты проверяются в работающем продукте."

# ---------------------------------------------------------------- Задача

[items."R2.1"]
group = "task"
quick = true
q = "Понятно, кто пользователь, в какой он ситуации и какой результат должен получить?"
how = "Найдите описание решения. Попробуйте одной фразой назвать момент ценности: «человек … и убедился, что …». Если фраза не складывается, дальше проверять рано."
red = "Цель сформулирована как функция: «добавить фильтры», «сделать дашборд»."

[items."R1.1"]
group = "task"
q = "Если есть новая или нестандартная механика, понятно, какую проблему она решает лучше привычного способа?"
how = "Найдите запись решения: в ней должны быть затруднение и сравнение с привычным способом на одной задаче. Новой механики нет — отметьте «Н/п»."
red = "Обоснование звучит как «так современнее» или «у конкурентов так»."

[items."R1.3"]
group = "task"
q = "Знакомые механики заменены только там, где выигрыш объясним?"
how = "Отметьте места, где интерфейс ведёт себя не так, как в похожих продуктах: поиск, выбор даты, меню, жесты. Для каждого спросите, что человек получает взамен обучения."
red = "Своя прокрутка или свой выбор даты без явной выгоды."

[items."R7.5"]
group = "task"
q = "Визуальные приёмы объяснимы задачей, а не модой?"
how = "Для каждого заметного эффекта (стекло, градиенты, крупные скругления, тени) назовите его роль: иерархия, действие, характер продукта. Роль не называется — это мода."
red = "Эффект появился, потому что «сейчас так делают»."

# ---------------------------------------------------------------- Первый взгляд

[items."R3.1"]
group = "glance"
quick = true
q = "С первого взгляда понятно, что на экране главное и что делать дальше?"
how = "Посмотрите на экран 5 секунд, отвернитесь и назовите главное действие и главные данные. Сравните с тем, что важно для задачи. Помогает уменьшить или размыть макет."
red = "Три одинаково ярких кнопки, или баннер заметнее основного содержимого."

[items."R2.2"]
group = "glance"
quick = true
q = "Основное частое действие под рукой, а не спрятано в меню?"
how = "Назовите действие, которое человек делает чаще всего в этом сценарии, и посчитайте шаги до него с того экрана, где он находится."
red = "Ежедневное действие лежит в «⋯» или в настройках."

[items."R3.5"]
group = "glance"
q = "Каждый акцентный цвет означает одно и то же во всём продукте?"
how = "Выпишите акцентные цвета сценария и роль каждого: действие, ошибка, предупреждение, успех, выбор. У одного цвета — одна роль."
red = "Синий — это и ссылка, и выбранная строка, и информационный баннер."

[items."R4.5"]
group = "glance"
q = "Одна иконка везде означает одно действие, а кликабельное отличается от некликабельного?"
how = "Сравните одинаковые иконки на разных экранах: делают ли они одно и то же? Попробуйте угадать, что нажимается, не наводя курсор."
red = "Карандаш где-то редактирует, а где-то открывает подробности; серый текст похож на ссылку."

[items."R10.1"]
group = "glance"
q = "У каждого элемента и шага есть работа, и нет двух способов сделать одно и то же без причины?"
how = "Укажите на каждый элемент и спросите: что сломается, если его убрать? Найдите дубли — одно действие в шапке, в меню и в карточке."
red = "Элемент «для красоты» или «на всякий случай»."

[items."R10.3"]
group = "glance"
q = "Частое — на виду, редкое — раскрывается, когда нужно?"
how = "Разделите действия и настройки экрана на частые и редкие. Частые видны сразу, редкие доступны в одно понятное раскрытие."
red = "Редкая техническая настройка занимает место на главном экране, а частое действие скрыто."

# ---------------------------------------------------------------- Сценарий

[items."R4.1"]
group = "path"
quick = true
q = "На любом шаге понятно, где я, что выбрано и как вернуться назад?"
