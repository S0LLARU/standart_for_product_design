how = "Вызовите каждое состояние в продукте: новый аккаунт, поиск без результатов, отключённая сеть, чужая ссылка без прав."
how_design = "Откройте страницу «Состояния» и пройдите по экранам сценария. Каждое недостающее состояние — отдельная находка."
