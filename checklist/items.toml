# Чек-лист стандарта: человеческий слой и общие критерии для двух проверок.
#
# Нормативный текст, уровень и этап каждого требования берутся из STANDARD.md.
# Здесь — то, по чему проверяют человек и ИИ:
#   group            — блок в порядке прохождения (см. [groups])
#   q / q_design     — вопрос для продукта и для макета (q_design — если отличается)
#   how / how_design — как проверить
#   red              — тревожный признак: как выглядит нарушение
#   criteria         — критерии «да/нет» для продукта (для этапа М — и для макета)
#   criteria_design  — критерии для макета у этапа М+Р
#   ive, hig, w3c    — на что ещё опирается требование, кроме принципа Рамса
#   quick            — входит в быструю проверку
#
# Критерий — одно наблюдаемое утверждение. Его можно проверить и ответить «да» или «нет».
# Требование выполнено, когда выполнены все его критерии.
#
# После правки запустите: python3 scripts/build_checklist.py

