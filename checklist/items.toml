how = "Пройдите сценарий и отметьте каждый повторный ввод и каждое место, где нужно помнить что-то с прошлого шага."
how_design = "Проследите данные по фреймам: подставлено ли дальше то, что человек ввёл раньше? Остаётся ли ввод на месте при возврате на шаг?"
red = "Адрес доставки нужно ввести снова на шаге оплаты."

[items."R4.3"]
group = "path"
q = "Поиск говорит, где он ищет, а применённые фильтры видны и снимаются по одному?"
how = "Примените два фильтра и поищите. Видно ли, что фильтры действуют? Можно ли снять один, не сбрасывая всё? Отличается ли «нет совпадений» от «пока нет данных»? Поиска и фильтров нет — «Н/п»."
red = "Пустой список без объяснения, что виноват забытый фильтр."

[items."R4.4"]
group = "path"
q = "Подписи полей не исчезают при вводе, формат объяснён заранее, ошибка стоит у своего поля?"
how = "Посмотрите заполненную форму: понятно ли, что в каком поле? Есть ли подсказка формата до ввода? Где показана ошибка?"
