how = "Пройдите сценарий и на каждом шаге ответьте: где я, что выбрано, как вернуться. В вебе нажмите «Назад», откройте страницу в новой вкладке, обновите её."
how_design = "На каждом фрейме ответьте: где я, что выбрано, как вернуться. Для веба проверьте аннотацию: какие переходы меняют адрес и куда ведёт «Назад»."
red = "После перехода пропадает выбранный пункт навигации; «Назад» выбрасывает из сценария."

[items."R2.3"]
group = "path"
q = "Каждое обязательное поле и шаг действительно нужны именно сейчас?"
how = "Для каждого обязательного поля спросите: можно ли закончить задачу без него или запросить его позже? Посчитайте шаги до результата."
red = "Десять полей регистрации до того, как человек увидел пользу."

[items."R2.4"]
group = "path"
q = "Данные не приходится вводить дважды, и контекст сохраняется между шагами?"
