описано, что именно оно повторяет.\n3. Описано, что сохраняется при ошибке.\nТревожный признак: После ошибки сервера форма очищается.","aiBuild":"### R8.2 — обязательно\nВопрос: После исправимой ошибки введённое сохраняется, а повторить можно только неудачное?\nКритерии:\n1. После исправимой ошибки введённые данные на месте.\n2. Можно повторить только неудавшуюся часть.\n3. Успешные результаты не теряются при повторе.\nТревожный признак: После ошибки сервера форма очищается."},{"id":"R8.9","principle":8,"text":"Выход из сценария или диалога с несохранёнными изменениями не теряет их молча: изменения сохраняются, или человек видит выбор с понятными последствиями","level":"О","stage":"М+Р","check":"Сценарий с закрытием, Esc и «Назад»","group":"trouble","q":"Если уйти из сценария или закрыть окно с несохранёнными изменениями, они не пропадают молча?","qDesign":"Описано, что происходит с несохранёнными изменениями при закрытии окна и уходе со страницы?","how":"Начните редактировать, затем закройте окно крестиком, нажмите Esc, «Назад», кликните мимо окна, перейдите в другой раздел.","howDesign":"Найдите аннотацию закрытия у форм и диалогов: что будет с изменениями при крестике, Esc, «Назад» и клике мимо окна.","red":"Форма закрывается по клику мимо окна, и всё введённое пропадает.","criteria":["При закрытии окна или уходе со страницы несохранённые изменения сохраняются или человек видит выбор.","Выбор называет, что будет потеряно.","Esc, «Назад» и клик мимо окна ведут себя так же, как закрытие крестиком."],"criteriaDesign":["Описано, что происходит с несохранёнными изменениями при закрытии и уходе.","Если показывается выбор, нарисован его текст.","Описано поведение для Esc, «Назад» и клика мимо окна."],"quick":true,"ive":[{"n":1,"title":"Забота о человеке выражается в устройстве продукта"}],"hig":[{"key":"Modality","title":"Modality — модальность","url":"https://developer.apple.com/design/human-interface-guidelines/modality"},{"key":"Agency","title":"Принцип Agency — самостоятельность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R8.9 — обязательно\nВопрос: Описано, что происходит с несохранёнными изменениями при закрытии окна и уходе со страницы?\nКритерии:\n1. Описано, что происходит с несохранёнными изменениями при закрытии и уходе.\n2. Если показывается выбор, нарисован его текст.\n3. Описано поведение для Esc, «Назад» и клика мимо окна.\nТревожный признак: Форма закрывается по клику мимо окна, и всё введённое пропадает.","aiBuild":"### R8.9 — обязательно\nВопрос: Если уйти из сценария или закрыть окно с несохранёнными изменениями, они не пропадают молча?\nКритерии:\n1. При закрытии окна или уходе со страницы несохранённые изменения сохраняются или человек видит выбор.\n2. Выбор называет, что будет потеряно.\n3. Esc, «Назад» и клик мимо окна ведут себя так же, как закрытие крестиком.\nТревожный признак: Форма закрывается по клику мимо окна, и всё введённое пропадает."},{"id":"R6.1","principle":6,"text":"Успех сообщается только после подтверждения результата системой; различаются локальное сохранение, отправка, обработка и синхронизация, когда это влияет на действия человека","level":"О","stage":"М+Р","check":"Проверка с медленной и отключённой сетью","group":"trouble","q":"«Готово» и «Сохранено» появляются, только когда это правда?","qDesign":"Описано, какие стадии результата различает система и что человек видит на каждой?","how":"Сохраните что-нибудь на медленной сети и без сети. Совпадает ли сообщение с тем, что произошло на самом деле? Видно ли, что сохранено локально, а что синхронизировано?","howDesign":"Найдите аннотацию стадий: локально, отправлено, обработано, синхронизировано — и что видит человек на каждой. Сверьте с разработчиком, какие стадии система действительно различает.","red":"Галочка «Отправлено» появляется сразу, хотя запрос мог не дойти.","criteria":["«Сохранено», «Отправлено», «Готово» появляются только после подтверждения системой.","Без сети видно, что изменения сохранены только на устройстве.","После восстановления связи видно, что изменения синхронизированы."],"criteriaDesign":["Перечислены стадии результата, которые различает система.","Для каждой стадии нарисовано, что видит человек.","Стадии сверены с разработчиком."],"quick":true,"ive":[{"n":1,"title":"Забота о человеке выражается в устройстве продукта"},{"n":9,"title":"Детали помогают понять, как обращаться с продуктом"}],"hig":[{"key":"Progress indicators","title":"Progress indicators — индикаторы прогресса","url":"https://developer.apple.com/design/human-interface-guidelines/progress-indicators"},{"key":"Responsibility","title":"Принцип Responsibility — ответственность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R6.1 — обязательно\nВопрос: Описано, какие стадии результата различает система и что человек видит на каждой?\nКритерии:\n1. Перечислены стадии результата, которые различает система.\n2. Для каждой стадии нарисовано, что видит человек.\n3. Стадии сверены с разработчиком.\nТревожный признак: Галочка «Отправлено» появляется сразу, хотя запрос мог не дойти.","aiBuild":"### R6.1 — обязательно\nВопрос: «Готово» и «Сохранено» появляются, только когда это правда?\nКритерии:\n1. «Сохранено», «Отправлено», «Готово» появляются только после подтверждения системой.\n2. Без сети видно, что изменения сохранены только на устройстве.\n3. После восстановления связи видно, что изменения синхронизированы.\nТревожный признак: Галочка «Отправлено» появляется сразу, хотя запрос мог не дойти."},{"id":"R6.3","principle":6,"text":"Индикатор прогресса точен: определённый, когда объём известен, неопределённый — когда нет","level":"О","stage":"М+Р","check":"Проверка в реализации","group":"trouble","q":"Индикатор прогресса не притворяется точным?","qDesign":"Указано, какой индикатор прогресса используется и почему?","how":"Запустите долгую операцию. Если показаны проценты, соответствуют ли они реальному ходу? Если объём неизвестен, используется ли неопределённый индикатор?","howDesign":"Для каждой долгой операции проверьте: известен ли объём, и подобран ли под это определённый или неопределённый индикатор.","red":"Полоса быстро доходит до 90% и висит минуту.","criteria":["Если объём известен, прогресс показан определённым индикатором.","Если объём неизвестен, индикатор не показывает выдуманных процентов.","Индикатор движется в соответствии с реальным ходом операции."],"criteriaDesign":["Для каждой долгой операции указано, известен ли объём работы.","Выбранный индикатор соответствует этому: определённый или неопределённый.","Для долгой операции описана отмена, если она возможна."],"quick":false,"ive":[],"hig":[{"key":"Progress indicators","title":"Progress indicators — индикаторы прогресса","url":"https://developer.apple.com/design/human-interface-guidelines/progress-indicators"}],"w3c":[],"aiDesign":"### R6.3 — обязательно\nВопрос: Указано, какой индикатор прогресса используется и почему?\nКритерии:\n1. Для каждой долгой операции указано, известен ли объём работы.\n2. Выбранный индикатор соответствует этому: определённый или неопределённый.\n3. Для долгой операции описана отмена, если она возможна.\nТревожный признак: Полоса быстро доходит до 90% и висит минуту.","aiBuild":"### R6.3 — обязательно\nВопрос: Индикатор прогресса не притворяется точным?\nКритерии:\n1. Если объём известен, прогресс показан определённым индикатором.\n2. Если объём неизвестен, индикатор не показывает выдуманных процентов.\n3. Индикатор движется в соответствии с реальным ходом операции.\nТревожный признак: Полоса быстро доходит до 90% и висит минуту."},{"id":"R5.1","principle":5,"text":"Модальное окно и предупреждение используются только когда нужно решение человека сейчас; обычные обратимые действия не подтверждаются, а отменяются","level":"О","stage":"М","check":"Ревью сценария","group":"trouble","q":"Каждое модальное окно и подтверждение требует реального решения?","qDesign":"Каждое модальное окно и подтверждение требует реального решения?","how":"Перечислите модальные окна и подтверждения сценария. Нужно ли в каждом решить что-то прямо сейчас? Обратимые действия лучше отменять, чем подтверждать.","howDesign":"Перечислите модальные окна и подтверждения сценария. Нужно ли в каждом решить что-то прямо сейчас? Обратимые действия лучше отменять, чем подтверждать.","red":"Модальное окно «Изменения сохранены» с кнопкой «ОК».","criteria":["Каждое модальное окно требует от человека решения прямо сейчас.","Обратимые действия не подтверждаются, а отменяются.","Из каждого модального окна есть понятный выход.","Об успешном действии не сообщают модальным окном."],"criteriaDesign":["Каждое модальное окно требует от человека решения прямо сейчас.","Обратимые действия не подтверждаются, а отменяются.","Из каждого модального окна есть понятный выход.","Об успешном действии не сообщают модальным окном."],"quick":true,"ive":[],"hig":[{"key":"Modality","title":"Modality — модальность","url":"https://developer.apple.com/design/human-interface-guidelines/modality"},{"key":"Alerts","title":"Alerts — предупреждения","url":"https://developer.apple.com/design/human-interface-guidelines/alerts"}],"w3c":[],"aiDesign":"### R5.1 — обязательно\nВопрос: Каждое модальное окно и подтверждение требует реального решения?\nКритерии:\n1. Каждое модальное окно требует от человека решения прямо сейчас.\n2. Обратимые действия не подтверждаются, а отменяются.\n3. Из каждого модального окна есть понятный выход.\n4. Об успешном действии не сообщают модальным окном.\nТревожный признак: Модальное окно «Изменения сохранены» с кнопкой «ОК».","aiBuild":"### R5.1 — обязательно\nВопрос: Каждое модальное окно и подтверждение требует реального решения?\nКритерии:\n1. Каждое модальное окно требует от человека решения прямо сейчас.\n2. Обратимые действия не подтверждаются, а отменяются.\n3. Из каждого модального окна есть понятный выход.\n4. Об успешном действии не сообщают модальным окном.\nТревожный признак: Модальное окно «Изменения сохранены» с кнопкой «ОК»."},{"id":"R5.2","principle":5,"text":"Фоновые обновления не перехватывают фокус и не сбивают позицию чтения или ввода","level":"О","stage":"М+Р","check":"Проверка в реализации","group":"trouble","q":"Фоновые обновления не сбивают фокус, позицию чтения и ввод?","qDesign":"Описано, что меняется на экране при фоновом обновлении и что остаётся на месте?","how":"Пока читаете или вводите текст, вызовите обновление данных. Прыгает ли список? Теряется ли курсор?","howDesign":"Найдите экраны с живыми данными. Есть ли аннотация: новое появляется с плашкой «Показать новые» или вставляется молча?","red":"Новый комментарий сдвигает текст, который человек читает.","criteria":["Фоновое обновление не сбивает позицию чтения.","Фоновое обновление не уводит фокус и курсор.","Новое содержимое заметно, но не прерывает работу."],"criteriaDesign":["Отмечены экраны с живыми данными.","Описано, как появляется новое содержимое.","Описано, что остаётся на месте при обновлении."],"quick":false,"ive":[{"n":1,"title":"Забота о человеке выражается в устройстве продукта"}],"hig":[{"key":"Agency","title":"Принцип Agency — самостоятельность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R5.2 — обязательно\nВопрос: Описано, что меняется на экране при фоновом обновлении и что остаётся на месте?\nКритерии:\n1. Отмечены экраны с живыми данными.\n2. Описано, как появляется новое содержимое.\n3. Описано, что остаётся на месте при обновлении.\nТревожный признак: Новый комментарий сдвигает текст, который человек читает.","aiBuild":"### R5.2 — обязательно\nВопрос: Фоновые обновления не сбивают фокус, позицию чтения и ввод?\nКритерии:\n1. Фоновое обновление не сбивает позицию чтения.\n2. Фоновое обновление не уводит фокус и курсор.\n3. Новое содержимое заметно, но не прерывает работу.\nТревожный признак: Новый комментарий сдвигает текст, который человек читает."},{"id":"R5.4","principle":5,"text":"Уведомления разделены на срочные и несрочные, повторяющиеся объединяются, частота и каналы настраиваются","level":"Р","stage":"М","check":"Ревью системы уведомлений","group":"trouble","q":"Уведомления разделены по срочности, не дублируются и настраиваются?","qDesign":"Уведомления разделены по срочности, не дублируются и настраиваются?","how":"Перечислите уведомления сценария. Какие требуют действия сейчас, а какие подождут? Объединяются ли повторяющиеся? Уведомлений нет — «Н/п».","howDesign":"Перечислите уведомления сценария. Какие требуют действия сейчас, а какие подождут? Объединяются ли повторяющиеся? Уведомлений нет — «Н/п».","red":"Десять одинаковых уведомлений подряд; один тип нельзя отключить.","criteria":["Уведомления разделены на срочные и несрочные.","Повторяющиеся уведомления объединяются.","Человек может настроить или отключить тип уведомлений."],"criteriaDesign":["Уведомления разделены на срочные и несрочные.","Повторяющиеся уведомления объединяются.","Человек может настроить или отключить тип уведомлений."],"quick":false,"ive":[{"n":12,"title":"Ответственность продолжается после выпуска"}],"hig":[{"key":"Agency","title":"Принцип Agency — самостоятельность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R5.4 — рекомендуется\nВопрос: Уведомления разделены по срочности, не дублируются и настраиваются?\nКритерии:\n1. Уведомления разделены на срочные и несрочные.\n2. Повторяющиеся уведомления объединяются.\n3. Человек может настроить или отключить тип уведомлений.\nТревожный признак: Десять одинаковых уведомлений подряд; один тип нельзя отключить.","aiBuild":"### R5.4 — рекомендуется\nВопрос: Уведомления разделены по срочности, не дублируются и настраиваются?\nКритерии:\n1. Уведомления разделены на срочные и несрочные.\n2. Повторяющиеся уведомления объединяются.\n3. Человек может настроить или отключить тип уведомлений.\nТревожный признак: Десять одинаковых уведомлений подряд; один тип нельзя отключить."},{"id":"R3.3","principle":3,"text":"Композиция выдерживает реальные данные: длинные названия, 0, 1 и много элементов, пользовательские изображения, выбранные состояния","level":"О","stage":"М+Р","check":"Проверка на реальном содержимом","group":"data","q":"Длинные названия, пустые и переполненные списки, чужие картинки не ломают экран?","qDesign":"В макете есть фреймы с крайними данными: длинные названия, 0, 1 и много элементов, чужие изображения?","how":"Создайте объект с очень длинным названием, пустой список и список на сотни строк, загрузите вертикальную и тёмную картинку.","howDesign":"Откройте страницу «Крайние данные». Если её нет, подставьте в ключевые экраны длинный текст и пустые списки сами.","red":"Название обрезано так, что два объекта не различить; в макете только «Проект 1».","criteria":["Очень длинное название не ломает раскладку, и объекты остаются различимыми.","Пустой список выглядит как задуманное состояние.","Список на сотни элементов остаётся удобным.","Пользовательские изображения разных пропорций и цветов не ломают экран."],"criteriaDesign":["Есть фрейм с очень длинными названиями.","Есть фреймы с 0, 1 и многими элементами.","Есть фрейм с пользовательскими изображениями разных пропорций."],"quick":true,"ive":[{"n":6,"title":"Прототип должен позволять испытать существенные свойства"},{"n":7,"title":"Способ реализации входит в дизайн"}],"hig":[{"key":"Layout","title":"Layout — компоновка","url":"https://developer.apple.com/design/human-interface-guidelines/layout"},{"key":"Craft","title":"Принцип Craft — качество исполнения","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R3.3 — обязательно\nВопрос: В макете есть фреймы с крайними данными: длинные названия, 0, 1 и много элементов, чужие изображения?\nКритерии:\n1. Есть фрейм с очень длинными названиями.\n2. Есть фреймы с 0, 1 и многими элементами.\n3. Есть фрейм с пользовательскими изображениями разных пропорций.\nТревожный признак: Название обрезано так, что два объекта не различить; в макете только «Проект 1».","aiBuild":"### R3.3 — обязательно\nВопрос: Длинные названия, пустые и переполненные списки, чужие картинки не ломают экран?\nКритерии:\n1. Очень длинное название не ломает раскладку, и объекты остаются различимыми.\n2. Пустой список выглядит как задуманное состояние.\n3. Список на сотни элементов остаётся удобным.\n4. Пользовательские изображения разных пропорций и цветов не ломают экран.\nТревожный признак: Название обрезано так, что два объекта не различить; в макете только «Проект 1»."},{"id":"R7.4","principle":7,"text":"Компоненты проверены на рост числа элементов, длинные переводы и дополнительные состояния","level":"Р","stage":"М","check":"Проверка на крайних данных","group":"data","q":"Компоненты выдерживают рост данных и длинный перевод?","qDesign":"Компоненты выдерживают рост данных и длинный перевод?","how":"Представьте, что элементов стало в десять раз больше, а текст при переводе стал длиннее на треть. Что сломается первым: навигация, таблица, кнопки?","howDesign":"Представьте, что элементов стало в десять раз больше, а текст при переводе стал длиннее на треть. Что сломается первым: навигация, таблица, кнопки?","red":"Вкладки рассчитаны ровно на четыре раздела.","criteria":["Навигация и списки выдерживают рост числа элементов.","Кнопки и подписи выдерживают текст длиннее на треть.","Новые состояния и роли можно добавить без нового компонента."],"criteriaDesign":["Навигация и списки выдерживают рост числа элементов.","Кнопки и подписи выдерживают текст длиннее на треть.","Новые состояния и роли можно добавить без нового компонента."],"quick":false,"ive":[{"n":7,"title":"Способ реализации входит в дизайн"}],"hig":[{"key":"Flexibility","title":"Принцип Flexibility — гибкость","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R7.4 — рекомендуется\nВопрос: Компоненты выдерживают рост данных и длинный перевод?\nКритерии:\n1. Навигация и списки выдерживают рост числа элементов.\n2. Кнопки и подписи выдерживают текст длиннее на треть.\n3. Новые состояния и роли можно добавить без нового компонента.\nТревожный признак: Вкладки рассчитаны ровно на четыре раздела.","aiBuild":"### R7.4 — рекомендуется\nВопрос: Компоненты выдерживают рост данных и длинный перевод?\nКритерии:\n1. Навигация и списки выдерживают рост числа элементов.\n2. Кнопки и подписи выдерживают текст длиннее на треть.\n3. Новые состояния и роли можно добавить без нового компонента.\nТревожный признак: Вкладки рассчитаны ровно на четыре раздела."},{"id":"R8.6","principle":8,"text":"Проверены длинные строки, переносы, форматы дат и чисел, поддерживаемые языки","level":"О","stage":"М+Р","check":"Проверка на крайних данных","group":"data","q":"Даты, числа, переносы и длинные строки выглядят правильно?","qDesign":"Показаны длинные строки, переносы, форматы дат и чисел?","how":"Проверьте большие суммы, отрицательные числа, даты прошлых лет, длинные слова без пробелов, имена на разных языках.","howDesign":"Найдите в макете примеры вроде «1 234 567,89 ₽», даты прошлого года, длинного адреса почты. Их нет — это находка.","red":"Сумма вылезает из ячейки; дата в непривычном для аудитории формате.","criteria":["Большие и отрицательные числа выводятся правильно и помещаются.","Даты показаны в формате, привычном аудитории.","Длинные слова и адреса переносятся, а не вылезают за край.","Имена на разных языках выводятся правильно."],"criteriaDesign":["Есть примеры больших чисел и сумм.","Есть примеры дат, включая прошлый год.","Есть примеры длинных слов, адресов и имён."],"quick":false,"ive":[{"n":7,"title":"Способ реализации входит в дизайн"}],"hig":[{"key":"Flexibility","title":"Принцип Flexibility — гибкость","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},{"key":"Writing","title":"Writing — тексты","url":"https://developer.apple.com/design/human-interface-guidelines/writing"}],"w3c":[],"aiDesign":"### R8.6 — обязательно\nВопрос: Показаны длинные строки, переносы, форматы дат и чисел?\nКритерии:\n1. Есть примеры больших чисел и сумм.\n2. Есть примеры дат, включая прошлый год.\n3. Есть примеры длинных слов, адресов и имён.\nТревожный признак: Сумма вылезает из ячейки; дата в непривычном для аудитории формате.","aiBuild":"### R8.6 — обязательно\nВопрос: Даты, числа, переносы и длинные строки выглядят правильно?\nКритерии:\n1. Большие и отрицательные числа выводятся правильно и помещаются.\n2. Даты показаны в формате, привычном аудитории.\n3. Длинные слова и адреса переносятся, а не вылезают за край.\n4. Имена на разных языках выводятся правильно.\nТревожный признак: Сумма вылезает из ячейки; дата в непривычном для аудитории формате."},{"id":"R3.4","principle":3,"text":"Текст читаем: контраст соответствует WCAG 2.2 AA на фактическом фоне, вспомогательный текст не осветлён до нечитаемости, интерфейс работает при увеличении до 200%","level":"О","stage":"М+Р","check":"Автопроверка контраста, ручная проверка масштаба","group":"data","q":"Текст легко читается: контраст не ниже AA, а при увеличении до 200% ничего не обрезано?","qDesign":"Контраст текста проверен в макете, и описано, как раскладка ведёт себя при увеличении?","how":"Прогоните автопроверку контраста. Увеличьте страницу до 200% и пройдите сценарий.","howDesign":"Проверьте контраст всех цветов текста, особенно вспомогательного. Есть ли фрейм или правило для увеличенного текста?","red":"Светло-серый мелкий текст на белом фоне.","criteria":["Контраст основного текста не ниже уровня AA WCAG.","Контраст вспомогательного текста и подписей не ниже уровня AA.","При увеличении до 200% ничего не обрезано и не перекрыто.","При увеличении основные действия остаются доступными."],"criteriaDesign":["Контраст основного текста проверен на уровень AA.","Контраст вспомогательного текста и подписей проверен на уровень AA.","Описано, как раскладка ведёт себя при увеличении текста."],"quick":false,"ive":[],"hig":[{"key":"Typography","title":"Typography — типографика","url":"https://developer.apple.com/design/human-interface-guidelines/typography"},{"key":"Accessibility","title":"Accessibility — доступность","url":"https://developer.apple.com/design/human-interface-guidelines/accessibility"}],"w3c":[{"key":"WCAG","title":"WCAG 2.2","url":"https://www.w3.org/WAI/WCAG22/quickref/"}],"aiDesign":"### R3.4 — обязательно\nВопрос: Контраст текста проверен в макете, и описано, как раскладка ведёт себя при увеличении?\nКритерии:\n1. Контраст основного текста проверен на уровень AA.\n2. Контраст вспомогательного текста и подписей проверен на уровень AA.\n3. Описано, как раскладка ведёт себя при увеличении текста.\nТревожный признак: Светло-серый мелкий текст на белом фоне.","aiBuild":"### R3.4 — обязательно\nВопрос: Текст легко читается: контраст не ниже AA, а при увеличении до 200% ничего не обрезано?\nКритерии:\n1. Контраст основного текста не ниже уровня AA WCAG.\n2. Контраст вспомогательного текста и подписей не ниже уровня AA.\n3. При увеличении до 200% ничего не обрезано и не перекрыто.\n4. При увеличении основные действия остаются доступными.\nТревожный признак: Светло-серый мелкий текст на белом фоне."},{"id":"R3.2","principle":3,"text":"Интервалы отражают группы, выравнивание устойчиво; отступы, типографика и цвета берутся из токенов дизайн-системы","level":"О","stage":"М+Р","check":"Ревью макета и кода","group":"system","q":"Цвета, шрифты и отступы взяты из токенов, а группы читаются по интервалам?","qDesign":"Используются переменные и стили библиотеки, без «ручных» цветов и отступов?","how":"Сравните с дизайн-системой: нет ли значений, которых в ней нет? Видно ли по отступам, что к чему относится?","howDesign":"Выделите слои и проверьте привязку цветов и типографики к переменным и стилям. Поищите отступы вне шкалы.","red":"Пятнадцать оттенков серого; между группами столько же места, сколько внутри группы.","criteria":["Цвета взяты из токенов дизайн-системы.","Шрифты и размеры взяты из шкалы типографики.","Отступы взяты из шкалы отступов.","Расстояние между группами больше, чем внутри группы."],"criteriaDesign":["Цвета привязаны к переменным библиотеки.","Текст использует стили библиотеки.","Отступы взяты из шкалы.","Расстояние между группами больше, чем внутри группы."],"quick":false,"ive":[{"n":9,"title":"Детали помогают понять, как обращаться с продуктом"}],"hig":[{"key":"Layout","title":"Layout — компоновка","url":"https://developer.apple.com/design/human-interface-guidelines/layout"}],"w3c":[],"aiDesign":"### R3.2 — обязательно\nВопрос: Используются переменные и стили библиотеки, без «ручных» цветов и отступов?\nКритерии:\n1. Цвета привязаны к переменным библиотеки.\n2. Текст использует стили библиотеки.\n3. Отступы взяты из шкалы.\n4. Расстояние между группами больше, чем внутри группы.\nТревожный признак: Пятнадцать оттенков серого; между группами столько же места, сколько внутри группы.","aiBuild":"### R3.2 — обязательно\nВопрос: Цвета, шрифты и отступы взяты из токенов, а группы читаются по интервалам?\nКритерии:\n1. Цвета взяты из токенов дизайн-системы.\n2. Шрифты и размеры взяты из шкалы типографики.\n3. Отступы взяты из шкалы отступов.\n4. Расстояние между группами больше, чем внутри группы.\nТревожный признак: Пятнадцать оттенков серого; между группами столько же места, сколько внутри группы."},{"id":"R7.1","principle":7,"text":"Экраны собираются из компонентов дизайн-системы; новый вариант компонента создаётся только с записью решения","level":"О","stage":"М+Р","check":"Ревью макета и кода","group":"system","q":"Экраны собраны из компонентов дизайн-системы, без одноразовых вариантов?","qDesign":"Экраны собраны из компонентов библиотеки, а новые варианты оформлены записью решения?","how":"Найдите элементы, похожие на компоненты системы, но отличающиеся от них. Есть ли на каждый запись решения?","howDesign":"Поищите отсоединённые копии компонентов и «почти такие же» кнопки и карточки.","red":"Третья версия кнопки, нарисованная прямо на экране.","criteria":["Элементы интерфейса — компоненты дизайн-системы.","Нет «почти таких же» вариантов компонентов.","На каждый новый вариант компонента есть запись решения."],"criteriaDesign":["Экраны собраны из компонентов библиотеки.","Нет отсоединённых копий компонентов.","Новые варианты добавлены в библиотеку с записью решения."],"quick":false,"ive":[{"n":8,"title":"Целостность охватывает весь путь человека"}],"hig":[{"key":"Craft","title":"Принцип Craft — качество исполнения","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R7.1 — обязательно\nВопрос: Экраны собраны из компонентов библиотеки, а новые варианты оформлены записью решения?\nКритерии:\n1. Экраны собраны из компонентов библиотеки.\n2. Нет отсоединённых копий компонентов.\n3. Новые варианты добавлены в библиотеку с записью решения.\nТревожный признак: Третья версия кнопки, нарисованная прямо на экране.","aiBuild":"### R7.1 — обязательно\nВопрос: Экраны собраны из компонентов дизайн-системы, без одноразовых вариантов?\nКритерии:\n1. Элементы интерфейса — компоненты дизайн-системы.\n2. Нет «почти таких же» вариантов компонентов.\n3. На каждый новый вариант компонента есть запись решения.\nТревожный признак: Третья версия кнопки, нарисованная прямо на экране."},{"id":"R8.3","principle":8,"text":"Все основные действия доступны с клавиатуры, фокус видим, порядок логичен; модальный диалог переносит фокус внутрь, закрывается по Esc и возвращает фокус (W3C APG)","level":"О","stage":"М+Р","check":"Ручная проверка, автотест","group":"access","q":"Весь сценарий проходится с клавиатуры, фокус виден, диалоги ловят и возвращают фокус?","qDesign":"Аннотирован порядок фокуса для нестандартных элементов и диалогов, описаны Esc и возврат фокуса?","how":"Уберите мышь. Пройдите сценарий клавишами Tab, Shift+Tab, Enter, Esc и стрелками. Всегда ли видно, где фокус? Куда он возвращается после закрытия диалога?","howDesign":"Найдите аннотации фокуса у диалогов, меню и нестандартных элементов. Есть ли состояние фокуса в компонентах библиотеки?","red":"Фокус пропадает после закрытия окна; свой выпадающий список не открывается с клавиатуры.","criteria":["Весь сценарий проходится только с клавиатуры.","Фокус всегда виден.","Порядок перехода фокуса логичен.","Диалог при открытии переносит фокус внутрь, закрывается по Esc и возвращает фокус на вызвавший элемент."],"criteriaDesign":["У компонентов есть видимое состояние фокуса.","Для нестандартных элементов аннотирован порядок фокуса.","Для диалогов описаны перенос фокуса внутрь, закрытие по Esc и возврат фокуса."],"quick":false,"ive":[{"n":7,"title":"Способ реализации входит в дизайн"}],"hig":[{"key":"Accessibility","title":"Accessibility — доступность","url":"https://developer.apple.com/design/human-interface-guidelines/accessibility"},{"key":"Modality","title":"Modality — модальность","url":"https://developer.apple.com/design/human-interface-guidelines/modality"}],"w3c":[{"key":"APG","title":"ARIA APG — модальный диалог","url":"https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/"}],"aiDesign":"### R8.3 — обязательно\nВопрос: Аннотирован порядок фокуса для нестандартных элементов и диалогов, описаны Esc и возврат фокуса?\nКритерии:\n1. У компонентов есть видимое состояние фокуса.\n2. Для нестандартных элементов аннотирован порядок фокуса.\n3. Для диалогов описаны перенос фокуса внутрь, закрытие по Esc и возврат фокуса.\nТревожный признак: Фокус пропадает после закрытия окна; свой выпадающий список не открывается с клавиатуры.","aiBuild":"### R8.3 — обязательно\nВопрос: Весь сценарий проходится с клавиатуры, фокус виден, диалоги ловят и возвращают фокус?\nКритерии:\n1. Весь сценарий проходится только с клавиатуры.\n2. Фокус всегда виден.\n3. Порядок перехода фокуса логичен.\n4. Диалог при открытии переносит фокус внутрь, закрывается по Esc и возвращает фокус на вызвавший элемент.\nТревожный признак: Фокус пропадает после закрытия окна; свой выпадающий список не открывается с клавиатуры."},{"id":"R8.4","principle":8,"text":"У элементов управления есть доступные имена; состояние не передаётся только цветом","level":"О","stage":"М+Р","check":"Автопроверка (axe), экранный диктор","group":"access","q":"Элементы понятно озвучиваются, и смысл не передаётся только цветом?","qDesign":"У иконок без подписи указаны доступные имена, а состояния различимы без цвета?","how":"Прогоните axe или Lighthouse. Включите экранный диктор на ключевых элементах. Посмотрите экран в оттенках серого.","howDesign":"Переведите макет в оттенки серого: различимы ли ошибка, успех и выбор? Проверьте аннотации имён у кнопок-иконок.","red":"Ошибка обозначена только красной рамкой; кнопка-иконка озвучивается просто как «кнопка».","criteria":["Автопроверка доступности (axe или Lighthouse) не находит критических ошибок.","У кнопок-иконок понятные доступные имена.","Ошибка, успех и выбор различимы без цвета."],"criteriaDesign":["У кнопок-иконок в аннотации указаны доступные имена.","В оттенках серого различимы ошибка, успех и выбор.","Состояния обозначены текстом или значком, а не только цветом."],"quick":false,"ive":[],"hig":[{"key":"Accessibility","title":"Accessibility — доступность","url":"https://developer.apple.com/design/human-interface-guidelines/accessibility"},{"key":"Color","title":"Color — цвет","url":"https://developer.apple.com/design/human-interface-guidelines/color"}],"w3c":[{"key":"WCAG","title":"WCAG 2.2","url":"https://www.w3.org/WAI/WCAG22/quickref/"}],"aiDesign":"### R8.4 — обязательно\nВопрос: У иконок без подписи указаны доступные имена, а состояния различимы без цвета?\nКритерии:\n1. У кнопок-иконок в аннотации указаны доступные имена.\n2. В оттенках серого различимы ошибка, успех и выбор.\n3. Состояния обозначены текстом или значком, а не только цветом.\nТревожный признак: Ошибка обозначена только красной рамкой; кнопка-иконка озвучивается просто как «кнопка».","aiBuild":"### R8.4 — обязательно\nВопрос: Элементы понятно озвучиваются, и смысл не передаётся только цветом?\nКритерии:\n1. Автопроверка доступности (axe или Lighthouse) не находит критических ошибок.\n2. У кнопок-иконок понятные доступные имена.\n3. Ошибка, успех и выбор различимы без цвета.\nТревожный признак: Ошибка обозначена только красной рамкой; кнопка-иконка озвучивается просто как «кнопка»."},{"id":"R8.8","principle":8,"text":"У элементов управления спроектированы и реализованы состояния: обычное, наведение, фокус, нажатие, недоступность, выполнение; область нажатия соответствует платформе и критерию WCAG 2.2 «Размер цели»","level":"О","stage":"М+Р","check":"Библиотека компонентов, проверка в реализации","group":"access","q":"У каждого элемента управления есть все состояния, и в него легко попасть?","qDesign":"У кнопок и полей нарисованы все состояния, и указана область нажатия?","how":"Пройдитесь по элементам управления сценария: наведите курсор, переведите фокус клавишей Tab, нажмите. Посмотрите, как выглядит недоступный элемент и действие в процессе. На телефоне попробуйте попасть пальцем в мелкие элементы.","howDesign":"Откройте компоненты кнопок, полей, переключателей в библиотеке и проверьте набор состояний. Найдите, где указана область нажатия у мелких элементов.","red":"Кнопка никак не меняется при нажатии; иконка 16 пикселей без области вокруг.","criteria":["У элементов управления есть состояния: обычное, наведение, фокус, нажатие, недоступность.","У действий, которые выполняются не мгновенно, есть состояние выполнения.","Область нажатия не меньше требований платформы и критерия WCAG 2.2 «Размер цели»."],"criteriaDesign":["У кнопок и полей в библиотеке нарисованы состояния: обычное, наведение, фокус, нажатие, недоступность.","Для долгих действий нарисовано состояние выполнения.","Для мелких элементов указана область нажатия, и она соответствует платформе."],"quick":false,"ive":[{"n":9,"title":"Детали помогают понять, как обращаться с продуктом"}],"hig":[{"key":"Buttons","title":"Buttons — кнопки","url":"https://developer.apple.com/design/human-interface-guidelines/buttons"},{"key":"Accessibility","title":"Accessibility — доступность","url":"https://developer.apple.com/design/human-interface-guidelines/accessibility"}],"w3c":[{"key":"WCAG","title":"WCAG 2.2","url":"https://www.w3.org/WAI/WCAG22/quickref/"}],"aiDesign":"### R8.8 — обязательно\nВопрос: У кнопок и полей нарисованы все состояния, и указана область нажатия?\nКритерии:\n1. У кнопок и полей в библиотеке нарисованы состояния: обычное, наведение, фокус, нажатие, недоступность.\n2. Для долгих действий нарисовано состояние выполнения.\n3. Для мелких элементов указана область нажатия, и она соответствует платформе.\nТревожный признак: Кнопка никак не меняется при нажатии; иконка 16 пикселей без области вокруг.","aiBuild":"### R8.8 — обязательно\nВопрос: У каждого элемента управления есть все состояния, и в него легко попасть?\nКритерии:\n1. У элементов управления есть состояния: обычное, наведение, фокус, нажатие, недоступность.\n2. У действий, которые выполняются не мгновенно, есть состояние выполнения.\n3. Область нажатия не меньше требований платформы и критерия WCAG 2.2 «Размер цели».\nТревожный признак: Кнопка никак не меняется при нажатии; иконка 16 пикселей без области вокруг."},{"id":"R8.5","principle":8,"text":"У перетаскивания есть альтернативный способ выполнить ту же операцию","level":"О","stage":"М+Р","check":"Проверка в реализации","group":"access","q":"Всё, что перетаскивается, можно сделать и без перетаскивания?","qDesign":"У перетаскивания описана альтернатива?","how":"Для каждой операции перетаскивания найдите другой способ: команда в меню, кнопки «выше» и «ниже», клавиатура. Перетаскивания нет — «Н/п».","howDesign":"Найдите в макете альтернативный способ для каждого перетаскивания.","red":"Порядок задач меняется только мышью.","criteria":["У каждого перетаскивания есть другой способ сделать то же самое.","Этот способ работает с клавиатуры.","Если перемещение не сохранилось, элемент не выглядит сохранённым на новом месте."],"criteriaDesign":["Для каждого перетаскивания показан альтернативный способ.","Описано, что видит человек, если перемещение не сохранилось."],"quick":false,"ive":[],"hig":[{"key":"Drag and drop","title":"Drag and drop — перетаскивание","url":"https://developer.apple.com/design/human-interface-guidelines/drag-and-drop"}],"w3c":[],"aiDesign":"### R8.5 — обязательно\nВопрос: У перетаскивания описана альтернатива?\nКритерии:\n1. Для каждого перетаскивания показан альтернативный способ.\n2. Описано, что видит человек, если перемещение не сохранилось.\nТревожный признак: Порядок задач меняется только мышью.","aiBuild":"### R8.5 — обязательно\nВопрос: Всё, что перетаскивается, можно сделать и без перетаскивания?\nКритерии:\n1. У каждого перетаскивания есть другой способ сделать то же самое.\n2. Этот способ работает с клавиатуры.\n3. Если перемещение не сохранилось, элемент не выглядит сохранённым на новом месте.\nТревожный признак: Порядок задач меняется только мышью."},{"id":"R5.3","principle":5,"text":"Анимация помогает проследить изменение и не задерживает частые действия; учитывается настройка уменьшения движения; смысл не передаётся только движением","level":"О","stage":"М+Р","check":"Проверка с prefers-reduced-motion","group":"access","q":"Анимации помогают понять изменение и не мешают при уменьшении движения?","qDesign":"Для каждой анимации указаны назначение и поведение при уменьшении движения?","how":"Пройдите сценарий с включённой системной настройкой «Уменьшить движение». Ничего важного не потерялось? Не тормозят ли анимации частые действия?","howDesign":"Найдите аннотации анимаций: зачем нужна каждая и что происходит при уменьшении движения.","red":"Каждый переход длится секунду; смысл передан только движением.","criteria":["Каждая анимация помогает проследить изменение.","Частые действия не замедляются анимацией.","С включённым уменьшением движения ничего важного не теряется.","Смысл не передаётся только движением."],"criteriaDesign":["Для каждой анимации указано назначение.","Указано поведение при уменьшении движения.","Смысл не передаётся только движением."],"quick":false,"ive":[{"n":9,"title":"Детали помогают понять, как обращаться с продуктом"},{"n":10,"title":"Выразительность должна соответствовать задаче"}],"hig":[{"key":"Motion","title":"Motion — движение","url":"https://developer.apple.com/design/human-interface-guidelines/motion"}],"w3c":[],"aiDesign":"### R5.3 — обязательно\nВопрос: Для каждой анимации указаны назначение и поведение при уменьшении движения?\nКритерии:\n1. Для каждой анимации указано назначение.\n2. Указано поведение при уменьшении движения.\n3. Смысл не передаётся только движением.\nТревожный признак: Каждый переход длится секунду; смысл передан только движением.","aiBuild":"### R5.3 — обязательно\nВопрос: Анимации помогают понять изменение и не мешают при уменьшении движения?\nКритерии:\n1. Каждая анимация помогает проследить изменение.\n2. Частые действия не замедляются анимацией.\n3. С включённым уменьшением движения ничего важного не теряется.\n4. Смысл не передаётся только движением.\nТревожный признак: Каждый переход длится секунду; смысл передан только движением."},{"id":"R1.2","principle":1,"text":"Результат автоматизации виден до применения или легко исправляется; при отказе технологии человек может закончить задачу другим путём","level":"О","stage":"М+Р","check":"Сценарий с ошибкой автоматизации","group":"result","q":"Результат автоматизации можно увидеть до применения или исправить, а при сбое задача всё равно решается?","qDesign":"Для автоматизации показаны предпросмотр или исправление результата и путь при отказе?","how":"Запустите автоматическое действие. Видно ли, что изменится? Можно ли поправить результат? Что будет, если автоматизация ошиблась или недоступна? Автоматизации нет — «Н/п».","howDesign":"Найдите фреймы предпросмотра, правки и отказа автоматизации.","red":"ИИ переписал весь документ без предпросмотра и отмены.","criteria":["До применения видно, что изменит автоматизация.","Результат автоматизации можно поправить или отменить.","При ошибке или недоступности автоматизации задачу можно закончить вручную."],"criteriaDesign":["Нарисован предпросмотр результата автоматизации.","Нарисованы правка и отмена результата.","Нарисован путь на случай, если автоматизация ошиблась или недоступна."],"quick":false,"ive":[{"n":12,"title":"Ответственность продолжается после выпуска"}],"hig":[{"key":"Agency","title":"Принцип Agency — самостоятельность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},{"key":"Responsibility","title":"Принцип Responsibility — ответственность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R1.2 — обязательно\nВопрос: Для автоматизации показаны предпросмотр или исправление результата и путь при отказе?\nКритерии:\n1. Нарисован предпросмотр результата автоматизации.\n2. Нарисованы правка и отмена результата.\n3. Нарисован путь на случай, если автоматизация ошиблась или недоступна.\nТревожный признак: ИИ переписал весь документ без предпросмотра и отмены.","aiBuild":"### R1.2 — обязательно\nВопрос: Результат автоматизации можно увидеть до применения или исправить, а при сбое задача всё равно решается?\nКритерии:\n1. До применения видно, что изменит автоматизация.\n2. Результат автоматизации можно поправить или отменить.\n3. При ошибке или недоступности автоматизации задачу можно закончить вручную.\nТревожный признак: ИИ переписал весь документ без предпросмотра и отмены."},{"id":"R2.5","principle":2,"text":"Результат применим за пределами экрана: экспорт открывается в следующем инструменте, ссылка работает, подтверждение содержит нужные сведения","level":"О","stage":"М+Р","check":"Проверка результата вне продукта","group":"result","q":"Результат работает за пределами продукта?","qDesign":"Показано, как выглядит результат вне продукта: письмо, файл, ссылка, подтверждение?","how":"Используйте результат там, куда он нужен: откройте файл в следующем инструменте, перейдите по ссылке с другого устройства, прочитайте письмо.","howDesign":"Найдите фреймы письма, файла, уведомления или страницы по ссылке. Есть ли в них всё, что нужно человеку дальше?","red":"Выгрузка в CSV ломает кириллицу; в письме-подтверждении нет времени встречи.","criteria":["Результат открывается и работает там, где нужен дальше.","В результате есть всё, что нужно человеку дальше.","Ссылки из результата работают с другого устройства."],"criteriaDesign":["Нарисован результат вне продукта: письмо, файл, уведомление или страница по ссылке.","В нём есть всё, что нужно человеку дальше."],"quick":false,"ive":[{"n":8,"title":"Целостность охватывает весь путь человека"}],"hig":[{"key":"Purpose","title":"Принцип Purpose — назначение","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R2.5 — обязательно\nВопрос: Показано, как выглядит результат вне продукта: письмо, файл, ссылка, подтверждение?\nКритерии:\n1. Нарисован результат вне продукта: письмо, файл, уведомление или страница по ссылке.\n2. В нём есть всё, что нужно человеку дальше.\nТревожный признак: Выгрузка в CSV ломает кириллицу; в письме-подтверждении нет времени встречи.","aiBuild":"### R2.5 — обязательно\nВопрос: Результат работает за пределами продукта?\nКритерии:\n1. Результат открывается и работает там, где нужен дальше.\n2. В результате есть всё, что нужно человеку дальше.\n3. Ссылки из результата работают с другого устройства.\nТревожный признак: Выгрузка в CSV ломает кириллицу; в письме-подтверждении нет времени встречи."},{"id":"R7.3","principle":7,"text":"Человек может получить доступ к своему накопленному результату и выгрузить его","level":"О","stage":"М+Р","check":"Проверка выгрузки","group":"result","q":"Человек может получить и выгрузить свои данные?","qDesign":"Спроектированы доступ к своим данным и выгрузка?","how":"Найдите путь к выгрузке своих данных. Проверьте, что файл полный и читается. Сценарий не касается данных человека — «Н/п».","howDesign":"Найдите фреймы выгрузки или пометку, что сценарий не создаёт данных человека.","red":"Данные можно загрузить, но нельзя забрать.","criteria":["Есть понятный путь к выгрузке своих данных.","Выгруженный файл полный и читается."],"criteriaDesign":["Нарисован путь к выгрузке своих данных или записано, что сценарий их не создаёт."],"quick":false,"ive":[],"hig":[{"key":"Responsibility","title":"Принцип Responsibility — ответственность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},{"key":"Agency","title":"Принцип Agency — самостоятельность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R7.3 — обязательно\nВопрос: Спроектированы доступ к своим данным и выгрузка?\nКритерии:\n1. Нарисован путь к выгрузке своих данных или записано, что сценарий их не создаёт.\nТревожный признак: Данные можно загрузить, но нельзя забрать.","aiBuild":"### R7.3 — обязательно\nВопрос: Человек может получить и выгрузить свои данные?\nКритерии:\n1. Есть понятный путь к выгрузке своих данных.\n2. Выгруженный файл полный и читается.\nТревожный признак: Данные можно загрузить, но нельзя забрать."},{"id":"R9.4","principle":9,"text":"Для хранимых данных определены срок хранения и удаление; утверждения об экологичности делаются только на основе измерений","level":"Р","stage":"М+Р","check":"Ревью политики данных","group":"result","q":"Понятно, сколько хранятся данные и как они удаляются?","qDesign":"Указаны срок хранения и удаление для данных, которые создаёт сценарий?","how":"Найдите, где человек узнаёт срок хранения и как удалить свои данные. Проверьте, что удаление действительно работает.","howDesign":"Проверьте аннотацию: какие данные создаются, сколько хранятся, как удаляются.","red":"Удалённый аккаунт продолжает получать письма.","criteria":["Человек может узнать, сколько хранятся его данные.","Удаление данных доступно и действительно работает."],"criteriaDesign":["Указано, какие данные создаёт сценарий и сколько они хранятся.","Описано, как их удалить."],"quick":false,"ive":[],"hig":[{"key":"Responsibility","title":"Принцип Responsibility — ответственность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R9.4 — рекомендуется\nВопрос: Указаны срок хранения и удаление для данных, которые создаёт сценарий?\nКритерии:\n1. Указано, какие данные создаёт сценарий и сколько они хранятся.\n2. Описано, как их удалить.\nТревожный признак: Удалённый аккаунт продолжает получать письма.","aiBuild":"### R9.4 — рекомендуется\nВопрос: Понятно, сколько хранятся данные и как они удаляются?\nКритерии:\n1. Человек может узнать, сколько хранятся его данные.\n2. Удаление данных доступно и действительно работает.\nТревожный признак: Удалённый аккаунт продолжает получать письма."},{"id":"R10.4","principle":10,"text":"Налог на ценность ключевых сценариев измерен до и после изменения: успешность, время до результата, ошибки, возвраты, обращения за помощью","level":"Р","stage":"М+Р","check":"Протокол аудита или исследования","group":"result","q":"Налог на ценность записан, и есть с чем сравнить после изменений?","qDesign":"Определено, как измерить налог на ценность: на прототипе с людьми и после выпуска?","how":"Для ключевого сценария запишите успешность, время до результата, ошибки, возвраты и обращения за помощью. Сравните с прошлым замером.","howDesign":"Проверьте, что в описании решения названы показатели и способ их получить: тест прототипа или данные после выпуска.","red":"Успех измеряют числом нажатий на новую кнопку.","criteria":["Для ключевого сценария записаны успешность, время до результата, ошибки и возвраты.","Есть прошлый замер, с которым можно сравнить."],"criteriaDesign":["В описании решения названы показатели налога на ценность.","Указано, как их получить: тест прототипа или данные после выпуска."],"quick":false,"ive":[{"n":12,"title":"Ответственность продолжается после выпуска"}],"hig":[{"key":"Craft","title":"Принцип Craft — качество исполнения","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R10.4 — рекомендуется\nВопрос: Определено, как измерить налог на ценность: на прототипе с людьми и после выпуска?\nКритерии:\n1. В описании решения названы показатели налога на ценность.\n2. Указано, как их получить: тест прототипа или данные после выпуска.\nТревожный признак: Успех измеряют числом нажатий на новую кнопку.","aiBuild":"### R10.4 — рекомендуется\nВопрос: Налог на ценность записан, и есть с чем сравнить после изменений?\nКритерии:\n1. Для ключевого сценария записаны успешность, время до результата, ошибки и возвраты.\n2. Есть прошлый замер, с которым можно сравнить.\nТревожный признак: Успех измеряют числом нажатий на новую кнопку."},{"id":"R8.7","principle":8,"text":"Реализация сверена с замыслом в работающем продукте; расхождения записаны с причинами","level":"О","stage":"Р","check":"Дизайн-приёмка сборки","group":"build","q":"Сборка совпадает с макетом по всем состояниям и аннотациям?","qDesign":"Сборка совпадает с макетом по всем состояниям и аннотациям?","how":"Откройте макет и сборку рядом. Пройдите все состояния и аннотации. Каждое расхождение исправьте или запишите с причиной и отразите в макете.","howDesign":"Откройте макет и сборку рядом. Пройдите все состояния и аннотации. Каждое расхождение исправьте или запишите с причиной и отразите в макете.","red":"Экран ошибки «немного упростили» при разработке.","criteria":["Сборка и макет сверены по всем состояниям.","Сверены аннотации: фокус, анимации, стадии результата.","Каждое расхождение исправлено или записано с причиной и отражено в макете."],"criteriaDesign":["Сборка и макет сверены по всем состояниям.","Сверены аннотации: фокус, анимации, стадии результата.","Каждое расхождение исправлено или записано с причиной и отражено в макете."],"quick":false,"ive":[{"n":7,"title":"Способ реализации входит в дизайн"}],"hig":[{"key":"Craft","title":"Принцип Craft — качество исполнения","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiBuild":"### R8.7 — обязательно\nВопрос: Сборка совпадает с макетом по всем состояниям и аннотациям?\nКритерии:\n1. Сборка и макет сверены по всем состояниям.\n2. Сверены аннотации: фокус, анимации, стадии результата.\n3. Каждое расхождение исправлено или записано с причиной и отражено в макете.\nТревожный признак: Экран ошибки «немного упростили» при разработке."},{"id":"R9.1","principle":9,"text":"Медиа загружается в размере фактического отображения; тяжёлые материалы — при необходимости","level":"О","stage":"Р","check":"Инструменты разработчика браузера","group":"build","q":"Картинки и видео не тяжелее, чем нужно для показа?","qDesign":"Картинки и видео не тяжелее, чем нужно для показа?","how":"Откройте инструменты разработчика, вкладку сети. Сравните размер изображений с размером, в котором они показаны.","howDesign":"Откройте инструменты разработчика, вкладку сети. Сравните размер изображений с размером, в котором они показаны.","red":"Превью 100×100 загружается из оригинала на 5 МБ.","criteria":["Изображения загружаются в размере, близком к размеру показа.","Тяжёлые материалы загружаются при необходимости, а не все сразу."],"criteriaDesign":["Изображения загружаются в размере, близком к размеру показа.","Тяжёлые материалы загружаются при необходимости, а не все сразу."],"quick":false,"ive":[{"n":7,"title":"Способ реализации входит в дизайн"}],"hig":[],"w3c":[],"aiBuild":"### R9.1 — обязательно\nВопрос: Картинки и видео не тяжелее, чем нужно для показа?\nКритерии:\n1. Изображения загружаются в размере, близком к размеру показа.\n2. Тяжёлые материалы загружаются при необходимости, а не все сразу.\nТревожный признак: Превью 100×100 загружается из оригинала на 5 МБ."},{"id":"R9.2","principle":9,"text":"Нет постоянных фоновых опросов, одновременного автопроигрывания и повторной обработки без пользы","level":"Р","stage":"Р","check":"Ревью сетевой активности","group":"build","q":"Нет лишних фоновых запросов и автопроигрывания?","qDesign":"Нет лишних фоновых запросов и автопроигрывания?","how":"Оставьте страницу открытой на пару минут и посмотрите вкладку сети. Есть ли постоянные запросы без видимой пользы? Играют ли видео сами?","howDesign":"Оставьте страницу открытой на пару минут и посмотрите вкладку сети. Есть ли постоянные запросы без видимой пользы? Играют ли видео сами?","red":"Опрос сервера каждую секунду на неактивной вкладке.","criteria":["На неактивной странице нет постоянных запросов без пользы.","Видео и анимации не проигрываются сами без причины."],"criteriaDesign":["На неактивной странице нет постоянных запросов без пользы.","Видео и анимации не проигрываются сами без причины."],"quick":false,"ive":[{"n":12,"title":"Ответственность продолжается после выпуска"}],"hig":[],"w3c":[],"aiBuild":"### R9.2 — рекомендуется\nВопрос: Нет лишних фоновых запросов и автопроигрывания?\nКритерии:\n1. На неактивной странице нет постоянных запросов без пользы.\n2. Видео и анимации не проигрываются сами без причины.\nТревожный признак: Опрос сервера каждую секунду на неактивной вкладке."},{"id":"R9.3","principle":9,"text":"Ключевые сценарии проверены на обычном устройстве и медленном соединении","level":"О","stage":"Р","check":"Проверка с ограничением сети и процессора","group":"build","q":"Сценарий нормально работает на обычном устройстве и медленной сети?","qDesign":"Сценарий нормально работает на обычном устройстве и медленной сети?","how":"Включите в инструментах разработчика замедление сети и процессора или возьмите недорогой телефон. Пройдите сценарий.","howDesign":"Включите в инструментах разработчика замедление сети и процессора или возьмите недорогой телефон. Пройдите сценарий.","red":"На медленной сети белый экран 10 секунд без признаков загрузки.","criteria":["Сценарий проходится с замедленной сетью.","Сценарий проходится на обычном устройстве или с замедленным процессором.","При медленной загрузке видно, что происходит."],"criteriaDesign":["Сценарий проходится с замедленной сетью.","Сценарий проходится на обычном устройстве или с замедленным процессором.","При медленной загрузке видно, что происходит."],"quick":false,"ive":[{"n":7,"title":"Способ реализации входит в дизайн"}],"hig":[{"key":"Flexibility","title":"Принцип Flexibility — гибкость","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiBuild":"### R9.3 — обязательно\nВопрос: Сценарий нормально работает на обычном устройстве и медленной сети?\nКритерии:\n1. Сценарий проходится с замедленной сетью.\n2. Сценарий проходится на обычном устройстве или с замедленным процессором.\n3. При медленной загрузке видно, что происходит.\nТревожный признак: На медленной сети белый экран 10 секунд без признаков загрузки."}],"sources":{"ive":{"1":"Забота о человеке выражается в устройстве продукта","2":"Простота требует разобраться со сложностью","3":"У нового решения должна быть объяснимая польза","4":"Описание словами помогает спроектировать поведение","5":"Любопытство помогает пересматривать предположения","6":"Прототип должен позволять испытать существенные свойства","7":"Способ реализации входит в дизайн","8":"Целостность охватывает весь путь человека","9":"Детали помогают понять, как обращаться с продуктом","10":"Выразительность должна соответствовать задаче","11":"Совместная работа требует условий для развития идей","12":"Ответственность продолжается после выпуска"},"hig":{"Purpose":{"title":"Принцип Purpose — назначение","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},"Agency":{"title":"Принцип Agency — самостоятельность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},"Responsibility":{"title":"Принцип Responsibility — ответственность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},"Familiarity":{"title":"Принцип Familiarity — знакомость","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},"Flexibility":{"title":"Принцип Flexibility — гибкость","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},"Simplicity":{"title":"Принцип Simplicity — простота","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},"Craft":{"title":"Принцип Craft — качество исполнения","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},"Delight":{"title":"Принцип Delight — удовольствие от использования","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},"Layout":{"title":"Layout — компоновка","url":"https://developer.apple.com/design/human-interface-guidelines/layout"},"Sidebars":{"title":"Sidebars — боковые панели","url":"https://developer.apple.com/design/human-interface-guidelines/sidebars"},"Toolbars":{"title":"Toolbars — панели инструментов","url":"https://developer.apple.com/design/human-interface-guidelines/toolbars"},"Searching":{"title":"Searching — поиск","url":"https://developer.apple.com/design/human-interface-guidelines/searching"},"Modality":{"title":"Modality — модальность","url":"https://developer.apple.com/design/human-interface-guidelines/modality"},"Buttons":{"title":"Buttons — кнопки","url":"https://developer.apple.com/design/human-interface-guidelines/buttons"},"Text fields":{"title":"Text fields — текстовые поля","url":"https://developer.apple.com/design/human-interface-guidelines/text-fields"},"Progress indicators":{"title":"Progress indicators — индикаторы прогресса","url":"https://developer.apple.com/design/human-interface-guidelines/progress-indicators"},"Alerts":{"title":"Alerts — предупреждения","url":"https://developer.apple.com/design/human-interface-guidelines/alerts"},"Typography":{"title":"Typography — типографика","url":"https://developer.apple.com/design/human-interface-guidelines/typography"},"Color":{"title":"Color — цвет","url":"https://developer.apple.com/design/human-interface-guidelines/color"},"Motion":{"title":"Motion — движение","url":"https://developer.apple.com/design/human-interface-guidelines/motion"},"Writing":{"title":"Writing — тексты","url":"https://developer.apple.com/design/human-interface-guidelines/writing"},"Accessibility":{"title":"Accessibility — доступность","url":"https://developer.apple.com/design/human-interface-guidelines/accessibility"},"Drag and drop":{"title":"Drag and drop — перетаскивание","url":"https://developer.apple.com/design/human-interface-guidelines/drag-and-drop"}},"w3c":{"WCAG":{"title":"WCAG 2.2","url":"https://www.w3.org/WAI/WCAG22/quickref/"},"APG":{"title":"ARIA APG — модальный диалог","url":"https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/"}}},"protocol":{"intro":"Ты проводишь ИИ-проверку по стандарту дизайна продуктов команды (версия {version}). Это одна из двух обязательных проверок: вторую проводит человек по тем же критериям. Вердикт выносит человек, поэтому твоя задача — честно отметить каждый критерий и обосновать каждую находку.\n\nСтандарт опирается на десять принципов хорошего дизайна Дитера Рамса, подход Джони Айва к работе над продуктом и Apple Human Interface Guidelines. Критерии ниже — их применение командой к цифровым продуктам.\n\nПроверка: {mode}.\n{materials}","materials_design":"Перед тобой макет или прототип: изображения экранов и описание от команды. Критерии описывают, что должно быть видно или описано в макете. Поведение, которого нельзя увидеть на изображениях или прочитать в описании, не додумывай.","materials_build":"Перед тобой работающий продукт: скриншоты сборки и описание от команды. Критерии описывают, как продукт должен работать. То, что нельзя увидеть на скриншотах или прочитать в описании (клавиатура, скорость, поведение при отключённой сети), отмечай как непроверяемое.","rules":"Правила:\n1. Отметь каждый критерий каждого пункта: true — по материалам видно, что выполнено; false — видно, что не выполнено; null — по материалам нельзя проверить. Не ставь true по умолчанию. Сомневаешься — ставь null и объясни почему.\n2. Если пункт не относится к этому решению (например, в сценарии нет поиска), верни \"na\": true и причину в evidence.\n3. Если хотя бы один критерий false, укажи серьёзность пункта по последствиям для человека, если оставить как есть:\n   P0 — не закончит основную задачу, потеряет данные, будет введён в заблуждение о результате или стоимости, основное действие недоступно;\n   P1 — трудно восстановиться после ошибки, непонятно состояние, названия или поведение противоречат друг другу;\n   P2 — задача выполнима, но требует лишних действий, поиска, запоминания;\n   P3 — мелкие визуальные неточности.\n4. evidence — что именно видно и где: экран, элемент, текст. Одно-два предложения. Обязательно, если есть false или null или пункт не применим. Если все критерии true, оставь пустую строку.\n5. Опирайся только на материалы. Не выдумывай экраны, тексты и поведение.\n6. Не предлагай упрощение, которое заставит человека помнить, где что спрятано, и не обосновывай находки словами «так минималистичнее».\n7. Признаки ИИ-дизайна — находки, а не достоинства. Подпись-инструкция под заголовком, текст пустого состояния, который повторяет видимое, состояние словами там, где хватает формы, элемент для сброса того, что сбрасывается само, шаблонные градиенты, карточки, метки заглавными, метаданные через точку, выдуманные данные — ставь false по соответствующему критерию (R4.8, R10.1, R7.6). В evidence называй признак: что именно и где. Лишнее пояснение не делает интерфейс понятнее: понятность достигается формой.\n8. Признак не считается нарушением, если в описании от команды сказано, что он задан дизайн-системой или выбран сознательно с причиной.","format":"Ответь только JSON, без пояснений до и после:\n{\"summary\": \"два-три предложения: главное, что нашёл\", \"items\": [{\"id\": \"R2.1\", \"criteria\": [true, null, false], \"na\": false, \"severity\": \"P1\", \"evidence\": \"...\"}]}\nВерни объект для каждого пункта из списка. В \"criteria\" столько значений, сколько критериев у пункта, в том же порядке. \"severity\" — \"P0\", \"P1\", \"P2\", \"P3\" или null, если нет ни одного false."}}</script>
<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------ Данные
  const DATA = JSON.parse(document.getElementById("checklist-data").textContent);
  const ITEMS = DATA.items;
  const BY_ID = Object.fromEntries(ITEMS.map((i) => [i.id, i]));
  const GROUPS = DATA.groups;
  const PRINCIPLES = Object.fromEntries(DATA.principles.map((p) => [p.n, p]));

  const MODES = {
    design: { title: "Дизайн-ревью", ctx: "design", main: true, ai: true,
      desc: "Макет или прототип перед передачей в разработку. Главная проверка.", filter: (i) => i.stage !== "Р" },
    quick: { title: "Быстрая проверка", ctx: "design", ai: false,
      desc: "Самые важные пункты, чтобы прогнать макет на ходу. Не заменяет дизайн-ревью.", filter: (i) => i.quick },
    release: { title: "Приёмка сборки", ctx: "build", ai: true,
      desc: "Работающая сборка против макета перед выпуском.", filter: (i) => i.stage !== "М" },
    audit: { title: "Аудит продукта", ctx: "build", ai: true,
      desc: "Существующий продукт: найти всё, что не дотягивает до стандарта, и составить план.", filter: () => true },
  };
  const MODE_ORDER = ["design", "quick", "release", "audit"];
  const STATUS_LABEL = { yes: "Да", partial: "Частично", no: "Нет", na: "Н/п", unknown: "Не проверить" };
  const STATUS_MD = { yes: "✅", partial: "⚠️", no: "❌", na: "н/п", unknown: "не проверено" };
  const SEV = [
    { k: "P0", label: "Блокер", desc: "не закончит задачу, потеряет данные или будет введён в заблуждение" },
    { k: "P1", label: "Серьёзно", desc: "трудно восстановиться после ошибки, непонятно, что происходит" },
    { k: "P2", label: "Нагрузка", desc: "лишние действия, поиск, запоминание" },
    { k: "P3", label: "Полировка", desc: "мелкие визуальные неточности" },
  ];
  const SEV_ORDER = { P0: 0, P1: 1, P2: 2, P3: 3 };
  const LEVEL = { "О": "Обязательно", "Р": "Рекомендуется" };
  const STAGE = { "М": "Макет", "М+Р": "Макет и сборка", "Р": "Сборка" };
  const FINDING = (s) => s === "partial" || s === "no";

  // ------------------------------------------------------------------ Утилиты
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const plural = (n, a, b, c) => {
    const m10 = n % 10, m100 = n % 100;
    return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c;
  };
  const fmtDate = (ts) => { try { return new Date(ts).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" }); } catch (e) { return ""; } };
  const fmtTime = (ts) => { try { return new Date(ts).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* хранилище недоступно */ } },
  };
  const DRAFT_KEY = "mnl-checklist-draft-v2";
  const PREF_KEY = "mnl-checklist-prefs-v1";

  let toastTimer = null;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
  }

  // ------------------------------------------------------------------ Состояние
  const prefs = Object.assign({ hints: true }, store.get(PREF_KEY) || {});
  const state = { view: "home", review: null, groupIdx: 0, setupMode: null, guideStage: "all", confirmDelete: false, exportOpen: false };
  const ai = { files: [], urls: [], running: false, done: 0, total: 0, ctl: null, error: "", pasteError: "" };

  const draft = store.get(DRAFT_KEY);
  if (draft && draft.review && MODES[draft.review.mode]) {
    state.review = draft.review;
    state.groupIdx = draft.groupIdx || 0;
    if (["check", "summary", "ai"].includes(draft.view)) state.view = draft.view;
  }
  if (location.hash === "#guide") state.view = "guide";

  let draftTimer = null;
  function flushDraft() {
    clearTimeout(draftTimer); draftTimer = null;
    if (state.review) store.set(DRAFT_KEY, { review: state.review, view: state.view, groupIdx: state.groupIdx });
  }
  function persistDraft() { clearTimeout(draftTimer); draftTimer = setTimeout(flushDraft, 250); }
  window.addEventListener("pagehide", flushDraft);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushDraft(); });

  // ------------------------------------------------------------------ Пункты и ответы
  function modeItems(mode) { return ITEMS.filter(MODES[mode].filter); }
  function modeGroups(mode) {
    const items = modeItems(mode);
    return GROUPS.map((g) => ({ ...g, items: items.filter((i) => i.group === g.key) })).filter((g) => g.items.length);
  }
  const isDesign = (mode) => MODES[mode].ctx === "design";
  const q = (item, mode) => (isDesign(mode) ? item.qDesign : item.q);
  const how = (item, mode) => (isDesign(mode) ? item.howDesign : item.how);
  const crit = (item, mode) => (isDesign(mode) ? item.criteriaDesign : item.criteria);

  function ans(id, review = state.review) { return (review && review.answers[id]) || {}; }

  // Итог пункта по критериям: все «да» — Да, все «нет» — Нет, вперемешку — Частично.
  function statusFrom(c, n) {
    if (!Array.isArray(c)) return undefined;
    const vals = Array.from({ length: n }, (_, k) => c[k]);
    if (vals.some((v) => v !== true && v !== false)) return undefined;
    const yes = vals.filter((v) => v === true).length;
    return yes === n ? "yes" : yes === 0 ? "no" : "partial";
  }
  function statusOf(id, review = state.review) {
    const a = ans(id, review);
    if (a.x) return a.x;
    const n = crit(BY_ID[id], review.mode).length;
    return statusFrom(a.c, n) || (Array.isArray(a.c) ? undefined : a.s);
  }
  function marked(id) {
    const a = ans(id); const n = crit(BY_ID[id], state.review.mode).length;
    return Array.isArray(a.c) ? a.c.slice(0, n).filter((v) => v === true || v === false).length : 0;
  }

  // Ответ ИИ по пункту.
  function aiOf(id, review = state.review) { return review && review.ai && review.ai.items ? review.ai.items[id] : null; }
  function aiStatus(id, review = state.review) {
    const r = aiOf(id, review);
    if (!r) return undefined;
    if (r.na) return "na";
    const c = r.c || [];
    if (c.some((v) => v === false)) return c.some((v) => v === true) ? "partial" : "no";
    if (c.length && c.every((v) => v === true)) return "yes";
    return "unknown";
  }
  // Сверка двух проверок по пункту.
  function reconcile(id, review = state.review) {
    const a = aiStatus(id, review);
    if (a === undefined) return "noai";
    const h = statusOf(id, review);
    if (!h) return "pending";
    if (FINDING(a) && FINDING(h)) return "agree";
    if (FINDING(a)) return ans(id, review).aiReject && ans(id, review).aiReject.trim() ? "rejected" : "conflict";
    if (FINDING(h)) return "human-only";
    if (a === "unknown") return "ai-unknown";
    return "agree";
  }

  // ------------------------------------------------------------------ Вердикт
  function analyze(review) {
    const items = modeItems(review.mode);
    const st = (i) => statusOf(i.id, review);
    const a = (i) => ans(i.id, review);
    const unanswered = items.filter((i) => !st(i));
    const findings = items.filter((i) => FINDING(st(i)));
    const noSev = findings.filter((i) => !a(i).sev);
    const sevCount = { P0: 0, P1: 0, P2: 0, P3: 0 };
    findings.forEach((i) => { if (a(i).sev) sevCount[a(i).sev]++; });
    const mandatoryOpen = findings.filter((i) => i.level === "О" && !a(i).exc);
    const unknown = items.filter((i) => st(i) === "unknown");
    const unknownMandatory = unknown.filter((i) => i.level === "О");
    const recommendedOpen = items.filter((i) => i.level === "Р" && !["yes", "na"].includes(st(i)));
    const rec = Object.fromEntries(items.map((i) => [i.id, reconcile(i.id, review)]));
    const by = (k) => items.filter((i) => rec[i.id] === k);
    const aiDone = !!(review.ai && review.ai.items);
    const aiFindings = items.filter((i) => FINDING(aiStatus(i.id, review)));
    return {
      items, unanswered, findings, noSev, sevCount, mandatoryOpen, unknown, unknownMandatory, recommendedOpen,
      answered: items.length - unanswered.length, aiDone, aiFindings,
      conflicts: by("conflict"), rejected: by("rejected"), agree: by("agree"), humanOnly: by("human-only"), aiUnknown: by("ai-unknown"),
    };
  }

  function verdict(review) {
    const x = analyze(review);
    const m = MODES[review.mode];
    const blockers = x.sevCount.P0 + x.sevCount.P1;
    const incomplete = [];
    if (x.unanswered.length) incomplete.push(`Без ответа: ${x.unanswered.length} ${plural(x.unanswered.length, "пункт", "пункта", "пунктов")}.`);
    if (x.noSev.length) incomplete.push(`У ${x.noSev.length} ${plural(x.noSev.length, "находки", "находок", "находок")} не указана серьёзность.`);
    const mand = x.mandatoryOpen.length ? `Обязательные пункты без исправления или исключения: ${x.mandatoryOpen.map((i) => i.id).join(", ")}.` : null;
    const unk = x.unknownMandatory.length ? `Человек не смог проверить обязательные пункты: ${x.unknownMandatory.map((i) => i.id).join(", ")}. Найдите способ проверить их.` : null;
    const conflicts = x.conflicts.length ? `Находки ИИ без решения человека: ${x.conflicts.map((i) => i.id).join(", ")}. Подтвердите их или отклоните с причиной.` : null;
    const noAi = m.ai && !x.aiDone ? "ИИ-проверка ещё не проведена. Без неё вердикт не выносится." : null;

    if (review.mode === "design" || review.mode === "quick") {
      const quick = review.mode === "quick";
      if (statusOf("R2.1", review) === "no") return { tone: "bad", title: "Вернуться к задаче", detail: ["Непонятны пользователь или момент ценности (R2.1). Сначала заполните описание решения, потом возвращайтесь к экранам."] };
      if (blockers) return { tone: "bad", title: quick ? "Есть блокеры" : "Доработать", detail: [`Блокеров: ${x.sevCount.P0}, серьёзных: ${x.sevCount.P1}. Исправьте их в макете и повторите ${quick ? "проверку" : "ревью"}.`, mand, conflicts].filter(Boolean) };
      if (incomplete.length) return { tone: "neutral", title: quick ? "Проверка не завершена" : "Ревью не завершено", detail: [...incomplete, conflicts].filter(Boolean) };
      if (conflicts) return { tone: "warn", title: "Сверить с ИИ-проверкой", detail: [conflicts] };
      if (x.mandatoryOpen.length) return { tone: "warn", title: "Доработать", detail: [mand, "Исправьте в макете или оформите исключение с датой пересмотра."] };
      if (unk) return { tone: "neutral", title: "Не хватает проверок", detail: [unk] };
      if (noAi) return { tone: "neutral", title: "Остаётся ИИ-проверка", detail: ["Проверка человеком пройдена.", noAi] };
      if (quick) return { tone: "ok", title: "Явных блокеров нет", detail: ["Можно идти на полное дизайн-ревью."] };
      const d = ["Обе проверки проведены. Нет открытых P0 и P1, обязательные пункты выполнены или оформлены исключением."];
      if (x.sevCount.P2 + x.sevCount.P3) d.push(`Находки P2 и P3 (${x.sevCount.P2 + x.sevCount.P3}) заведите задачами с номерами требований.`);
      return { tone: "ok", title: "Готово к передаче", detail: d };
    }

    if (review.mode === "release") {
      if (x.sevCount.P0) return { tone: "bad", title: "Нельзя выпускать", detail: [`Блокеров: ${x.sevCount.P0}. P0 исправляется до выпуска.`, conflicts].filter(Boolean) };
      if (incomplete.length) return { tone: "neutral", title: "Приёмка не завершена", detail: [...incomplete, conflicts].filter(Boolean) };
      if (conflicts) return { tone: "warn", title: "Сверить с ИИ-проверкой", detail: [conflicts] };
      if (unk) return { tone: "neutral", title: "Не хватает проверок", detail: [unk] };
      if (x.mandatoryOpen.length) return { tone: "warn", title: "Решить до выпуска", detail: [mand, "Исправьте или оформите исключение с датой пересмотра."] };
      if (noAi) return { tone: "neutral", title: "Остаётся ИИ-проверка", detail: ["Проверка человеком пройдена.", noAi] };
      const d = ["Обе проверки проведены. Блокеров нет, обязательные пункты выполнены или оформлены исключением."];
      if (x.sevCount.P1) d.push(`Серьёзные находки (${x.sevCount.P1}) исправить в ближайшем цикле.`);
      return { tone: "ok", title: "Можно выпускать", detail: d };
    }

    // Аудит
    const pending = [...incomplete, conflicts, noAi].filter(Boolean);
    const pre = pending.length ? "Предварительно · " : "";
    if (x.sevCount.P0) return { tone: "bad", title: pre + "Ниже уровня 1", detail: [`Блокеров: ${x.sevCount.P0}. Сначала исправьте их.`, ...pending] };
    if (x.sevCount.P1 || x.mandatoryOpen.length) return { tone: "warn", title: pre + "Уровень 1 · Работает", detail: [`Для уровня 2 закройте серьёзные находки (${x.sevCount.P1}) и обязательные пункты.`, mand, ...pending].filter(Boolean) };
    if (x.recommendedOpen.length || !review.peopleChecked) {
      const need = [];
      if (x.recommendedOpen.length) need.push(`рекомендованные пункты: ${x.recommendedOpen.map((i) => i.id).join(", ")}`);
      if (!review.peopleChecked) need.push("подтверждение наблюдением за людьми");
      return { tone: "ok", title: pre + "Уровень 2 · Понятно и честно", detail: [`Для уровня 3 не хватает: ${need.join("; ")}.`, unk, ...pending].filter(Boolean) };
    }
    return { tone: "ok", title: pre + "Уровень 3 · Меньше, но лучше", detail: ["Все требования выполнены, результат подтверждён наблюдением за людьми.", unk, ...pending].filter(Boolean) };
  }

  // ------------------------------------------------------------------ Возможности платформы
  const cap = { db: null, user: null, downloads: null, sample: null, limits: null, myId: null, history: [], historyState: "loading" };
  let saveChain = Promise.resolve();
  let teamTimer = null;
  let saveStatus = "";

  async function initCapabilities() {
    if (!window.claude || typeof window.claude.use !== "function") { cap.historyState = "off"; refreshHistory(); return; }
    const use = (n) => window.claude.use(n).catch(() => null);
    const [db, user, downloads, sample] = await Promise.all([use("db"), use("user"), use("downloads"), use("sample")]);
    Object.assign(cap, { db, user, downloads, sample });
    if (sample) { try { cap.limits = await sample.limits(); } catch (e) { cap.limits = null; } }
    if (user) { try { cap.myId = await user.id(); } catch (e) { cap.myId = null; } }
    if (db) {
      db.collection("reviews").orderBy("updatedAt", "desc").limit(100).onSnapshot(
        (snap) => { cap.history = snap.docs.map((d) => ({ id: d.id, ...d.data() })); cap.historyState = "ready"; refreshHistory(); },
        () => { cap.historyState = "error"; refreshHistory(); }
      );
    } else cap.historyState = "off";
    refreshHistory();
    if (state.view === "summary" || state.view === "ai") render();
  }

  function serialize(r) {
    const x = analyze(r), v = verdict(r);
    return {
      mode: r.mode, product: r.product, scenario: r.scenario || "", link: r.link || "", people: r.people || "", aiContext: r.aiContext || "",
      answers: Object.entries(r.answers).map(([id, a]) => ({ id, c: Array.isArray(a.c) ? a.c.map((v) => (v === true || v === false ? v : null)) : [], x: a.x || "", s: a.s || "", sev: a.sev || "", note: a.note || "", exc: !!a.exc, aiReject: a.aiReject || "" })),
      ai: r.ai ? { at: r.ai.at, source: r.ai.source, summary: r.ai.summary || "", items: Object.entries(r.ai.items || {}).map(([id, i]) => ({ id, c: i.c, na: !!i.na, sev: i.sev || "", ev: i.ev || "" })) } : null,
      peopleChecked: !!r.peopleChecked, createdAt: r.createdAt, updatedAt: Date.now(), authorId: r.authorId || cap.myId || "",
      std: DATA.version, verdict: v.title, tone: v.tone, counts: x.sevCount, answered: x.answered, total: x.items.length, aiDone: x.aiDone,
    };
  }
  function deserialize(id, d) {
    const answers = {};
    (d.answers || []).forEach((a) => {
      if (!BY_ID[a.id]) return;
      answers[a.id] = { c: Array.isArray(a.c) && a.c.length ? a.c.map((v) => (v === true || v === false ? v : undefined)) : undefined, x: a.x || undefined, s: a.s || undefined, sev: a.sev || undefined, note: a.note || "", exc: !!a.exc, aiReject: a.aiReject || "" };
    });
    let aiRes = null;
    if (d.ai && Array.isArray(d.ai.items)) {
      aiRes = { at: d.ai.at, source: d.ai.source, summary: d.ai.summary || "", items: {} };
      d.ai.items.forEach((i) => { if (BY_ID[i.id]) aiRes.items[i.id] = { c: i.c || [], na: !!i.na, sev: i.sev || null, ev: i.ev || "" }; });
    }
    return {
      id, mode: MODES[d.mode] ? d.mode : "design", product: d.product || "Без названия", scenario: d.scenario || "", link: d.link || "", people: d.people || "",
      aiContext: d.aiContext || "", answers, ai: aiRes, peopleChecked: !!d.peopleChecked, createdAt: d.createdAt || Date.now(), authorId: d.authorId || "", savedToTeam: true,
    };
  }

  function teamSaveNow() {
    const r = state.review;
    if (!cap.db || !r) return;
    const col = cap.db.collection("reviews");
    const ref = r.id ? col.doc(r.id) : col.doc();
    if (!r.id) { r.id = ref.id; r.authorId = r.authorId || cap.myId || ""; }
    const body = serialize(r);
    saveStatus = "saving"; updateSaveUi();
    saveChain = saveChain.then(() => ref.set(body)).then(
      () => { r.savedToTeam = true; saveStatus = "saved:" + Date.now(); updateSaveUi(); persistDraft(); },
