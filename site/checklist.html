<title>Чек-лист «Меньше, но лучше»</title>
<meta name="description" content="Проверка продукта по стандарту дизайна на основе десяти принципов Дитера Рамса">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Раскладка: корпус прибора — тёплый светлый серый, тёмные надписи, шильдики с номерами требований.
   Цвет появляется только там, где он что-то значит: статус пункта и серьёзность находки. */
:root {

  --surface: #F8F7F4;
  --sunk: #E2DFD8;
  --ink: #1D1D1B;
  --muted: #5A5852;

  --unk: #45567A; --unk-bg: #DCE1EB;
  --p0: #A93527; --p1: #A84A16; --p2: #8A5A00; --p3: #67645D;
  --f-display: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Golos Text", "Helvetica Neue", Arial, sans-serif;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191917; --surface: #23231F; --sunk: #2C2B27; --ink: #ECEAE4; --muted: #A9A69D; --line: #3D3C37;
    --signal: #F07A42;
    --ok: #74C493; --ok-bg: #1E3225; --warn: #E2B45C; --warn-bg: #3A2F17; --bad: #F2887A; --bad-bg: #3F221E;
    --na: #A9A69D; --na-bg: #2F2E2A; --unk: #A3B4D8; --unk-bg: #242C3B;
    --p0: #F2887A; --p1: #EE9E68; --p2: #E2B45C; --p3: #A9A69D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191917; --surface: #23231F; --sunk: #2C2B27; --ink: #ECEAE4; --muted: #A9A69D; --line: #3D3C37;
  --signal: #F07A42;
  --ok: #74C493; --ok-bg: #1E3225; --warn: #E2B45C; --warn-bg: #3A2F17; --bad: #F2887A; --bad-bg: #3F221E;
  --na: #A9A69D; --na-bg: #2F2E2A; --unk: #A3B4D8; --unk-bg: #242C3B;

  color-scheme: dark;
}

* { box-sizing: border-box; }
body {

  color: var(--ink);
  font: 400 16px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }

/* ---------- Шапка */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.2) blur(8px);

}
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 56px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 15px/1 var(--f-display); text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
.brand .lamp { width: 9px; height: 9px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--signal) 22%, transparent); }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav button {
  border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--muted);
}
.nav button[aria-current="page"] { color: var(--ink); background: var(--sunk); }
.nav button:hover { color: var(--ink); }

/* ---------- Общие элементы */
.eyebrow { font: 500 12px/1.3 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.plate {
  display: inline-flex; align-items: center; font: 500 12px/1 var(--f-mono); letter-spacing: 0.04em;
  border: 1px solid var(--ink); border-radius: 3px; padding: 4px 6px 3px; white-space: nowrap;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { opacity: 0.88; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.small { min-height: 34px; padding: 0 14px; font-size: 14px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--muted); font-size: 14px; }
.linkbtn:hover { color: var(--ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.muted { color: var(--muted); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 16px; }
.hidden-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Главная */
.home { padding-block: 40px 64px; display: grid; gap: 44px; }
.hero { display: grid; gap: 14px; max-width: 760px; }
.hero h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.08; font-weight: 800; }
.hero p { font-size: 18px; color: var(--muted); max-width: 62ch; }
.motto { font: 600 15px/1.4 var(--f-display); color: var(--ink); }
.motto span { color: var(--muted); font-weight: 500; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.section-head h2 { font-size: 22px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.mode {
  text-align: left; padding: 20px; cursor: pointer; display: grid; gap: 10px; align-content: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
.mode:hover { border-color: var(--ink); }
.mode h3 { font-size: 19px; }
.mode .count { font: 500 13px/1 var(--f-mono); color: var(--muted); }
.mode p { color: var(--muted); font-size: 15px; }
.mode.main { border-color: var(--ink); }
.mode .badge-main { justify-self: start; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; background: var(--ink); color: var(--surface); padding: 3px 8px; border-radius: 4px; }
.draft { padding: 18px 20px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.draft .info { display: grid; gap: 4px; min-width: 0; }
.draft .info strong { font-size: 17px; overflow-wrap: anywhere; }

.history { display: grid; }
.history-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center;
  padding: 14px 4px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0;
  text-align: left; cursor: pointer; width: 100%;
}
.history-row:first-child { border-top: 1px solid var(--line); }
.history-row:hover .h-title { text-decoration: underline; text-underline-offset: 3px; }
.h-title { font-weight: 600; overflow-wrap: anywhere; }
.h-meta { font-size: 14px; color: var(--muted); grid-column: 1; }
.h-verdict { grid-column: 2; grid-row: 1 / span 2; }
.empty { padding: 28px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

/* ---------- Вердикт-пилюли */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.tone-ok { color: var(--ok); background: var(--ok-bg); }
.tone-warn { color: var(--warn); background: var(--warn-bg); }
.tone-bad { color: var(--bad); background: var(--bad-bg); }
.tone-neutral { color: var(--muted); background: var(--sunk); }

/* ---------- Настройка */
.setup { padding-block: 32px 64px; max-width: 680px; display: grid; gap: 24px; }
.setup h1 { font-size: 32px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; }
.field .hint { font-size: 14px; color: var(--muted); }
.field input, .field textarea, .note textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; min-height: 44px;
}
.field input:focus, .field textarea:focus, .note textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 1px var(--ink); }
.field textarea { min-height: 84px; resize: vertical; }
.error-text { color: var(--bad); font-size: 14px; }

/* ---------- Проверка */
.check { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 32px; padding-block: 24px 64px; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: grid; gap: 18px; }
.side .review-name { display: grid; gap: 4px; }
.side .review-name strong { font: 700 17px/1.25 var(--f-display); overflow-wrap: anywhere; }
.progress { height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--ink); width: 0; transition: width .25s ease; }
.progress-label { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.groups { display: grid; gap: 2px; list-style: none; padding: 0; margin: 0; }
.groups button {
  width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left;
  border: 0; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; color: var(--muted);
}
.groups button:hover { background: var(--sunk); color: var(--ink); }
.groups button[aria-current="step"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.groups .g-count { font: 500 12px/1 var(--f-mono); }
.groups .g-done .g-count { color: var(--ok); }
.groups .g-flag { color: var(--bad); }
.toggle { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--ink); }

.group-head { display: grid; gap: 8px; margin-bottom: 20px; }
.group-head h2 { font-size: clamp(24px, 3.4vw, 32px); }
.group-head p { color: var(--muted); max-width: 62ch; }
.items { display: grid; gap: 14px; }
.item { padding: 20px; display: grid; gap: 14px; scroll-margin-top: 80px; }
.item.answered { background: color-mix(in srgb, var(--surface) 70%, var(--bg)); }
.item-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.item-top .quick { font-size: 12px; font-weight: 600; color: var(--muted); }
.item h3 { font: 600 19px/1.35 var(--f-display); letter-spacing: -0.005em; }
.design-note { font-size: 13px; color: var(--muted); }
.hint-box { display: grid; gap: 8px; font-size: 15px; padding: 14px 16px; background: var(--bg); border-radius: 8px; }
.hint-box .h-label { font-weight: 600; }
.hint-box .red { color: var(--muted); }
.hint-box .req-line { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }

.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice {
  display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 15px;
}
.choice:hover { border-color: var(--ink); }
.choice .ic { font-weight: 700; width: 1em; text-align: center; }
.choice[aria-pressed="true"] { font-weight: 600; }
.choice.s-yes[aria-pressed="true"] { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); }
.choice.s-partial[aria-pressed="true"] { color: var(--warn); background: var(--warn-bg); border-color: var(--warn); }
.choice.s-no[aria-pressed="true"] { color: var(--bad); background: var(--bad-bg); border-color: var(--bad); }
.choice.s-na[aria-pressed="true"] { color: var(--na); background: var(--na-bg); border-color: var(--na); }
.choice.s-unknown[aria-pressed="true"] { color: var(--unk); background: var(--unk-bg); border-color: var(--unk); }
.sev-block { display: grid; gap: 8px; }
.sev-label { font-size: 14px; font-weight: 600; }
.sev-label span { font-weight: 400; color: var(--muted); }
.sev { min-height: 36px; padding: 0 12px; font-size: 14px; }
.sev .code { font-family: var(--f-mono); font-size: 12px; }
.sev[aria-pressed="true"] { color: var(--surface); }
.sev.P0[aria-pressed="true"] { background: var(--p0); border-color: var(--p0); }
.sev.P1[aria-pressed="true"] { background: var(--p1); border-color: var(--p1); }
.sev.P2[aria-pressed="true"] { background: var(--p2); border-color: var(--p2); }
.sev.P3[aria-pressed="true"] { background: var(--p3); border-color: var(--p3); }
.sev-desc { font-size: 13px; color: var(--muted); }
.note { display: grid; gap: 6px; }
.note label { font-size: 14px; font-weight: 600; }
.note textarea { min-height: 64px; resize: vertical; font-size: 15px; }
.exc { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.exc input { width: 18px; height: 18px; accent-color: var(--ink); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; flex-wrap: wrap; }

/* ---------- Итог */
.summary { padding-block: 32px 64px; display: grid; gap: 28px; max-width: 900px; }
.verdict { padding: 24px; border-radius: var(--radius); display: grid; gap: 10px; border: 1px solid currentColor; }
.verdict h1 { font-size: clamp(26px, 4vw, 36px); color: inherit; }
.verdict ul { margin: 0; padding-left: 20px; color: var(--ink); display: grid; gap: 4px; }
.verdict .v-eyebrow { color: inherit; opacity: 0.85; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { padding: 14px 16px; display: grid; gap: 2px; }
.stat b { font: 700 26px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.stat.P0 b { color: var(--p0); } .stat.P1 b { color: var(--p1); } .stat.P2 b { color: var(--p2); } .stat.P3 b { color: var(--p3); }
.findings { display: grid; gap: 10px; }
.finding { padding: 16px 18px; display: grid; gap: 8px; border-left: 4px solid var(--line); }
.finding.P0 { border-left-color: var(--p0); } .finding.P1 { border-left-color: var(--p1); } .finding.P2 { border-left-color: var(--p2); } .finding.P3 { border-left-color: var(--p3); }
.finding .f-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.finding .f-sev { font: 500 12px/1 var(--f-mono); font-weight: 700; }
.finding.P0 .f-sev { color: var(--p0); } .finding.P1 .f-sev { color: var(--p1); } .finding.P2 .f-sev { color: var(--p2); } .finding.P3 .f-sev { color: var(--p3); }
.finding .f-q { font-weight: 600; }
.finding .f-note { white-space: pre-wrap; overflow-wrap: anywhere; }
.finding .f-note.empty-note { color: var(--bad); font-size: 14px; }
.export { padding: 20px; display: grid; gap: 14px; }
.export textarea { width: 100%; min-height: 220px; font: 13px/1.5 var(--f-mono); border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--bg); }
.save-status { font-size: 14px; color: var(--muted); }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 8px; background: var(--bad-bg); color: var(--bad); }
.list-plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.more { padding: 0; }
.more summary { display: flex; justify-content: space-between; gap: 12px; padding: 14px 18px; cursor: pointer; font: 600 17px/1.3 var(--f-display); list-style: none; }
.more summary::-webkit-details-marker { display: none; }
.more summary::after { content: "+"; font-weight: 400; color: var(--muted); }
.more[open] summary::after { content: "−"; }
.more .list-plain { padding: 0 18px 16px 38px; font-size: 15px; }

/* ---------- Справочник */
.guide { padding-block: 32px 64px; display: grid; gap: 32px; }
.guide-intro { display: grid; gap: 10px; max-width: 760px; }
.guide-intro h1 { font-size: clamp(28px, 4.4vw, 40px); }
.guide-intro p { color: var(--muted); font-size: 17px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.principle { display: grid; gap: 12px; }
.principle-head { display: flex; gap: 14px; align-items: baseline; border-bottom: 1px solid var(--ink); padding-bottom: 10px; }
.principle-head .num { font: 800 34px/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: 1.4em; }
.principle-head h2 { font-size: 22px; }
.req { padding: 18px 20px; display: grid; gap: 10px; }
.req .r-text { font-weight: 600; }
.req .r-q { display: grid; gap: 2px; font-size: 15px; }
.req .r-q b { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.req .r-red { font-size: 14px; color: var(--muted); }

/* ---------- Уведомление */
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%);
  background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500;
  max-width: calc(100% - 32px); z-index: 20;
}


/* ---------- Критерии */
.sources-line { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.sources-line a { color: inherit; text-underline-offset: 2px; }
.crits { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.crit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.crit-text { font-size: 15.5px; }
.crit-side { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.yn { min-height: 34px; min-width: 52px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; }
.yn:hover { border-color: var(--ink); }
.yn.y[aria-pressed="true"] { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); font-weight: 600; }
.yn.n[aria-pressed="true"] { color: var(--bad); background: var(--bad-bg); border-color: var(--bad); font-weight: 600; }
.crits.off { opacity: 0.45; }
.ai-mark { font: 500 12px/1 var(--f-mono); padding: 4px 6px; border-radius: 4px; white-space: nowrap; }
.ai-mark.t { color: var(--ok); background: var(--ok-bg); }
.ai-mark.f { color: var(--bad); background: var(--bad-bg); }
.ai-mark.u { color: var(--unk); background: var(--unk-bg); }
.item-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.item-foot .choices { gap: 6px; }
.item-foot .choice { min-height: 34px; font-size: 14px; padding: 0 12px; }
.result { font-size: 14px; color: var(--muted); }
.result .pill { margin-left: 6px; }
.tone-partial { color: var(--warn); background: var(--warn-bg); }
.tone-yes { color: var(--ok); background: var(--ok-bg); }
.tone-no { color: var(--bad); background: var(--bad-bg); }
.tone-na, .tone-pending { color: var(--na); background: var(--na-bg); }
.tone-unknown { color: var(--unk); background: var(--unk-bg); }
.ai-box { display: grid; gap: 8px; padding: 12px 14px; border-radius: 8px; background: var(--unk-bg); font-size: 15px; }
.ai-box .ai-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; color: var(--unk); }
.ai-box.conflict { background: var(--warn-bg); }
.ai-box.conflict .ai-head { color: var(--warn); }
.ai-box textarea { width: 100%; min-height: 56px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); resize: vertical; }
.ai-box .ai-ev { overflow-wrap: anywhere; }
.ai-hidden { font-size: 14px; color: var(--muted); }

/* ---------- ИИ-проверка */
.ai-view { display: grid; gap: 20px; }
.panel { padding: 20px; display: grid; gap: 14px; }
.panel h2 { font-size: 20px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.thumb { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); aspect-ratio: 3 / 4; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--ink); color: var(--surface); cursor: pointer; font-size: 16px; line-height: 1; }
.drop { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 10px; justify-items: start; }
.drop.over { border-color: var(--ink); background: var(--sunk); }
.drop input[type=file] { max-width: 100%; }
.progress-text { font-size: 15px; }
.ai-status { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.paste { width: 100%; min-height: 120px; font: 13px/1.5 var(--f-mono); border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--bg); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

@media (max-width: 860px) {
  .check { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .side { position: static; }
  .groups { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .groups li { flex: none; }
  .groups button { width: auto; white-space: nowrap; border: 1px solid var(--line); }
  .crit { grid-template-columns: minmax(0, 1fr); }
  .crit-side { justify-content: flex-start; }
}
@media (max-width: 520px) {
  .item { padding: 16px; }
  .history-row { grid-template-columns: minmax(0, 1fr); }
  .h-verdict { grid-column: 1; grid-row: auto; justify-self: start; }
  .nav button { padding: 8px 10px; }
}

й выбор даты без явной выгоды.","criteria":["Все отличия от привычного поведения в похожих продуктах перечислены.","Для каждого отличия названа выгода для человека."],"criteriaDesign":["Все отличия от привычного поведения в похожих продуктах перечислены.","Для каждого отличия названа выгода для человека."],"quick":false,"ive":[{"n":3,"title":"У нового решения должна быть объяснимая польза"}],"hig":[{"key":"Familiarity","title":"Принцип Familiarity — знакомость","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R1.3 — рекомендуется\nВопрос: Знакомые механики заменены только там, где выигрыш объясним?\nКритерии:\n1. Все отличия от привычного поведения в похожих продуктах перечислены.\n2. Для каждого отличия названа выгода для человека.\nТревожный признак: Своя прокрутка или свой выбор даты без явной выгоды.","aiBuild":"### R1.3 — рекомендуется\nВопрос: Знакомые механики заменены только там, где выигрыш объясним?\nКритерии:\n1. Все отличия от привычного поведения в похожих продуктах перечислены.\n2. Для каждого отличия названа выгода для человека.\nТревожный признак: Своя прокрутка или свой выбор даты без явной выгоды."},{"id":"R7.5","principle":7,"text":"Визуальные решения обоснованы задачей, а не модой","level":"Р","stage":"М","check":"Описание решения","group":"task","q":"Визуальные приёмы объяснимы задачей, а не модой?","qDesign":"Визуальные приёмы объяснимы задачей, а не модой?","how":"Для каждого заметного эффекта (стекло, градиенты, крупные скругления, тени) назовите его роль: иерархия, действие, характер продукта. Роль не называется — это мода.","howDesign":"Для каждого заметного эффекта (стекло, градиенты, крупные скругления, тени) назовите его роль: иерархия, действие, характер продукта. Роль не называется — это мода.","red":"Эффект появился, потому что «сейчас так делают».","criteria":["Для каждого заметного визуального эффекта можно назвать его роль: иерархия, действие или характер продукта.", ения с причиной.","howDesign":"Пройдите экраны по списку checklists/AI_TELLS.md, группы В–И. Каждый найденный признак либо убирается, либо его выбор задан дизайн-системой или записан в описании решения с причиной.","red":"Фиолетовый градиент, Inter без решения, три одинаковые карточки с иконками в цветных квадратах, метка заглавными над каждым заголовком, «Анна К. · 2 дня · 3 комментария».","criteria":["Нет фиолетово-синих градиентов, градиентов в тексте и рамках, свечения и оттенков одного цвета вместо палитры.","Шрифт задан дизайн-системой или выбран с записанной причиной; в заголовках не выделено одно слово другим начертанием или цветом.","Блоки не разложены по одинаковым карточкам: нет карточек в карточках, цветных полос по краю, одного скругления и одной тени на всё.","Нет иконок в цветных квадратах над заголовками, эмодзи и нарисованных окон с точками macOS.","Нет шаблонной обвязки: меток заглавными над заголовками, метаданных через точку, подписей «СЛОВО — фрагмент», стрелок в каждой кнопке, декоративной нумерации.","Нет декоративной анимации: всплывания каждой секции, пружин, набегающих счётчиков.","Нет выдуманного содержимого и пустых слов: имён-заглушек, круглых цифр без источника, «раскройте потенциал»."],"criteriaDesign":["Нет фиолетово-синих градиентов, градиентов в тексте и рамках, свечения и оттенков одного цвета вместо палитры.","Шрифт задан дизайн-системой или выбран с записанной причиной; в заголовках не выделено одно слово другим начертанием или цветом.","Блоки не разложены по одинаковым карточкам: нет карточек в карточках, цветных полос по краю, одного скругления и одной тени на всё.","Нет иконок в цветных квадратах над заголовками, эмодзи и нарисованных окон с точками macOS.","Нет шаблонной обвязки: меток заглавными над заголовками, метаданных через точку, подписей «СЛОВО — фрагмент», стрелок в каждой кнопке, декоративной нумерации.","Нет декоративной анимации: всплывания каждой секции, пружин, набегающих счётчиков.","Нет выдуманного содержимого и пустых слов: имён-заглушек, круглых цифр без источника, «раскройте потенциал»."],"quick":false,"ive":[{"n":10,"title":"Выразительность должна соответствовать задаче"},{"n":9,"title":"Детали помогают понять, как обращаться с продуктом"}],"hig":[{"key":"Craft","title":"Принцип Craft — качество исполнения","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},{"key":"Typography","title":"Typography — типографика","url":"https://developer.apple.com/design/human-interface-guidelines/typography"},{"key":"Color","title":"Color — цвет","url":"https://developer.apple.com/design/human-interface-guidelines/color"}],"w3c":[],"aiDesign":"### R7.6 — обязательно\nВопрос: В решении нет признаков ИИ-дизайна: шаблонных цветов, шрифтов, карточек, обвязки и пустых слов?\nКритерии:\n1. Нет фиолетово-синих градиентов, градиентов в тексте и рамках, свечения и оттенков одного цвета вместо палитры.\n2. Шрифт задан дизайн-системой или выбран с записанной причиной; в заголовках не выделено одно слово другим начертанием или цветом.\n3. Блоки не разложены по одинаковым карточкам: нет карточек в карточках, цветных полос по краю, одного скругления и одной тени на всё.\n4. Нет иконок в цветных квадратах над заголовками, эмодзи и нарисованных окон с точками macOS.\n5. Нет шаблонной обвязки: меток заглавными над заголовками, метаданных через точку, подписей «СЛОВО — фрагмент», стрелок в каждой кнопке, декоративной нумерации.\n6. Нет декоративной анимации: всплывания каждой секции, пружин, набегающих счётчиков.\n7. Нет выдуманного содержимого и пустых слов: имён-заглушек, круглых цифр без источника, «раскройте потенциал».\nТревожный признак: Фиолетовый градиент, Inter без решения, три одинаковые карточки с иконками в цветных квадратах, метка заглавными над каждым заголовком, «Анна К. · 2 дня · 3 комментария».","aiBuild":"### R7.6 — обязательно\nВопрос: В решении нет признаков ИИ-дизайна: шаблонных цветов, шрифтов, карточек, обвязки и пустых слов?\nКритерии:\n1. Нет фиолетово-синих градиентов, градиентов в тексте и рамках, свечения и оттенков одного цвета вместо палитры.\n2. Шрифт задан дизайн-системой или выбран с записанной причиной; в заголовках не выделено одно слово другим начертанием или цветом.\n3. Блоки не разложены по одинаковым карточкам: нет карточек в карточках, цветных полос по краю, одного скругления и одной тени на всё.\n4. Нет иконок в цветных квадратах над заголовками, эмодзи и нарисованных окон с точками macOS.\n5. Нет шаблонной обвязки: меток заглавными над заголовками, метаданных через точку, подписей «СЛОВО — фрагмент», стрелок в каждой кнопке, декоративной нумерации.\n6. Нет декоративной анимации: всплывания каждой секции, пружин, набегающих счётчиков.\n7. Нет выдуманного содержимого и пустых слов: имён-заглушек, круглых цифр без источника, «раскройте потенциал».\nТревожный признак: Фиолетовый градиент, Inter без решения, три одинаковые карточки с иконками в цветных квадратах, метка заглавными над каждым заголовком, «Анна К. · 2 дня · 3 комментария»."},{"id":"R3.1","principle":3,"text":"Визуальный приоритет совпадает с важностью: главное действие и данные выделены, уровни заголовков и текста различимы","level":"О","stage":"М","check":"Ревью макета","group":"glance","q":"С первого взгляда понятно, что на экране главное и что делать дальше?","qDesign":"С первого взгляда понятно, что на экране главное и что делать дальше?","how":"Посмотрите на экран 5 секунд, отвернитесь и назовите главное действие и главные данные. Сравните с тем, что важно для задачи. Помогает уменьшить или размыть макет.","howDesign":"Посмотрите на экран 5 секунд, отвернитесь и назовите главное действие и главные данные. Сравните с тем, что важно для задачи. Помогает уменьшить или размыть макет.","red":"Три одинаково ярких кнопки, или баннер заметнее основного содержимого.","criteria":["Можно назвать одно главное действие экрана.","Главное действие заметнее второстепенных.","Самые важные данные заметнее вспомогательных.","Нет нескольких одинаково ярких акцентов, которые спорят за внимание."],"criteriaDesign":["Можно назвать одно главное действие экрана.","Главное действие заметнее второстепенных.","Самые важные данные заметнее вспомогательных.","Нет нескольких одинаково ярких акцентов, которые спорят за внимание."],"quick":true,"ive":[{"n":9,"title":"Детали помогают понять, как обращаться с продуктом"}],"hig":[{"key":"Layout","title":"Layout — компоновка","url":"https://developer.apple.com/design/human-interface-guidelines/layout"},{"key":"Simplicity","title":"Принцип Simplicity — простота","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R3.1 — обязательно\nВопрос: С первого взгляда понятно, что на экране главное и что делать дальше?\nКритерии:\n1. Можно назвать одно главное действие экрана.\n2. Главное действие заметнее второстепенных.\n3. Самые важные данные заметнее вспомогательных.\n4. Нет нескольких одинаково ярких акцентов, которые спорят за внимание.\nТревожный признак: Три одинаково ярких кнопки, или баннер заметнее основного содержимого.","aiBuild":"### R3.1 — обязательно\nВопрос: С первого взгляда понятно, что на экране главное и что делать дальше?\nКритерии:\n1. Можно назвать одно главное действие экрана.\n2. Главное действие заметнее второстепенных.\n3. Самые важные данные заметнее вспомогательных.\n4. Нет нескольких одинаково ярких акцентов, которые спорят за внимание.\nТревожный признак: Три одинаково ярких кнопки, или баннер заметнее основного содержимого."},{"id":"R2.2","principle":2,"text":"Основное частое действие доступно в контексте сценария, без поиска в глубине меню","level":"О","stage":"М","check":"Прохождение сценария","group":"glance","q":"Основное частое действие под рукой, а не спрятано в меню?","qDesign":"Основное частое действие под рукой, а не спрятано в меню?","how":"Назовите действие, которое человек делает чаще всего в этом сценарии, и посчитайте шаги до него с того экрана, где он находится.","howDe sign":"Выпишите акцентные цвета сценария и роль каждого: действие, ошибка, предупреждение, успех, выбор. У одного цвета — одна роль.","red":"Синий — это и ссылка, и выбранная строка, и информационный баннер.","criteria":["У каждого акцентного цвета одна роль: действие, ошибка, предупреждение, успех или выбор.","Один и тот же цвет не используется для разных ролей."],"criteriaDesign":["У каждого акцентного цвета одна роль: действие, ошибка, предупреждение, успех или выбор.","Один и тот же цвет не используется для разных ролей."],"quick":false,"ive":[],"hig":[{"key":"Color","title":"Color — цвет","url":"https://developer.apple.com/design/human-interface-guidelines/color"}],"w3c":[],"aiDesign":"### R3.5 — рекомендуется\nВопрос: Каждый акцентный цвет означает одно и то же во всём продукте?\nКритерии:\n1. У каждого акцентного цвета одна роль: действие, ошибка, предупреждение, успех или выбор.\n2. Один и тот же цвет не используется для разных ролей.\nТревожный признак: Синий — это и ссылка, и выбранная строка, и информационный баннер.","aiBuild":"### R3.5 — рекомендуется\nВопрос: Каждый акцентный цвет означает одно и то же во всём продукте?\nКритерии:\n1. У каждого акцентного цвета одна роль: действие, ошибка, предупреждение, успех или выбор.\n2. Один и тот же цвет не используется для разных ролей.\nТревожный признак: Синий — это и ссылка, и выбранная строка, и информационный баннер."},{"id":"R4.5","principle":4,"text":"Одна иконка означает одно действие во всём продукте; интерактивные элементы отличимы от неинтерактивных","level":"О","stage":"М","check":"Ревью макета","group":"glance","q":"Одна иконка везде означает одно действие, а кликабельное отличается от некликабельного?","qDesign":"Одна иконка везде означает одно действие, а кликабельное отличается от некликабельного?","how":"Сравните одинаковые иконки на разных экранах: делают ли они одно и то же? Попробуйте угадать, что нажимается, не наводя курсор.","howDesign":"Сравните одинаковые иконки на разных экранах: делают ли они одно и то же? Попробуйте угадать, что нажимается, не наводя курсор.","red":"Карандаш где-то редактирует, а где-то открывает подробности; серый текст похож на ссылку.","criteria":["Одинаковые иконки делают одно и то же на всех экранах.","Одно действие везде обозначено одной иконкой.","По виду элемента понятно, нажимается он или нет."],"criteriaDesign":["Одинаковые иконки делают одно и то же на всех экранах.","Одно действие везде обозначено одной иконкой.","По виду элемента понятно, нажимается он или нет."],"quick":false,"ive":[{"n":9,"title":"Детали помогают понять, как обращаться с продуктом"}],"hig":[{"key":"Buttons","title":"Buttons — кнопки","url":"https://developer.apple.com/design/human-interface-guidelines/buttons"},{"key":"Color","title":"Color — цвет","url":"https://developer.apple.com/design/human-interface-guidelines/color"}],"w3c":[],"aiDesign":"### R4.5 — обязательно\nВопрос: Одна иконка везде означает одно действие, а кликабельное отличается от некликабельного?\nКритерии:\n1. Одинаковые иконки делают одно и то же на всех экранах.\n2. Одно действие везде обозначено одной иконкой.\n3. По виду элемента понятно, нажимается он или нет.\nТревожный признак: Карандаш где-то редактирует, а где-то открывает подробности; серый текст похож на ссылку.","aiBuild":"### R4.5 — обязательно\nВопрос: Одна иконка везде означает одно действие, а кликабельное отличается от некликабельного?\nКритерии:\n1. Одинаковые иконки делают одно и то же на всех экранах.\n2. Одно действие везде обозначено одной иконкой.\n3. По виду элемента понятно, нажимается он или нет.\nТревожный признак: Карандаш где-то редактирует, а где-то открывает подробности; серый текст похож на ссылку."},{"id":"R10.1","principle":10,"text":"У каждого элемента и шага есть назначение; дублирующие способы выполнить одну задачу объединены; нет отдельных элементов для действия, которое уже выполняет сам элемент управления","level":"О","stage":"М","check":"Ревью сценария","group":"glance","q":"У каждого элемента и шага есть работа, и нет двух способов сделать одно и то же без причины?","qDesign":"У каждого элемента и шага есть работа, и нет двух способов сделать одно и то же без причины?","how":"Укажите на каждый элемент и спросите: что сломается, если его убрать? Найдите дубли — одно действие в шапке, в меню и в карточке.","howDesign":"Укажите на каждый элемент и спросите: что сломается, если его убрать? Найдите дубли — одно действие в шапке, в меню и в карточке.","red":"Элемент «для красоты» или «на всякий случай»; строка фильтров с крестиками рядом с двумя видимыми переключателями.","criteria":["Для каждого элемента экрана можно сказать, что сломается без него.","Одну задачу нельзя выполнить двумя разными способами без причины.","Нет элементов «для красоты» или «на всякий случай».","Нет отдельного элемента для действия, которое уже выполняет сам элемент управления: строки фильтров с крестиками при видимых фильтрах, кнопки «Очистить» у поиска."],"criteriaDesign":["Для каждого элемента экрана можно сказать, что сломается без него.","Одну задачу нельзя выполнить двумя разными способами без причины.","Нет элементов «для красоты» или «на всякий случай».","Нет отдельного элемента для действия, которое уже выполняет сам элемент управления: строки фильтров с крестиками при видимых фильтрах, кнопки «Очистить» у поиска."],"quick":false,"ive":[{"n":2,"title":"Простота требует разобраться со сложностью"}],"hig":[{"key":"Simplicity","title":"Принцип Simplicity — простота","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R10.1 — обязательно\nВопрос: У каждого элемента и шага есть работа, и нет двух способов сделать одно и то же без причины?\nКритерии:\n1. Для каждого элемента экрана можно сказать, что сломается без него.\n2. Одну задачу нельзя выполнить двумя разными способами без причины.\n3. Нет элементов «для красоты» или «на всякий случай».\n4. Нет отдельного элемента для действия, которое уже выполняет сам элемент управления: строки фильтров с крестиками при видимых фильтрах, кнопки «Очистить» у поиска.\nТревожный признак: Элемент «для красоты» или «на всякий случай»; строка фильтров с крестиками рядом с двумя видимыми переключателями.","aiBuild":"### R10.1 — обязательно\nВопрос: У каждого элемента и шага есть работа, и нет двух способов сделать одно и то же без причины?\nКритерии:\n1. Для каждого элемента экрана можно сказать, что сломается без него.\n2. Одну задачу нельзя выполнить двумя разными способами без причины.\n3. Нет элементов «для красоты» или «на всякий случай».\n4. Нет отдельного элемента для действия, которое уже выполняет сам элемент управления: строки фильтров с крестиками при видимых фильтрах, кнопки «Очистить» у поиска.\nТревожный признак: Элемент «для красоты» или «на всякий случай»; строка фильтров с крестиками рядом с двумя видимыми переключателями."},{"id":"R10.3","principle":10,"text":"Частые действия видимы, редкие настройки раскрываются по необходимости","level":"О","stage":"М","check":"Ревью сценария","group":"glance","q":"Частое — на виду, редкое — раскрывается, когда нужно?","qDesign":"Частое — на виду, редкое — раскрывается, когда нужно?","how":"Разделите действия и настройки экрана на частые и редкие. Частые видны сразу, редкие доступны в одно понятное раскрытие.","howDesign":"Разделите действия и настройки экрана на частые и редкие. Частые видны сразу, редкие доступны в одно понятное раскрытие.","red":"Редкая техническая настройка занимает место на главном экране, а частое действие скрыто.","criteria":["Частые действия видны сразу.","Редкие настройки доступны через одно понятное раскрытие.","Редкое не занимает место частого."],"criteriaDesign":["Частые действия видны сразу.","Редкие настройки доступны через одно понятное раскрытие.","Редкое не занимает место частого."],"quick":false,"ive":[{"n":2,"title":"Простота требует разобраться со сложностью"}],"hig":[{"key":"Simplicity","title":"Принцип Simplicity — простота","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},{"key":"Toolbars","title":"Toolbars — панели инструментов","url":"https://developer.apple.com/design/human-interface-guidelines/toolbars"}],"w3c":[],"aiDesign":"### R10.3 — обязательно\nВопрос: Частое — на виду, редкое — раскрывается, когда нужно?\nКритерии:\n1. Частые действия видны сразу.\n2. Редкие настройки доступны через одно понятное раскрытие.\n3. Редкое не занимает место частого.\nТревожный признак: Редкая техническая настройка занимает место на главном экране, а частое действие скрыто.","aiBuild":"### R10.3 — обязательно\nВопрос: Частое — на виду, редкое — раскрывается, когда нужно?\nКритерии:\n1. Частые действия видны сразу.\n2. Редкие настройки доступны через одно понятное раскрытие.\n3. Редкое не занимает место частого.\nТревожный признак: Редкая техническая настройка занимает место на главном экране, а частое действие скрыто."},{"id":"R2.6","principle":2,"text":"Ключевой сценарий прошёл на прототипе человек, который не участвовал в проектировании, без объяснений автора; места, где понадобилась подсказка, записаны как находки","level":"О","stage":"М","check":"Дизайн-ревью","group":"path","q":"Человек, который не проектировал решение, прошёл ключевой сценарий без подсказок?","qDesign":"Человек, который не проектировал решение, прошёл ключевой сценарий без подсказок?","how":"Дайте прототип ревьюеру и молчите. Записывайте каждое место, где он остановился, ошибся или спросил, что делать.","howDesign":"Дайте прототип ревьюеру и молчите. Записывайте каждое место, где он остановился, ошибся или спросил, что делать.","red":"Автор ведёт ревьюера по экранам: «здесь нажимаем, тут откроется…».","criteria":["Ключевой сценарий собран прототипом от входа до результата.","Его прошёл человек, который не участвовал в проектировании.","Автор не объяснял интерфейс во время прохождения.","Каждое место, где понадобилась подсказка, записано как находка."],"criteriaDesign":["Ключевой сценарий собран прототипом от входа до результата.","Его прошёл человек, который не участвовал в проектировании.","Автор не объяснял интерфейс во время прохождения.","Каждое место, где понадобилась подсказка, записано как находка."],"quick":false,"ive":[{"n":5,"title":"Любопытство помогает пересматривать предположения"},{"n":6,"title":"Прототип должен позволять испытать существенные свойства"}],"hig":[{"key":"Craft","title":"Принцип Craft — качество исполнения","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R2.6 — обязательно\nВопрос: Человек, который не проектировал решение, прошёл ключевой сценарий без подсказок?\nКритерии:\n1. Ключевой сценарий собран прототипом от входа до результата.\n2. Его прошёл человек, который не участвовал в проектировании.\n3. Автор не объяснял интерфейс во время прохождения.\n4. Каждое место, где понадобилась подсказка, записано как находка.\nТревожный признак: Автор ведёт ревьюера по экранам: «здесь нажимаем, тут откроется…».","aiBuild":"### R2.6 — обязательно\nВопрос: Человек, который не проектировал решение, прошёл ключевой сценарий без подсказок?\nКритерии:\n1. Ключевой сценарий собран прототипом от входа до результата.\n2. Его прошёл человек, который не участвовал в проектировании.\n3. Автор не объяснял интерфейс во время прохождения.\n4. Каждое место, где понадобилась подсказка, записано как находка.\nТревожный признак: Автор ведёт ревьюера по экранам: «здесь нажимаем, тут откроется…»."},{"id":"R4.1","principle":4,"text":"Видно, где находится человек, что выбрано и как вернуться; в вебе работают адреса страниц, новая вкладка и кнопка «Назад»","level":"О","stage":"М+Р","check":"Прохождение сценария","group":"path","q":"На любом шаге понятно, где я, что выбрано и как вернуться назад?","qDesign":"Показано, где человек находится, что выбрано и как вернуться; для веба — что меняет адрес страницы?","how":"Пройдите сценарий и на каждом шаге ответьте: где я, что выбрано, как вернуться. В вебе нажмите «Назад», откройте страницу в новой вкладке, обновите её.","howDesign":"На каждом фрейме ответьте: где я, что выбрано, как вернуться. Для веба проверьте аннотацию: какие переходы меняют адрес и куда ведёт «Назад».","red":"После перехода пропадает выбранный пункт навигации; «Назад» выбрасывает из сценария.","criteria":["На каждом шаге видно, где находится человек.","Видно, что выбрано сейчас.","Есть понятный путь назад, и он не теряет сделанную работу.","В вебе «Назад», обновление страницы и открытие в новой вкладке работают так, как ожидает человек."],"criteriaDesign":["На каждом фрейме видно, где находится человек.","Видно, что выбрано сейчас.","Показан путь назад.","Для веба в аннотации указано, какие переходы меняют адрес страницы."],"quick":true,"ive":[{"n":8,"title":"Целостность охватывает весь путь человека"}],"hig":[{"key":"Sidebars","title":"Sidebars — боковые панели","url":"https://developer.apple.com/design/human-interface-guidelines/sidebars"},{"key":"Agency","title":"Принцип Agency — самостоятельность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R4.1 — обязательно\nВопрос: Показано, где человек находится, что выбрано и как вернуться; для веба — что меняет адрес страницы?\nКритерии:\n1. На каждом фрейме видно, где находится человек.\n2. Видно, что выбрано сейчас.\n3. Показан путь назад.\n4. Для веба в аннотации указано, какие переходы меняют адрес страницы.\nТревожный признак: После перехода пропадает выбранный пункт навигации; «Назад» выбрасывает из сценария.","aiBuild":"### R4.1 — обязательно\nВопрос: На любом шаге понятно, где я, что выбрано и как вернуться назад?\nКритерии:\n1. На каждом шаге видно, где находится человек.\n2. Видно, что выбрано сейчас.\n3. Есть понятный путь назад, и он не теряет сделанную работу.\n4. В вебе «Назад», обновление страницы и открытие в новой вкладке работают так, как ожидает человек.\nТревожный признак: После перехода пропадает выбранный пункт навигации; «Назад» выбрасывает из сценария."},{"id":"R2.3","principle":2,"text":"Обязательными являются только шаги и поля, необходимые сейчас; остальное запрашивается позже","level":"О","stage":"М","check":"Ревью формы","group":"path","q":"Каждое обязательное поле и шаг действительно нужны именно сейчас?","qDesign":"Каждое обязательное поле и шаг действительно нужны именно сейчас?","how":"Для каждого обязательного поля спросите: можно ли закончить задачу без него или запросить его позже? Посчитайте шаги до результата.","howDesign":"Для каждого обязательного поля спросите: можно ли закончить задачу без него или запросить его позже? Посчитайте шаги до результата.","red":"Десять полей регистрации до того, как человек увидел пользу.","criteria":["Каждое обязательное поле нужно для результата прямо сейчас.","Сведения, которые можно запросить позже, на старте не обязательны.","Нет шагов, без которых задача всё равно решается."],"criteriaDesign":["Каждое обязательное поле нужно для результата прямо сейчас.","Сведения, которые можно запросить позже, на старте не обязательны.","Нет шагов, без которых задача всё равно решается."],"quick":false,"ive":[{"n":2,"title":"Простота требует разобраться со сложностью"}],"hig":[{"key":"Simplicity","title":"Принцип Simplicity — простота","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},{"key":"Text fields","title":"Text fields — текстовые поля","url":"https://developer.apple.com/design/human-interface-guidelines/text-fields"}],"w3c":[],"aiDesign":"### R2.3 — обязательно\nВопрос: Каждое обязательное поле и шаг действительно нужны именно сейчас?\nКритерии:\n1. Каждое обязательное поле нужно для результата прямо сейчас.\n2. Сведения, которые можно запросить позже, на старте не обязательны.\n3. Нет шагов, без которых задача всё равно решается.\nТревожный признак: Десять полей регистрации до того, как человек увидел пользу.","aiBuild":"### R2.3 — обязательно\nВопрос: Каждое обязательное поле и шаг действительно нужны именно сейчас?\nКритерии:\n1. Каждое обязательное поле нужно для результата прямо сейчас.\n2. Сведения, которые можно запросить позже, на старте не обязательны.\n3. Нет шагов, без которых задача всё равно решается.\nТревожный признак: Десять полей регистрации до того, как человек увидел пользу."},{"id":"R2.4","principle":2,"text":"Уже введённые данные переиспользуются, контекст сохраняется при переходе между шагами","level":"Р","stage":"М+Р","check":"Прохождение сценария","group":"path","q":"Данные не приходится вводить дважды, и контекст сохраняется между шагами?","qDesign":"Показано, где переиспользуются уже введённые данные и как сохраняется контекст между шагами?","how":"Пройдите сценарий и отметьте каждый повторный ввод и каждое место, где нужно помнить что-то с прошлого шага.","howDesign":"Проследите данные по фреймам: подставлено ли дальше то, что человек ввёл раньше? Остаётся ли ввод на месте при возврате на шаг?","red":"Адрес доставки нужно ввести снова на шаге оплаты.","criteria":["Человек не вводит одни и те же данные дважды.","При возврате на предыдущий шаг введённое остаётся на месте.","Сведения с прошлого шага видны там, где нужны, — их не приходится помнить."],"criteriaDesign":["Показано, где подставляются уже введённые данные.","Показано, что при возврате на шаг ввод сохраняется.","Сведения с прошлых шагов видны там, где нужны."],"quick":false,"ive":[{"n":1,"title":"Забота о человеке выражается в устройстве продукта"},{"n":8,"title":"Целостность охватывает весь путь человека"}],"hig":[{"key":"Agency","title":"Принцип Agency — самостоятельность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R2.4 — рекомендуется\nВопрос: Показано, где переиспользуются уже введённые данные и как сохраняется контекст между шагами?\nКритерии:\n1. Показано, где подставляются уже введённые данные.\n2. Показано, что при возврате на шаг ввод сохраняется.\n3. Сведения с прошлых шагов видны там, где нужны.\nТревожный признак: Адрес доставки нужно ввести снова на шаге оплаты.","aiBuild":"### R2.4 — рекомендуется\nВопрос: Данные не приходится вводить дважды, и контекст сохраняется между шагами?\nКритерии:\n1. Человек не вводит одни и те же данные дважды.\n2. При возврате на предыдущий шаг введённое остаётся на месте.\n3. Сведения с прошлого шага видны там, где нужны, — их не приходится помнить.\nТревожный признак: Адрес доставки нужно ввести снова на шаге оплаты."},{"id":"R4.3","principle":4,"text":"Область поиска названа; применённые фильтры и ограничения видны и снимаются по отдельности","level":"О","stage":"М","check":"Прохождение сценария поиска","group":"path","q":"Поиск говорит, где он ищет, а применённые фильтры видны и снимаются по одному?","qDesign":"Поиск говорит, где он ищет, а применённые фильтры видны и снимаются по одному?","how":"Примените два фильтра и поищите. Видно ли, что фильтры действуют? Можно ли снять один, не сбрасывая всё? Отличается ли «нет совпадений» от «пока нет данных»? Поиска и фильтров нет — «Н/п».","howDesign":"Примените два фильтра и поищите. Видно ли, что фильтры действуют? Можно ли снять один, не сбрасывая всё? Отличается ли «нет совпадений» от «пока нет данных»? Поиска и фильтров нет — «Н/п».","red":"Пустой список без объяснения, что виноват забытый фильтр.","criteria":["Подпись поиска говорит, где он ищет.","Применённые фильтры видны: на самом элементе управления или в строке фильтров, если элементы спрятаны.","Каждый фильтр снимается отдельно.","«Нет совпадений» отличается от «пока нет данных» и предлагает изменить запрос."],"criteriaDesign":["Подпись поиска говорит, где он ищет.","Применённые фильтры видны: на самом элементе управления или в строке фильтров, если элементы спрятаны.","Каждый фильтр снимается отдельно.","«Нет совпадений» отличается от «пока нет данных» и предлагает изменить запрос."],"quick":false,"ive":[],"hig":[{"key":"Searching","title":"Searching — поиск","url":"https://developer.apple.com/design/human-interface-guidelines/searching"}],"w3c":[],"aiDesign":"### R4.3 — обязательно\nВопрос: Поиск говорит, где он ищет, а применённые фильтры видны и снимаются по одному?\nКритерии:\n1. Подпись поиска говорит, где он ищет.\n2. Применённые фильтры видны: на самом элементе управления или в строке фильтров, если элементы спрятаны.\n3. Каждый фильтр снимается отдельно.\n4. «Нет совпадений» отличается от «пока нет данных» и предлагает изменить запрос.\nТревожный признак: Пустой список без объяснения, что виноват забытый фильтр.","aiBuild":"### R4.3 — обязательно\nВопрос: Поиск говорит, где он ищет, а применённые фильтры видны и снимаются по одному?\nКритерии:\n1. Подпись поиска говорит, где он ищет.\n2. Применённые фильтры видны: на самом элементе управления или в строке фильтров, если элементы спрятаны.\n3. Каждый фильтр снимается отдельно.\n4. «Нет совпадений» отличается от «пока нет данных» и предлагает изменить запрос.\nТревожный признак: Пустой список без объяснения, что виноват забытый фильтр."},{"id":"R4.4","principle":4,"text":"Подписи полей постоянны и не исчезают при вводе; формат объяснён до ошибки; ошибка связана с конкретным полем","level":"О","stage":"М","check":"Ревью формы","group":"path","q":"Подписи полей не исчезают при вводе, формат объяснён заранее, ошибка стоит у своего поля?","qDesign":"Подписи полей не исчезают при вводе, формат объяснён заранее, ошибка стоит у своего поля?","how":"Посмотрите заполненную форму: понятно ли, что в каком поле? Есть ли подсказка формата до ввода? Где показана ошибка?","howDesign":"Посмотрите заполненную форму: понятно ли, что в каком поле? Есть ли подсказка формата до ввода? Где показана ошибка?","red":"Подпись только в плейсхолдере; ошибки одним списком вверху формы.","criteria":["У каждого поля есть подпись, которая не исчезает при вводе.","Требования к формату видны до ввода.","Ошибка показана у того поля, к которому относится.","Ошибка не появляется, пока человек ещё вводит значение."],"criteriaDesign":["У каждого поля есть подпись, которая не исчезает при вводе.","Требования к формату видны до ввода.","Ошибка показана у того поля, к которому относится.","Ошибка не появляется, пока человек ещё вводит значение."],"quick":false,"ive":[],"hig":[{"key":"Text fields","title":"Text fields — текстовые поля","url":"https://developer.apple.com/design/human-interface-guidelines/text-fields"}],"w3c":[],"aiDesign":"### R4.4 — обязательно\nВопрос: Подписи полей не исчезают при вводе, формат объяснён заранее, ошибка стоит у своего поля?\nКритерии:\n1. У каждого поля есть подпись, которая не исчезает при вводе.\n2. Требования к формату видны до ввода.\n3. Ошибка показана у того поля, к которому относится.\n4. Ошибка не появляется, пока человек ещё вводит значение.\nТревожный признак: Подпись только в плейсхолдере; ошибки одним списком вверху формы.","aiBuild":"### R4.4 — обязательно\nВопрос: Подписи полей не исчезают при вводе, формат объяснён заранее, ошибка стоит у своего поля?\nКритерии:\n1. У каждого поля есть подпись, которая не исчезает при вводе.\n2. Требования к формату видны до ввода.\n3. Ошибка показана у того поля, к которому относится.\n4. Ошибка не появляется, пока человек ещё вводит значение.\nТревожный признак: Подпись только в плейсхолдере; ошибки одним списком вверху формы."},{"id":"R4.6","principle":4,"text":"Недоступная команда позволяет понять причину недоступности","level":"О","stage":"М","check":"Ревью состояний","group":"path","q":"Если команда недоступна, понятно почему?","qDesign":"Если команда недоступна, понятно почему?","how":"Найдите все неактивные кнопки и пункты меню. Сможет ли человек понять, что сделать, чтобы команда стала доступной?","howDesign":"Найдите все неактивные кнопки и пункты меню. Сможет ли человек понять, что сделать, чтобы команда стала доступной?","red":"Серая кнопка «Отправить» без намёка, какое поле не заполнено.","criteria":["У каждой недоступной команды можно понять причину недоступности.","Понятно, что сделать, чтобы команда стала доступной."],"criteriaDesign":["У каждой недоступной команды можно понять причину недоступности.","Понятно, что сделать, чтобы команда стала доступной."],"quick":false,"ive":[],"hig":[{"key":"Buttons","title":"Buttons — кнопки","url":"https://developer.apple.com/design/human-interface-guidelines/buttons"}],"w3c":[],"aiDesign":"### R4.6 — обязательно\nВопрос: Если команда недоступна, понятно почему?\nКритерии:\n1. У каждой недоступной команды можно понять причину недоступности.\n2. Понятно, что сделать, чтобы команда стала доступной.\nТревожный признак: Серая кнопка «Отправить» без намёка, какое поле не заполнено.","aiBuild":"### R4.6 — обязательно\nВопрос: Если команда недоступна, понятно почему?\nКритерии:\n1. У каждой недоступной команды можно понять причину недоступности.\n2. Понятно, что сделать, чтобы команда стала доступной.\nТревожный признак: Серая кнопка «Отправить» без намёка, какое поле не заполнено."},{"id":"R10.2","principle":10,"text":"После удаления или скрытия элемента сценарий пройден заново: упрощение не перенесло сложность в память человека","level":"О","stage":"М","check":"Повторное прохождение сценария","group":"path","q":"После упрощения человеку не нужно помнить, где что спрятано?","qDesign":"После упрощения человеку не нужно помнить, где что спрятано?","how":"Если что-то убрали или спрятали, пройдите сценарий заново как новичок. Находится ли скрытое без подсказки? Не стало ли больше поиска?","howDesign":"Если что-то убрали или спрятали, пройдите сценарий заново как новичок. Находится ли скрытое без подсказки? Не стало ли больше поиска?","red":"Все действия собраны в одно меню: кнопок стало меньше, а поиска — больше.","criteria":["Скрытые действия находятся без подсказки.","После упрощения искать приходится не больше, чем раньше.","Человеку не нужно помнить, где лежит нужная команда."],"criteriaDesign":["Скрытые действия находятся без подсказки.","После упрощения искать приходится не больше, чем раньше.","Человеку не нужно помнить, где лежит нужная команда."],"quick":true,"ive":[{"n":2,"title":"Простота требует разобраться со сложностью"}],"hig":[{"key":"Simplicity","title":"Принцип Simplicity — простота","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R10.2 — обязательно\nВопрос: После упрощения человеку не нужно помнить, где что спрятано?\nКритерии:\n1. Скрытые действия находятся без подсказки.\n2. После упрощения искать приходится не больше, чем раньше.\n3. Человеку не нужно помнить, где лежит нужная команда.\nТревожный признак: Все действия собраны в одно меню: кнопок стало меньше, а поиска — больше.","aiBuild":"### R10.2 — обязательно\nВопрос: После упрощения человеку не нужно помнить, где что спрятано?\nКритерии:\n1. Скрытые действия находятся без подсказки.\n2. После упрощения искать приходится не больше, чем раньше.\n3. Человеку не нужно помнить, где лежит нужная команда.\nТревожный признак: Все действия собраны в одно меню: кнопок стало меньше, а поиска — больше."},{"id":"R7.2","principle":7,"text":"Изменение привычной навигации, названий и расположения действий сопровождается планом перехода; старые ссылки продолжают работать","level":"О","stage":"М","check":"Запись решения","group":"path","q":"Если меняется привычная навигация или названия, есть план перехода, и старые ссылки работают?","qDesign":"Если меняется привычная навигация или названия, есть план перехода, и старые ссылки работают?","how":"Сравните с текущей версией продукта. Для каждого переезда: как человек найдёт старое действие, откроются ли сохранённые ссылки? Ничего не меняется — «Н/п».","howDesign":"Сравните с текущей версией продукта. Для каждого переезда: как человек найдёт старое действие, откроются ли сохранённые ссылки? Ничего не меняется — «Н/п».","red":"Раздел переименован и перенесён без подсказки, закладки ведут на ошибку.","criteria":["Для каждого переехавшего действия или раздела есть подсказка, где он теперь.","Старые ссылки и закладки открываются.","Привычные названия не изменены без причины."],"criteriaDesign":["Для каждого переехавшего действия или раздела есть подсказка, где он теперь.","Старые ссылки и закладки открываются.","Привычные названия не изменены без причины."],"quick":false,"ive":[{"n":8,"title":"Целостность охватывает весь путь человека"}],"hig":[{"key":"Familiarity","title":"Принцип Familiarity — знакомость","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R7.2 — обязательно\nВопрос: Если меняется привычная навигация или названия, есть план перехода, и старые ссылки работают?\nКритерии:\n1. Для каждого переехавшего действия или раздела есть подсказка, где он теперь.\n2. Старые ссылки и закладки открываются.\n3. Привычные названия не изменены без причины.\nТревожный признак: Раздел переименован и перенесён без подсказки, закладки ведут на ошибку.","aiBuild":"### R7.2 — обязательно\nВопрос: Если меняется привычная навигация или названия, есть план перехода, и старые ссылки работают?\nКритерии:\n1. Для каждого переехавшего действия или раздела есть подсказка, где он теперь.\n2. Старые ссылки и закладки открываются.\n3. Привычные названия не изменены без причины.\nТревожный признак: Раздел переименован и перенесён без подсказки, закладки ведут на ошибку."},{"id":"R4.2","principle":4,"text":"Одинаковые сущности и действия называются одинаково во всём продукте; кнопки называют результат («Сохранить изменения», а не «ОК»)","level":"О","stage":"М","check":"Сверка со словарём продукта","group":"words","q":"Одна вещь везде называется одинаково, а кнопки говорят, что произойдёт?","qDesign":"Одна вещь везде называется одинаково, а кнопки говорят, что произойдёт?","how":"Выпишите названия сущностей и действий по сценарию и сверьте со словарём продукта. Прочитайте каждую кнопку отдельно: понятен ли результат?","howDesign":"Выпишите названия сущностей и действий по сценарию и сверьте со словарём продукта. Прочитайте каждую кнопку отдельно: понятен ли результат?","red":"«Проект», «пространство» и «доска» про одно и то же; кнопки «ОК» и «Применить».","criteria":["Каждая сущность называется одинаково на всех экранах.","Названия совпадают со словарём продукта.","Каждая кнопка называет результат действия, а не просто «ОК»."],"criteriaDesign":["Каждая сущность называется одинаково на всех экранах.","Названия совпадают со словарём продукта.","Каждая кнопка называет результат действия, а не просто «ОК»."],"quick":true,"ive":[{"n":8,"title":"Целостность охватывает весь путь человека"}],"hig":[{"key":"Writing","title":"Writing — тексты","url":"https://developer.apple.com/design/human-interface-guidelines/writing"},{"key":"Familiarity","title":"Принцип Familiarity — знакомость","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R4.2 — обязательно\nВопрос: Одна вещь везде называется одинаково, а кнопки говорят, что произойдёт?\nКритерии:\n1. Каждая сущность называется одинаково на всех экранах.\n2. Названия совпадают со словарём продукта.\n3. Каждая кнопка называет результат действия, а не просто «ОК».\nТревожный признак: «Проект», «пространство» и «доска» про одно и то же; кнопки «ОК» и «Применить».","aiBuild":"### R4.2 — обязательно\nВопрос: Одна вещь везде называется одинаково, а кнопки говорят, что произойдёт?\nКритерии:\n1. Каждая сущность называется одинаково на всех экранах.\n2. Названия совпадают со словарём продукта.\n3. Каждая кнопка называет результат действия, а не просто «ОК».\nТревожный признак: «Проект», «пространство» и «доска» про одно и то же; кнопки «ОК» и «Применить»."},{"id":"R4.7","principle":4,"text":"Сообщения об ошибках объясняют, что произошло и что делать дальше, без обвинений; технический код, если нужен, идёт после объяснения, а не вместо него","level":"О","stage":"М","check":"Ревью текстов","group":"words","q":"Сообщения об ошибках говорят, что случилось и что делать дальше?","qDesign":"Сообщения об ошибках говорят, что случилось и что делать дальше?","how":"Соберите все тексты ошибок сценария в один список и прочитайте подряд. Каждое должно отвечать на два вопроса: что произошло и что мне теперь делать.","howDesign":"Соберите все тексты ошибок сценария в один список и прочитайте подряд. Каждое должно отвечать на два вопроса: что произошло и что мне теперь делать.","red":"«Ошибка 500», «Неверный ввод», «Что-то пошло не так».","criteria":["Каждое сообщение об ошибке объясняет, что произошло.","Каждое сообщение говорит, что делать дальше.","В сообщениях нет обвинений человека.","Технический код, если он нужен, стоит после объяснения, а не вместо него."],"criteriaDesign":["Каждое сообщение об ошибке объясняет, что произошло.","Каждое сообщение говорит, что делать дальше.","В сообщениях нет обвинений человека.","Технический код, если он нужен, стоит после объяснения, а не вместо него."],"quick":true,"ive":[{"n":1,"title":"Забота о человеке выражается в устройстве продукта"}],"hig":[{"key":"Writing","title":"Writing — тексты","url":"https://developer.apple.com/design/human-interface-guidelines/writing"}],"w3c":[],"aiDesign":"### R4.7 — обязательно\nВопрос: Сообщения об ошибках говорят, что случилось и что делать дальше?\nКритерии:\n1. Каждое сообщение об ошибке объясняет, что произошло.\n2. Каждое сообщение говорит, что делать дальше.\n3. В сообщениях нет обвинений человека.\n4. Технический код, если он нужен, стоит после объяснения, а не вместо него.\nТревожный признак: «Ошибка 500», «Неверный ввод», «Что-то пошло не так».","aiBuild":"### R4.7 — обязательно\nВопрос: Сообщения об ошибках говорят, что случилось и что делать дальше?\nКритерии:\n1. Каждое сообщение об ошибке объясняет, что произошло.\n2. Каждое сообщение говорит, что делать дальше.\n3. В сообщениях нет обвинений человека.\n4. Технический код, если он нужен, стоит после объяснения, а не вместо него.\nТревожный признак: «Ошибка 500», «Неверный ввод», «Что-то пошло не так»."},{"id":"R4.8","principle":4,"text":"Продукт объясняет себя формой, йсом.","Пустые состояния не повторяют то, что и так видно на экране.","Состояния вроде «просрочено» или «выбрано» показаны формой, значком и положением; слово есть, только если без него смысл неясен.","Уведомление после действия сообщает только то, чего не видно на экране: отмену, результат в другом месте или ошибку.","Подписи, подсказки и ошибки сказаны коротко, без вступлений и пересказа.","Каждое оставшееся пояснение нужно: без него человек, впервые видящий экран, ошибётся."],"quick":true,"ive":[{"n":9,"title":"Детали помогают понять, как обращаться с продуктом"},{"n":2,"title":"Простота требует разобраться со сложностью"}],"hig":[{"key":"Writing","title":"Writing — тексты","url":"https://developer.apple.com/design/human-interface-guidelines/writing"},{"key":"Simplicity","title":"Принцип Simplicity — простота","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R4.8 — обязательно\nВопрос: Экран понятен без поясняющих подписей: форма, порядок и состояние говорят сами за себя?\nКритерии:\n1. Под заголовками экрана, разделов и колонок нет подписей, которые объясняют, как пользоваться интерфейсом.\n2. Пустые состояния не повторяют то, что и так видно на экране.\n3. Состояния вроде «просрочено» или «выбрано» показаны формой, значком и положением; слово есть, только если без него смысл неясен.\n4. Уведомление после действия сообщает только то, чего не видно на экране: отмену, результат в другом месте или ошибку.\n5. Подписи, подсказки и ошибки сказаны коротко, без вступлений и пересказа.\n6. Каждое оставшееся пояснение нужно: без него человек, впервые видящий экран, ошибётся.\nТревожный признак: Подпись под каждой колонкой «Сюда попадают задачи, которые…», пустое состояние на три строки, «Просрочено · 30 сен» там, где хватает красной даты.","aiBuild":"### R4.8 — обязательно\nВопрос: Экран понятен без поясняющих подписей: форма, порядок и состояние говорят сами за себя?\nКритерии:\n1. Под заголовками экрана, разделов и колонок нет подписей, которые объясняют, как пользоваться интерфейсом.\n2. Пустые состояния не повторяют то, что и так видно на экране.\n3. Состояния вроде «просрочено» или «выбрано» показаны формой, значком и положением; слово есть, только если без него смысл неясен.\n4. Уведомление после действия сообщает только то, чего не видно на экране: отмену, результат в другом месте или ошибку.\n5. Подписи, подсказки и ошибки сказаны коротко, без вступлений и пересказа.\n6. Каждое оставшееся пояснение нужно: без него человек, впервые видящий экран, ошибётся.\nТревожный признак: Подпись под каждой колонкой «Сюда попадают задачи, которые…», пустое состояние на три строки, «Просрочено · 30 сен» там, где хватает красной даты."},{"id":"R6.2","principle":6,"text":"Стоимость, последствия и необратимость видны до подтверждения; подтверждение необратимого действия называет объект и последствия","level":"О","stage":"М","check":"Ревью сценария","group":"words","q":"До нажатия видно, сколько это стоит, что произойдёт и можно ли отменить?","qDesign":"До нажатия видно, сколько это стоит, что произойдёт и можно ли отменить?","how":"Найдите действия с ценой, последствиями или без отмены. Видно ли это до подтверждения? Называет ли подтверждение удаления конкретный объект?","howDesign":"Найдите действия с ценой, последствиями или без отмены. Видно ли это до подтверждения? Называет ли подтверждение удаления конкретный объект?","red":"«Вы уверены?» без названия того, что удаляется; итоговая цена появляется после оплаты.","criteria":["Цена и обязательные платежи видны до подтверждения.","Последствия действия описаны до подтверждения.","Видно, можно ли потом отменить действие.","Подтверждение необратимого действия называет конкретный объект."],"criteriaDesign":["Цена и обязательные платежи видны до подтверждения.","Последствия действия описаны до подтверждения.","Видно, можно ли потом отменить действие.","Подтверждение необратимого действия называет конкретный объект."],"quick":true,"ive":[],"hig":[{"key":"Alerts","title":"Alerts — предупреждения","url":"https://developer.apple.com/design/human-interface-guidelines/alerts"},{"key":"Responsibility","title":"Принцип Responsibility — ответственность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R6.2 — обязательно\nВопрос: До нажатия видно, сколько это стоит, что произойдёт и можно ли отменить?\nКритерии:\n1. Цена и обязательные платежи видны до подтверждения.\n2. Последствия действия описаны до подтверждения.\n3. Видно, можно ли потом отменить действие.\n4. Подтверждение необратимого действия называет конкретный объект.\nТревожный признак: «Вы уверены?» без названия того, что удаляется; итоговая цена появляется после оплаты.","aiBuild":"### R6.2 — обязательно\nВопрос: До нажатия видно, сколько это стоит, что произойдёт и можно ли отменить?\nКритерии:\n1. Цена и обязательные платежи видны до подтверждения.\n2. Последствия действия описаны до подтверждения.\n3. Видно, можно ли потом отменить действие.\n4. Подтверждение необратимого действия называет конкретный объект.\nТревожный признак: «Вы уверены?» без названия того, что удаляется; итоговая цена появляется после оплаты."},{"id":"R6.4","principle":6,"text":"Отказ, отмена, отписка и изменение выбора не спрятаны и не сложнее согласия","level":"О","stage":"М","check":"Ревью сценария","group":"words","q":"Отказаться, отменить или отписаться так же легко, как согласиться?","qDesign":"Отказаться, отменить или отписаться так же легко, как согласиться?","how":"Сравните путь согласия и путь отказа: число шагов, заметность кнопок, формулировки.","howDesign":"Сравните путь согласия и путь отказа: число шагов, заметность кнопок, формулировки.","red":"Яркая кнопка «Подключить» и мелкая серая ссылка «Нет, спасибо».","criteria":["Отказ так же легко найти, как согласие.","Отказ занимает не больше шагов, чем согласие.","Формулировки отказа не давят и не стыдят."],"criteriaDesign":["Отказ так же легко найти, как согласие.","Отказ занимает не больше шагов, чем согласие.","Формулировки отказа не давят и не стыдят."],"quick":false,"ive":[{"n":12,"title":"Ответственность продолжается после выпуска"}],"hig":[{"key":"Agency","title":"Принцип Agency — самостоятельность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},{"key":"Responsibility","title":"Принцип Responsibility — ответственность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R6.4 — обязательно\nВопрос: Отказаться, отменить или отписаться так же легко, как согласиться?\nКритерии:\n1. Отказ так же легко найти, как согласие.\n2. Отказ занимает не больше шагов, чем согласие.\n3. Формулировки отказа не давят и не стыдят.\nТревожный признак: Яркая кнопка «Подключить» и мелкая серая ссылка «Нет, спасибо».","aiBuild":"### R6.4 — обязательно\nВопрос: Отказаться, отменить или отписаться так же легко, как согласиться?\nКритерии:\n1. Отказ так же легко найти, как согласие.\n2. Отказ занимает не больше шагов, чем согласие.\n3. Формулировки отказа не давят и не стыдят.\nТревожный признак: Яркая кнопка «Подключить» и мелкая серая ссылка «Нет, спасибо»."},{"id":"R6.5","principle":6,"text":"Предварительные, устаревшие, неполные и автоматически созданные данные обозначены как таковые","level":"О","stage":"М","check":"Ревью состояний","group":"words","q":"Предварительные, устаревшие и сгенерированные данные помечены?","qDesign":"Предварительные, устаревшие и сгенерированные данные помечены?","how":"Найдите данные, которые могут быть неточными: черновики, кэш, прогнозы, результат ИИ. Видно ли, что на них нельзя полностью опираться?","howDesign":"Найдите данные, которые могут быть неточными: черновики, кэш, прогнозы, результат ИИ. Видно ли, что на них нельзя полностью опираться?","red":"Сгенерированный текст выглядит как проверенный; у данных нет даты обновления.","criteria":["Черновики и предварительные данные помечены.","У данных, которые могут устареть, видно время обновления.","Результат автоматизации или ИИ помечен как таковой."],"criteriaDesign":["Черновики и предварительные данные помечены.","У данных, которые могут устареть, видно время обновления.","Результат автоматизации или ИИ помечен как таковой."],"quick":false,"ive":[{"n":12,"title":"Ответственность продолжается после выпуска"}],"hig":[{"key":"Responsibility","title":"Принцип Responsibility — ответственность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R6.5 — обязательно\nВопрос: Предварительные, устаревшие и сгенерированные данные помечены?\nКритерии:\n1. Черновики и предварительные данные помечены.\n2. У данных, которые могут устареть, видно время обновления.\n3. Результат автоматизации или ИИ помечен как таковой.\nТревожный признак: Сгенерированный текст выглядит как проверенный; у данных нет даты обновления.","aiBuild":"### R6.5 — обязательно\nВопрос: Предварительные, устаревшие и сгенерированные данные помечены?\nКритерии:\n1. Черновики и предварительные данные помечены.\n2. У данных, которые могут устареть, видно время обновления.\n3. Результат автоматизации или ИИ помечен как таковой.\nТревожный признак: Сгенерированный текст выглядит как проверенный; у данных нет даты обновления."},{"id":"R8.1","principle":8,"text":"Для каждого экрана спроектированы и реализованы состояния: загрузка, нет данных, нет совпадений, ошибка, успех, нет доступа, частичный результат","level":"О","stage":"М+Р","check":"Макет со всеми состояниями, проверка в реализации","group":"trouble","q":"У каждого экрана работают состояния: загрузка, нет данных, нет совпадений, ошибка, успех, нет доступа, частичный результат?","qDesign":"Для каждого экрана нарисованы все состояния: загрузка, нет данных, нет совпадений, ошибка, успех, нет доступа, частичный результат?","how":"Вызовите каждое состояние в продукте: новый аккаунт, поиск без результатов, отключённая сеть, чужая ссылка без прав.","howDesign":"Откройте страницу «Состояния» и пройдите по экранам сценария. Каждое недостающее состояние — отдельная находка.","red":"Нарисован только «счастливый путь», ошибка — на усмотрение разработчика.","criteria":["Загрузка показана.","Пустое состояние показывает, как начать, если это не видно на экране.","«Нет совпадений» сохраняет запрос и предлагает его изменить.","Ошибка объясняет, что случилось, и даёт повторить.","Успех показывает подтверждённый результат.","«Нет доступа» объясняет причину и что делать.","Частичный результат показывает, что получилось, а что нет."],"criteriaDesign":["Есть фрейм загрузки.","Есть фрейм пустого состояния; если способ начать не виден на экране, он показан.","Есть фрейм «нет совпадений».","Есть фрейм ошибки с действием «Повторить».","Есть фрейм успеха.","Есть фрейм «нет доступа».","Есть фрейм частичного результата."],"quick":true,"ive":[{"n":6,"title":"Прототип должен позволять испытать существенные свойства"},{"n":7,"title":"Способ реализации входит в дизайн"}],"hig":[{"key":"Craft","title":"Принцип Craft — качество исполнения","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"}],"w3c":[],"aiDesign":"### R8.1 — обязательно\nВопрос: Для каждого экрана нарисованы все состояния: загрузка, нет данных, нет совпадений, ошибка, успех, нет доступа, частичный результат?\nКритерии:\n1. Есть фрейм загрузки.\n2. Есть фрейм пустого состояния; если способ начать не виден на экране, он показан.\n3. Есть фрейм «нет совпадений».\n4. Есть фрейм ошибки с действием «Повторить».\n5. Есть фрейм успеха.\n6. Есть фрейм «нет доступа».\n7. Есть фрейм частичного результата.\nТревожный признак: Нарисован только «счастливый путь», ошибка — на усмотрение разработчика.","aiBuild":"### R8.1 — обязательно\nВопрос: У каждого экрана работают состояния: загрузка, нет данных, нет совпадений, ошибка, успех, нет доступа, частичный результат?\nКритерии:\n1. Загрузка показана.\n2. Пустое состояние показывает, как начать, если это не видно на экране.\n3. «Нет совпадений» сохраняет запрос и предлагает его изменить.\n4. Ошибка объясняет, что случилось, и даёт повторить.\n5. Успех показывает подтверждённый результат.\n6. «Нет доступа» объясняет причину и что делать.\n7. Частичный результат показывает, что получилось, а что нет.\nТревожный признак: Нарисован только «счастливый путь», ошибка — на усмотрение разработчика."},{"id":"R8.2","principle":8,"text":"При исправимой ошибке введённые данные сохраняются; повторить можно только неудавшуюся часть","level":"О","stage":"М+Р","check":"Сценарий с ошибкой","group":"trouble","q":"После исправимой ошибки введённое сохраняется, а повторить можно только неудачное?","qDesign":"Описано, что сохраняется при ошибке и что можно повторить?","how":"Заполните форму, отключите сеть и отправьте. Сохранился ли ввод? Для пакетных операций: можно ли повторить только неудачные элементы?","howDesign":"Найдите фрейм ошибки: виден ли на нём ввод человека? Есть ли действие «Повторить», и что именно оно повторяет?","red":"После ошибки сервера форма очищается.","criteria":["После исправимой ошибки введённые данные на месте.","Можно повторить только неудавшуюся часть.","Успешные результаты не теряются при повторе."],"criteriaDesign":["На фрейме ошибки виден ввод человека.","Есть действие «Повторить», и описано, что именно оно повторяет.","Описано, что сохраняется при ошибке."],"quick":true,"ive":[{"n":1,"title":"Забота о человеке выражается в устройстве продукта"}],"hig":[{"key":"Agency","title":"Принцип Agency — самостоятельность","url":"https://developer.apple.com/design/human-interface-guidelines/design-principles"},{"key":"Text fields","title":"Text fields — текстовые поля","url":"https://developer.apple.com/design/human-interface-guidelines/text-fields"}],"w3c":[],"aiDesign":"### R8.2 — обязательно\nВопрос: Описано, что сохраняется при ошибке и что можно повторить?\nКритерии:\n1. На фрейме ошибки виден ввод человека.\n2. Есть действие «Повторить», и
